<title> ملفي الشخصي - جمعية مواهب المنان - دار القرآن والحديث</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f5f0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body.profile-page {
            padding-bottom: calc(92px + env(safe-area-inset-bottom));
        }
        .profile-shell { width: min(100%, 48rem); margin-inline: auto; }
        .profile-logo img { height: clamp(70px, 18vw, 96px); }
        .profile-header,
        .profile-card {
            background: rgba(255,255,255,.94);
            border: 1px solid rgba(15,23,42,.08);
            box-shadow: 0 16px 34px rgba(15,23,42,.08);
        }
        .profile-header {
            border-radius: 22px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
        }
        .profile-card { border-radius: 22px; padding: 18px; }
        .profile-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            white-space: nowrap;
        }
        .doc-row { gap: 12px; }
        .payment-table { min-width: 0; }
        .nav-bottom { 
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: white; border-top: 1px solid #e5e7eb;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            padding-bottom: env(safe-area-inset-bottom);
        }
        @media (max-width: 640px) {
            body.profile-page { padding: 10px 10px calc(98px + env(safe-area-inset-bottom)); }
            .profile-shell { max-width: none; }
            .profile-header { align-items: stretch; flex-direction: column; padding: 16px; border-radius: 20px; }
            .profile-header h1 { font-size: 1.35rem; line-height: 1.25; }
            .profile-back { width: 100%; }
            .profile-card { padding: 14px; border-radius: 18px; }
            .doc-row { align-items: stretch; flex-direction: column; }
            .doc-row > span:last-child { text-align: center; width: 100%; }
            .payment-table th,
            .payment-table td { padding: 10px 8px; font-size: 12px; }
            .nav-bottom span { font-size: 10px; }
            .nav-bottom .max-w-4xl { padding-inline: 8px; }
        }
      body { padding-bottom: 96px; }
  .mawahib-nav-padding { height: 82px; }
</style>
</head>
<body class="profile-page p-4 md:p-8">

    <!-- Logo tel que demandé -->
    <div class="profile-logo flex justify-center mb-5 mt-1">
        <img src="logo.webp" alt="مواهب المنان" class="object-contain drop-shadow-md">
    </div>

    <main class="profile-shell space-y-4 sm:space-y-6">
        
        <!-- En-tête -->
        <header class="profile-header">
            <div>
                <h1 class="text-2xl font-black text-blue-900">الملف الإداري </h1>
                <p class="text-sm text-gray-500 font-bold mt-1" id="student-fullname">جاري التحميل...</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
            
            <!-- Informations Personnelles & Documents -->
            <section class="profile-card h-fit">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">الوثائق المطلوبة</h2>
                
                <ul class="space-y-4">
                    <li class="doc-row flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <span class="font-bold text-gray-600 text-sm">نسخة من بطاقة التعريف للأب أو الام<br><span class="text-xs text-gray-400"></span></span>                        
                        <span id="badge-cin" class="px-3 py-1 text-xs font-black rounded-full">جاري التحميل...</span>
                    </li>
                    <li class="doc-row flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <span class="font-bold text-gray-600 text-sm">عقد الازدياد<br><span class="text-xs text-gray-400"></span></span>
                        <span id="badge-birthcert" class="px-3 py-1 text-xs font-black rounded-full">جاري التحميل...</span>
                    </li>
                </ul>
                <p class="text-xs text-gray-400 mt-4 text-center">يتم تحديث هذه المعلومات من طرف الإدارة</p>
            </section>

            <!-- Situation Financière -->
            <section class="profile-card">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">الأداءات الشهرية </h2>
                
                <div class="overflow-x-auto">
                    <table class="payment-table w-full text-right text-sm">
                        <thead class="bg-gray-50 text-gray-600">
                            <tr>
                                <th class="p-3 rounded-r-xl">الشهر </th>
                                <th class="p-3 rounded-l-xl text-left">الحالة </th>
                            </tr>
                        </thead>
                        <tbody id="payments-table-body" class="divide-y divide-gray-100">
                            <!-- Généré via JS -->
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const session = Auth.getSession();
            if (!session) {
                window.location.href = "login.html";
                return;
            }

            // Afficher le nom
            document.getElementById('student-fullname').innerText = session.prenom + " " + session.nom;

            // 🔧 CORRECTION : Ajoute 'await' car getProfile() est async
            const profile = await Auth.getProfile(session.username);

            // Gérer l'affichage des badges de documents
            const badgeCin = document.getElementById('badge-cin');
            if(profile.cinProvided) {
                badgeCin.innerText = "مُسلَّم ✅";
                badgeCin.className = "px-3 py-1 text-xs font-black rounded-full bg-emerald-100 text-emerald-700";
            } else {
                badgeCin.innerText = "غير مُسلَّم  ❌";
                badgeCin.className = "px-3 py-1 text-xs font-black rounded-full bg-rose-100 text-rose-700";
            }

            const badgeBirth = document.getElementById('badge-birthcert');
            if(profile.birthCertProvided) {
                badgeBirth.innerText = "مُسلَّم  ✅";
                badgeBirth.className = "px-3 py-1 text-xs font-black rounded-full bg-emerald-100 text-emerald-700";
            } else {
                badgeBirth.innerText = "غير مُسلَّم  ❌";
                badgeBirth.className = "px-3 py-1 text-xs font-black rounded-full bg-rose-100 text-rose-700";
            }

            // Gérer le tableau des paiements
            const tbody = document.getElementById('payments-table-body');
            if(!profile.payments || profile.payments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-gray-400 font-bold text-xs">لا توجد سجلات أداء حالياً </td></tr>`;
            } else {
                profile.payments.forEach(p => {
                    const tr = document.createElement('tr');
                    
                    let statusHtml = '';
                    if(p.status === 'payé') {
                        statusHtml = `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded font-bold text-xs">خالص ✅</span>`;
                    } else {
                        statusHtml = `<span class="bg-amber-100 text-amber-700 px-2 py-1 rounded font-bold text-xs">في الانتظار ⏳</span>`;
                    }

                    tr.innerHTML = `
                        <td class="p-3 font-bold text-gray-700">${p.month}</td>
                        <td class="p-3 text-left">${statusHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        });
    </script>
    <nav class="nav-bottom">
    <div class="max-w-4xl mx-auto flex justify-around items-center h-16 px-4">
        <a href="dashboard.html#surah-focus" onclick="if(window.scrollToJourneyFocus){scrollToJourneyFocus(event)}"
           class="flex flex-col items-center gap-1 text-emerald-700 hover:text-emerald-900 transition group">

</nav>
