<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حصة القراءة - مواهب المنان</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260720-global-latest-1"></script>
  <script src="registry.js"></script>
  <link rel="stylesheet" href="platform-theme.css?v=20260720-global-latest-1">
  <script src="platform-theme.js?v=20260720-global-latest-1"></script>
  <style>
    :root {
      --teacher-bg: #f5f5f7;
      --teacher-ink: #111827;
      --teacher-muted: #6b7280;
      --teacher-line: rgba(17, 24, 39, .1);
      --teacher-card: rgba(255, 255, 255, .82);
      --teacher-shadow: 0 18px 50px rgba(15, 23, 42, .08);
      --teacher-green: #064e3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(6, 78, 59, .10), transparent 34rem),
        linear-gradient(180deg, #fbfbfd, var(--teacher-bg));
      color: var(--teacher-ink);
      font-family: 'Tajawal', sans-serif;
      padding: 18px;
    }
    .shell { width: min(1180px, 100%); margin: 0 auto; }
    .glass {
      background: var(--teacher-card);
      border: 1px solid rgba(255, 255, 255, .72);
      box-shadow: var(--teacher-shadow);
      backdrop-filter: blur(18px);
    }
    .topbar {
      border-radius: 28px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .icon-logo {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: #fff;
      object-fit: contain;
      padding: 5px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .08);
    }
    .btn {
      border: 0;
      border-radius: 999px;
      min-height: 42px;
      padding: 0 16px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: var(--teacher-green);
      color: #fff;
      box-shadow: 0 12px 28px rgba(6, 78, 59, .18);
    }
    .btn-soft { background: rgba(17, 24, 39, .06); color: #111827; }
    .btn-danger { background: #fff1f2; color: #be123c; }
    .panel {
      border-radius: 26px;
      padding: 16px;
    }
    .session-strip {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: end;
      margin: 14px 0;
    }
    .input {
      width: 100%;
      border: 1px solid var(--teacher-line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .9);
      min-height: 44px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 800;
      color: #111827;
      outline: none;
    }
    .input:focus {
      border-color: rgba(6, 78, 59, .45);
      box-shadow: 0 0 0 4px rgba(6, 78, 59, .08);
    }
    .label {
      display: block;
      color: var(--teacher-muted);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 14px;
      align-items: start;
    }
    .student-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .student-card {
      border: 1px solid rgba(17, 24, 39, .08);
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      padding: 14px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .05);
    }
    .recitation-entry {
      border: 1px solid rgba(17, 24, 39, .08);
      border-radius: 18px;
      background: #f8fafc;
      padding: 10px;
      margin-top: 10px;
    }
    .student-card.absent {
      opacity: .62;
      background: rgba(248, 250, 252, .88);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
      background: rgba(6, 78, 59, .08);
      color: var(--teacher-green);
      white-space: nowrap;
    }
    .small-muted { color: var(--teacher-muted); font-size: 12px; font-weight: 800; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: 16px;
      align-items: center;
      justify-content: center;
      background: rgba(17, 24, 39, .45);
      backdrop-filter: blur(10px);
    }
    .modal-overlay.open { display: flex; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      border-radius: 18px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 900;
      z-index: 80;
      box-shadow: 0 18px 40px rgba(15, 23, 42, .22);
    }
    .prof-tab-panel.hidden { display: none; }
    .prof-nav {
      position: fixed;
      left: 50%;
      bottom: 14px;
      z-index: 70;
      transform: translateX(-50%);
      width: min(680px, calc(100% - 12px));
      border-radius: 24px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(17,24,39,.08);
      box-shadow: 0 18px 44px rgba(15,23,42,.16);
      backdrop-filter: blur(18px);
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
      padding: 6px;
      transition: transform .22s ease, opacity .22s ease;
    }
    .prof-nav.is-hidden {
      transform: translate(-50%, calc(100% + 24px));
      opacity: .08;
      pointer-events: none;
    }
    .prof-nav button, .prof-nav a {
      border: 0;
      border-radius: 14px;
      min-height: 48px;
      background: transparent;
      color: #475569;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
      font-size: 11px;
      line-height: 1.1;
      white-space: nowrap;
    }
    .prof-nav button span:last-child, .prof-nav a span:last-child {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prof-nav button.active, .prof-nav a.active {
      background: var(--teacher-green);
      color: #fff;
      box-shadow: 0 10px 24px rgba(6,78,59,.18);
    }
    .prof-nav .icon { font-size: 18px; line-height: 1; flex: 0 0 auto; }
    .student-history-grid {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    .student-history-list {
      display: grid;
      gap: 8px;
    }
    .student-history-button {
      width: 100%;
      border: 1px solid rgba(17, 24, 39, .08);
      border-radius: 18px;
      background: rgba(255, 255, 255, .86);
      padding: 12px;
      text-align: right;
      font-weight: 900;
      cursor: pointer;
    }
    .student-history-button.active {
      border-color: rgba(6, 78, 59, .38);
      background: rgba(6, 78, 59, .08);
      color: var(--teacher-green);
    }
    .history-timeline {
      display: grid;
      gap: 10px;
    }
    .history-item {
      border: 1px solid rgba(17, 24, 39, .08);
      border-radius: 18px;
      background: rgba(255, 255, 255, .76);
      padding: 12px;
    }
    @media (max-width: 900px) {
      body { padding: 10px 10px 96px; }
      .topbar { border-radius: 22px; padding: 14px; }
      .layout { grid-template-columns: 1fr; }
      .student-history-grid { grid-template-columns: 1fr; }
      .session-strip { grid-template-columns: 1fr 1fr; }
      .session-strip .date-cell { grid-column: 1 / -1; }
      .student-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      body { padding-inline: 8px; }
      .topbar { align-items: stretch; flex-direction: column; padding: 12px; border-radius: 18px; }
      .topbar > div:first-child { width: 100%; }
      .topbar-actions { flex-direction: row; width: 100%; }
      .topbar-actions .btn { flex: 1 1 0; width: auto; min-height: 44px; padding: 0 10px; }
      .icon-logo { width: 48px; height: 48px; border-radius: 14px; }
      .panel { padding: 12px; border-radius: 18px; }
      .student-history-button, .history-item, .recitation-entry { border-radius: 14px; }
      .session-strip { grid-template-columns: 1fr; }
      .student-card { border-radius: 20px; }
      .student-actions { grid-template-columns: 1fr !important; }
      .prof-nav { bottom: max(6px, env(safe-area-inset-bottom)); width: calc(100% - 8px); border-radius: 14px; padding: 4px; gap: 3px; }
      .prof-nav button, .prof-nav a { min-height: 50px; border-radius: 10px; font-size: 9px; padding-inline: 1px; }
      .prof-nav .icon { font-size: 16px; }
    }

    .label { display:block; margin:0 2px 7px; color:#52606d; font-size:12px; font-weight:900; }
    .student-card-toggle { display:none; }
.prof-nav a { text-decoration:none; }
    @media (max-width: 360px) {
      .prof-nav button, .prof-nav a { font-size: 0; gap: 0; }
      .prof-nav button span:last-child, .prof-nav a span:last-child { display: none; }
      .prof-nav .icon { font-size: 20px; }
    }
    body[data-prof-page="homework"] [data-prof-panel]:not([data-prof-panel="homework"]),
    body[data-prof-page="students"] [data-prof-panel]:not([data-prof-panel="students"]),
    body[data-prof-page="report"] [data-prof-panel]:not([data-prof-panel="report"]) { display:none !important; }
    body[data-prof-page="homework"] [data-prof-panel="homework"],
    body[data-prof-page="students"] [data-prof-panel="students"],
    body[data-prof-page="report"] [data-prof-panel="report"] { display:block; }
    @media (max-width: 640px) {
      .shell { width:100%; padding:8px 8px 92px; }
      .topbar { padding:12px; border-radius:16px; }
      .topbar-actions .btn-soft { display:none; }
      .panel { padding:14px; border-radius:16px; }
      .input { min-height:52px; font-size:16px; }
      textarea.input { min-height:110px; }
      .btn { min-height:50px; }
      .student-card { padding:14px; }
      .student-card-toggle { display:flex; width:100%; margin-top:10px; justify-content:center; }
      .student-card:not(.is-open) .recitation-entries,
      .student-card:not(.is-open) .student-actions,
      .student-card:not(.is-open) > button.btn:not(.student-card-toggle),
      .student-card:not(.is-open) > p { display:none; }
      .student-history-grid { grid-template-columns:1fr; }
    }

  </style>

</head>
<body data-prof-page="recitation">
  <div class="shell">
    <header class="topbar glass">
      <div class="flex items-center gap-3 min-w-0">
        <img src="logo.webp" alt="مواهب المنان" class="icon-logo" onerror="this.style.display='none'">
        <div class="min-w-0">
          <p class="small-muted" id="prof-page-kicker">حصة القراءة</p>
          <h1 class="text-2xl md:text-3xl font-black truncate">أستاذ <span id="prof-name">...</span></h1>
          <p class="text-sm font-extrabold text-gray-500 truncate">القسم: <span id="prof-classe">...</span></p>
        </div>
      </div>
      <div class="topbar-actions flex gap-2">
        <button onclick="refreshProfDashboard()" class="btn btn-soft">تحديث</button>
        <button onclick="deconnexion()" class="btn btn-danger">خروج</button>
      </div>
    </header>

    <section class="session-strip prof-tab-panel" data-prof-panel="recitation">
      <div class="date-cell panel glass">
        <label class="label">تاريخ الحصة</label>
        <input type="date" id="session-date" class="input">
      </div>
      <button onclick="setAllPresent(true)" class="btn btn-soft">الكل حاضر</button>
      <button onclick="saveDailySession()" class="btn btn-primary">حفظ الحصة</button>
    </section>

    <main class="layout prof-tab-panel" data-prof-panel="recitation">
      <section class="panel glass">
        <div class="flex items-center justify-between gap-3 mb-4">
          <div>
            <p class="small-muted">قائمة الطلاب</p>
            <h2 class="text-xl font-black">سجّل القراءة مباشرة</h2>
          </div>
          <span id="student-count" class="pill">0 طالب</span>
        </div>
        <div id="recitation-list" class="student-list"></div>
      </section>

      <aside class="space-y-3">

    <section class="panel glass prof-tab-panel hidden" data-prof-panel="homework">

      </div>

        <label><span class="label">السورة</span><input type="text" id="homework-surate" class="input" list="surah-list" placeholder="اختر السورة"></label>
        <label><span class="label">من الآية</span><input type="number" id="homework-debut" min="1" class="input" placeholder="1"></label>

        <label class="md:col-span-2"><span class="label">تاريخ التسليم</span><input type="date" id="homework-date" class="input"></label>
      </div>
      <button onclick="sendHomeworkFromTab()" class="btn btn-primary w-full mt-3">إرسال الواجب</button>
      <div class="mt-5">
        <p class="small-muted mb-2">واجبات مفتوحة</p>
        <div id="homework-summary" class="space-y-2"></div>
      </div>
    </section>

    <section class="panel glass prof-tab-panel hidden" data-prof-panel="report">
      <div class="flex items-center justify-between gap-3 mb-4">
        <div>
          <p class="small-muted">رسالة للإدارة</p>
          <h2 class="text-xl font-black">إبلاغ الإدارة</h2>
        </div>
      </div>
      <label><span class="label">الطالب المعني</span><select id="report-student" class="input mb-3"></select></label>
      <label><span class="label">الرسالة</span><textarea id="admin-report-text" rows="6" class="input" placeholder="اكتب ملاحظة مختصرة وواضحة"></textarea></label>

    <section class="panel glass prof-tab-panel hidden" data-prof-panel="students">

  <nav class="prof-nav" id="prof-nav" aria-label="التنقل">
    <a href="dashboard_prof.html" data-prof-tab="home"><span class="icon">🏠</span><span>الرئيسية</span></a>
    <a href="prof-recitation.html" data-prof-tab="recitation"><span class="icon">📖</span><span>القراءة</span></a>
    <a href="prof-students.html" data-prof-tab="students"><span class="icon">👤</span><span>الطلاب</span></a>
    <a href="prof-homework.html" data-prof-tab="homework"><span class="icon">📘</span><span>الواجبات</span></a>
    <a href="prof-report.html" data-prof-tab="report"><span class="icon">📩</span><span>الإدارة</span></a>
    <button type="button" data-settings-toggle data-prof-tab="settings"><span class="icon">⚙</span><span>الإعدادات</span></button>
  </nav>

  <div id="modal-devoir" class="modal-overlay" onclick="handleModalClick(event)">
    <div class="glass w-full max-w-md rounded-[28px] overflow-hidden">
      <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center">
        <div>
          <h2 class="text-lg font-black">واجب مراجعة</h2>
          <p class="small-muted mt-1">إلى: <span id="devoir-student-name"></span></p>
        </div>
        <button onclick="fermerModalDevoir()" class="btn btn-soft">إغلاق</button>
      </div>
      <input type="hidden" id="devoir-student-id">
      <div class="p-6 space-y-3">
        <input type="text" id="devoir-surate" class="input" list="surah-list" placeholder="السورة">
        <datalist id="surah-list"></datalist>
        <div class="grid grid-cols-2 gap-3">
          <input type="number" id="devoir-debut" min="1" class="input" placeholder="من الآية">
          <input type="number" id="devoir-fin" min="1" class="input" placeholder="إلى الآية">
        </div>
        <input type="date" id="devoir-date" class="input">
        <button onclick="envoyerDevoir()" class="btn btn-primary w-full">إرسال الواجب</button>
      </div>
    </div>
  </div>

  <script>
    let session = null;
    let myStudents = [];
    let myDevoirs = [];
    let myProf = null;
    let myClassSessions = [];
    let teacherNotesCache = {};
    let progressCache = {};
    let selectedHistoryStudent = sessionStorage.getItem('mawahib_prof_student') || '';
    const PROF_PAGE = document.body.dataset.profPage || 'recitation';

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    }

    function escapeArg(value) {
      return escapeHtml(String(value || '').split('\\').join('\\\\').split("'").join("\\'").split('\n').join(' '));
    }

    function homeworkFor(student) {
      return myDevoirs.filter(d => d.student_id === student.username);
    }

    function lastTeacherNote(student) {
      const notes = teacherNotesCache[student.username] || [];
      return notes[0] || null;
    }

    function normalizeSurahId(value) {
      return String(value || '').trim().toLowerCase().replace(/_/g, '-');
    }

    function surahMeta(id) {
      const normalized = normalizeSurahId(id);
      if (typeof SURAH_REGISTRY === 'undefined') return null;
      return SURAH_REGISTRY.find(s => normalizeSurahId(s.id) === normalized || normalizeSurahId(s.nameAr) === normalized) || null;
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).slice(0, 16);
      return date.toLocaleDateString('ar-MA', { day: 'numeric', month: 'long' });
    }

    function studentProgressItems(student) {
      const progress = progressCache[student.username] || {};
      const seen = new Set();
      return Object.keys(progress).map(id => {
        const row = progress[id] || {};
        const meta = surahMeta(id);
        const normalized = normalizeSurahId(meta?.id || id);
        if (seen.has(normalized)) return null;
        seen.add(normalized);
        const activities = row.activities || {};
        const activityDates = Object.values(activities).map(item => item && item.date).filter(Boolean);
        const lastDate = row.completed_at || row.completedAt || activityDates.sort().slice(-1)[0] || '';
        return {
          id: normalized,
          name: meta?.nameAr || id,
          completed: Boolean(row.completed_at || row.completedAt || row.is_completed),
          score: row.global_score || row.globalScore || row.score || '',
          activityCount: Object.keys(activities).length,
          lastDate
        };
      }).filter(Boolean).sort((a, b) => String(b.lastDate).localeCompare(String(a.lastDate)));
    }

    function studentPriority(student) {
      const pending = homeworkFor(student).filter(d => d.statut !== 'termine').length;
      const absences = (myClassSessions || []).filter(item => (item.absent || []).includes(student.username)).length;
      const notes = teacherNotesCache[student.username] || [];
      const weak = notes.filter(n => /ضعيف|إعادة|غائب|متردد|ناقص/.test((n.validation || '') + ' ' + (n.comment || ''))).length;
      return pending * 3 + absences * 2 + weak * 2;
    }

    function surahOptions() {
      if (typeof SURAH_REGISTRY === 'undefined') return '';
      return SURAH_REGISTRY
        .filter(s => s.available)
        .map(s => '<option value="' + escapeHtml(s.nameAr) + '">' + escapeHtml(s.nameFr || s.id) + '</option>')
        .join('');
    }

    async function initProfDashboard() {
      session = Auth.getSession();
      if (!session || session.role !== 'prof') {
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('prof-name').textContent = session.prenom;
      document.getElementById('prof-classe').textContent = session.nom;
      document.getElementById('session-date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('surah-list').innerHTML = surahOptions();
      await refreshProfDashboard(false);
      switchProfTab(PROF_PAGE);
      updateProfPageTitle();
    }

    async function refreshProfDashboard(show = true) {
      const profs = await Auth.getProfs();
      const users = await Auth.getAllUsers();
      myDevoirs = await Auth.getDevoirs('prof', session.username);
      myClassSessions = typeof Auth.getClassSessions === 'function' ? await Auth.getClassSessions(session.username) : [];
      myProf = profs[session.username] || { students: [] };
      myStudents = (myProf.students || []).map(id => users[id]).filter(Boolean);
      teacherNotesCache = {};
      progressCache = {};
      if (typeof Auth.getTeacherNotes === 'function') {
        await Promise.all(myStudents.map(async student => {
          teacherNotesCache[student.username] = await Auth.getTeacherNotes(student.username);
        }));
      }
      if (typeof Auth.getProgress === 'function') {
        await Promise.all(myStudents.map(async student => {
          progressCache[student.username] = await Auth.getProgress(student.username);
        }));
      }
      selectedHistoryStudent = normalizeSelectedProfStudent(selectedHistoryStudent);
      if (selectedHistoryStudent) rememberSelectedProfStudent(selectedHistoryStudent);
      renderAll();
      if (show) showToast('تم التحديث');
    }

    function renderAll() {
      document.getElementById('student-count').textContent = myStudents.length + ' طالب';
      renderReportOptions();
      renderHomeworkOptions();
      renderRecitationList();
      renderListenQueue();
      renderHomeworkSummary();
      syncSelectedProfStudentControls();
      renderStudentHistory();
    }

    function getProfStudentStorageKey() {
      return 'mawahib_prof_student_' + ((session && session.username) || 'teacher');
    }

    function rememberSelectedProfStudent(username) {
      if (!username) return;
      sessionStorage.setItem('mawahib_prof_student', username);
      localStorage.setItem('mawahib_prof_student', username);
      localStorage.setItem(getProfStudentStorageKey(), username);
    }

    function getStudentNameByUsername(username) {
      const student = myStudents.find(item => item.username === username);
      return student ? (student.prenom + ' ' + student.nom) : '';
    }

    function normalizeSelectedProfStudent(username) {
      const candidates = [
        username,
        selectedHistoryStudent,
        sessionStorage.getItem('mawahib_prof_student'),
        localStorage.getItem(getProfStudentStorageKey()),
        localStorage.getItem('mawahib_prof_student')
      ];
      const candidate = candidates.find(value => value && myStudents.some(student => student.username === value));
      if (candidate) return candidate;
      return myStudents[0] ? myStudents[0].username : '';
    }

    function syncSelectedProfStudentControls() {
      const username = normalizeSelectedProfStudent();
      if (!username) return;
      selectedHistoryStudent = username;

      const homeworkSelect = document.getElementById('homework-student');
      if (homeworkSelect && Array.from(homeworkSelect.options).some(option => option.value === username)) {
        homeworkSelect.value = username;
      }

      const reportSelect = document.getElementById('report-student');
      const studentName = getStudentNameByUsername(username);
      if (reportSelect && studentName && Array.from(reportSelect.options).some(option => option.value === studentName)) {
        reportSelect.value = studentName;
      }
    }

    function setSelectedProfStudent(username, options = {}) {
      const next = normalizeSelectedProfStudent(username);
      if (!next) return '';
      selectedHistoryStudent = next;
      rememberSelectedProfStudent(next);
      syncSelectedProfStudentControls();
      if (options.renderHistory !== false) renderStudentHistory();
      return next;
    }

    function handleHomeworkStudentChange(select) {
      if (select && select.value) setSelectedProfStudent(select.value);
    }

    function handleReportStudentChange(select) {
      if (!select || !select.value) return;
      const student = myStudents.find(item => (item.prenom + ' ' + item.nom) === select.value);
      if (student) setSelectedProfStudent(student.username);
    }

    function renderHomeworkOptions() {
      const select = document.getElementById('homework-student');
      if (!select) return;
      select.innerHTML = myStudents.map(student => {
        const name = student.prenom + ' ' + student.nom;
        return '<option value="' + escapeHtml(student.username) + '">' + escapeHtml(name) + '</option>';
      }).join('');
      select.onchange = () => handleHomeworkStudentChange(select);
      syncSelectedProfStudentControls();
      document.getElementById('homework-date').value = new Date().toISOString().slice(0, 10);
    }

    function renderRecitationList() {
      const box = document.getElementById('recitation-list');
      if (!myStudents.length) {
        box.innerHTML = '<p class="text-center text-gray-400 font-extrabold py-8">لا يوجد طلاب في هذا القسم.</p>';
        return;
      }
      box.innerHTML = myStudents.map(student => {
        const name = student.prenom + ' ' + student.nom;
        const pending = homeworkFor(student).filter(d => d.statut !== 'termine').length;
        const note = lastTeacherNote(student);
        return '<article class="student-card" data-card="' + escapeHtml(student.username) + '">'
          + '<div class="flex items-start justify-between gap-3">'
          + '<div class="min-w-0"><h3 class="text-lg font-black truncate">' + escapeHtml(name) + '</h3><p class="small-muted truncate">' + escapeHtml(student.username) + '</p></div>'
          + '<label class="pill cursor-pointer"><input type="checkbox" class="attendance-check accent-emerald-700" value="' + escapeHtml(student.username) + '" onchange="toggleAbsent(this)" checked> حاضر</label>'
          + '</div>'
          + '<button type="button" onclick="toggleStudentCard(\'' + escapeArg(student.username) + '\')" class="btn btn-primary student-card-toggle">تسجيل القراءة</button>'
          + '<div class="recitation-entries" data-student="' + escapeHtml(student.username) + '">'
          + recitationEntryHtml(student.username, 0)
          + '</div>'
          + '<div class="student-actions grid grid-cols-[1fr_auto] gap-2 mt-3 items-center">'
          + '<button onclick="addRecitationEntry(\'' + escapeArg(student.username) + '\')" class="btn btn-soft">إضافة قراءة آخر</button>'
          + '<span class="pill">' + pending + ' واجب</span>'
          + '</div>'
          + '<button onclick="openStudentHistory(\'' + escapeArg(student.username) + '\')" class="btn btn-soft w-full mt-2">ملف الطالب</button>'
          + '<button onclick="openHomeworkFromStudent(\'' + escapeArg(student.username) + '\', \'' + escapeArg(name) + '\')" class="btn btn-soft w-full mt-2">واجب مراجعة</button>'
          + (note ? '<p class="small-muted mt-3">آخر ملاحظة: ' + escapeHtml(note.validation || '') + ' ' + escapeHtml(note.comment || '') + '</p>' : '')
          + '</article>';
      }).join('');
    }

    function toggleStudentCard(username) {
      setSelectedProfStudent(username, { renderHistory: false });
      const card = document.querySelector('[data-card="' + username + '"]');
      if (!card) return;
      const opening = !card.classList.contains('is-open');
      document.querySelectorAll('.student-card.is-open').forEach(item => item.classList.remove('is-open'));
      card.classList.toggle('is-open', opening);
      if (opening) setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 40);
    }

    function renderStudentHistory() {
      const list = document.getElementById('student-history-list');
      const detail = document.getElementById('student-history-detail');
      if (!list || !detail) return;
      if (!myStudents.length) {
        list.innerHTML = '';
        detail.innerHTML = '<p class="small-muted text-center py-6">لا يوجد طلاب.</p>';
        return;
      }
      if (!myStudents.some(student => student.username === selectedHistoryStudent)) selectedHistoryStudent = myStudents[0].username;
      if (selectedHistoryStudent) rememberSelectedProfStudent(selectedHistoryStudent);
      syncSelectedProfStudentControls();
      list.innerHTML = myStudents.map(student => {
        const name = student.prenom + ' ' + student.nom;
        const items = studentProgressItems(student);
        const completed = items.filter(item => item.completed).length;
        return '<button type="button" class="student-history-button ' + (student.username === selectedHistoryStudent ? 'active' : '') + '" onclick="selectStudentHistory(\'' + escapeArg(student.username) + '\')">'
          + '<div>' + escapeHtml(name) + '</div>'
          + '<p class="small-muted mt-1">' + completed + ' سورة</p>'
          + '</button>';
      }).join('');
      const student = myStudents.find(item => item.username === selectedHistoryStudent) || myStudents[0];
      const name = student.prenom + ' ' + student.nom;
      const progressItems = studentProgressItems(student);
      const completed = progressItems.filter(item => item.completed);
      const lastProgress = progressItems[0] || null;
      const notes = teacherNotesCache[student.username] || [];
      const homeworks = homeworkFor(student);
      const pending = homeworks.filter(item => item.statut !== 'termine');
      const recentNotes = notes.slice(0, 5).map(note => {
        const range = note.scope === 'جزء' && (note.ayahStart || note.ayahEnd)
          ? ' من ' + escapeHtml(note.ayahStart || '?') + ' إلى ' + escapeHtml(note.ayahEnd || '?')
          : '';
        return '<div class="history-item"><strong>' + escapeHtml(note.surah || 'قراءة') + range + '</strong><p class="small-muted mt-1">' + escapeHtml(note.validation || '') + ' ' + escapeHtml(note.comment || '') + '</p><p class="small-muted mt-1">' + escapeHtml(formatDate(note.savedAt || note.date)) + '</p></div>';
      }).join('');
      const recentProgress = progressItems.slice(0, 6).map(item => {
        return '<div class="history-item"><strong>' + escapeHtml(item.name) + '</strong><p class="small-muted mt-1">' + (item.completed ? 'مكتملة' : 'قيد التعلم') + (item.score ? ' · ' + escapeHtml(item.score) + '%' : '') + '</p><p class="small-muted mt-1">' + escapeHtml(formatDate(item.lastDate)) + '</p></div>';
      }).join('');
      detail.innerHTML =
        '<div class="history-item"><h3 class="text-xl font-black">' + escapeHtml(name) + '</h3><p class="small-muted mt-1">تعلم ' + completed.length + ' سورة. آخر نشاط: ' + escapeHtml(lastProgress ? lastProgress.name : 'لا يوجد') + '</p></div>'
        + '<div class="grid grid-cols-2 gap-2"><div class="history-item"><strong>' + pending.length + '</strong><p class="small-muted mt-1">واجب مفتوح</p></div><div class="history-item"><strong>' + notes.length + '</strong><p class="small-muted mt-1">قراءة مسجل</p></div></div>'
        + '<div><p class="small-muted mb-2">آخر تعلم في المنصة</p>' + (recentProgress || '<div class="history-item small-muted">لا يوجد نشاط بعد.</div>') + '</div>'
        + '<div><p class="small-muted mb-2">آخر قراءة عند الأستاذ</p>' + (recentNotes || '<div class="history-item small-muted">لا يوجد قراءة محفوظ.</div>') + '</div>';
    }

    function selectStudentHistory(username) {
      setSelectedProfStudent(username);
    }

    function openStudentHistory(username) {
      setSelectedProfStudent(username, { renderHistory: false });
      window.location.href = 'prof-students.html';
    }

    function recitationEntryHtml(username, index) {
      const key = escapeHtml(username + '_' + index + '_' + Date.now());
      return '<div class="recitation-entry" data-student="' + escapeHtml(username) + '">'
        + '<div class="flex items-center justify-between gap-2 mb-2"><span class="small-muted">قراءة</span><button type="button" onclick="removeRecitationEntry(this)" class="text-xs font-black text-rose-600">حذف</button></div>'
        + '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">'
        + '<input class="input recited-surah" list="surah-list" placeholder="السورة التي رتلها الطالب">'
        + '<select class="input recitation-scope" onchange="toggleVerseRangeBySelect(this)"><option value="كاملة">السورة كاملة</option><option value="جزء">من آية إلى آية</option></select>'
        + '</div>'
        + '<div class="grid grid-cols-2 gap-2 mt-2 verse-range hidden" data-range="' + key + '">'
        + '<input type="number" min="1" class="input recitation-start" placeholder="من الآية">'
        + '<input type="number" min="1" class="input recitation-end" placeholder="إلى الآية">'
        + '</div>'
        + '<select class="input recitation-result mt-2"><option value="ممتاز">ممتاز</option><option value="جيد جدا">جيد جدا</option><option value="جيد">جيد</option><option value="يحتاج مراجعة">يحتاج مراجعة</option><option value="غير متقن">غير متقن</option><option value="غائب">غائب</option></select>'
        + '<textarea class="input recitation-note mt-2" rows="2" placeholder="ملاحظة قصيرة"></textarea>'
        + '</div>';
    }

    function addRecitationEntry(username) {
      setSelectedProfStudent(username, { renderHistory: false });
      const box = document.querySelector('.recitation-entries[data-student="' + username + '"]');
      if (!box) return;
      box.insertAdjacentHTML('beforeend', recitationEntryHtml(username, box.querySelectorAll('.recitation-entry').length));
    }

    function removeRecitationEntry(button) {
      const entry = button.closest('.recitation-entry');
      const box = entry ? entry.parentElement : null;
      if (!entry || !box || box.querySelectorAll('.recitation-entry').length <= 1) return;
      entry.remove();
    }

    function renderListenQueue() {
      const box = document.getElementById('listen-queue');
      const queue = myStudents
        .map(student => ({ student, score: studentPriority(student) }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);
      box.innerHTML = queue.length ? queue.map((item, index) => {
        const name = item.student.prenom + ' ' + item.student.nom;
        return '<div class="rounded-2xl bg-white/70 border border-gray-100 p-3"><strong>' + (index + 1) + '. ' + escapeHtml(name) + '</strong><p class="small-muted mt-1">' + (item.score > 0 ? 'يحتاج متابعة' : 'جاهز للقراءة') + '</p></div>';
      }).join('') : '<p class="small-muted text-center py-4">لا توجد أولوية الآن.</p>';
    }

    function renderHomeworkSummary() {
      const box = document.getElementById('homework-summary');
      const open = myDevoirs.filter(d => d.statut !== 'termine').slice(0, 5);
      box.innerHTML = open.length ? open.map(item => {
        return '<div class="rounded-2xl bg-white/70 border border-gray-100 p-3"><strong>' + escapeHtml(item.surate) + '</strong><p class="small-muted mt-1">آية ' + escapeHtml(item.aya_debut) + ' إلى ' + escapeHtml(item.aya_fin) + '</p></div>';
      }).join('') : '<p class="small-muted text-center py-4">لا توجد واجبات مفتوحة.</p>';
    }

    function renderReportOptions() {
      const select = document.getElementById('report-student');
      if (!select) return;
      select.innerHTML =
        '<option value="القسم كاملا">القسم كاملا</option>' +
        myStudents.map(student => {
          const name = student.prenom + ' ' + student.nom;
          return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
        }).join('');
      select.onchange = () => handleReportStudentChange(select);
      syncSelectedProfStudentControls();
    }

    function updateProfPageTitle() {
      const labels = { recitation: 'حصة القراءة', students: 'متابعة الطلاب', homework: 'إرسال الواجبات', report: 'التواصل مع الإدارة' };
      const kicker = document.getElementById('prof-page-kicker');
      if (kicker) kicker.textContent = labels[PROF_PAGE] || labels.recitation;
      document.title = (labels[PROF_PAGE] || labels.recitation) + ' | مواهب المنان';
    }

    function switchProfTab(name) {
      document.querySelectorAll('[data-prof-panel]').forEach(panel => {
        panel.classList.toggle('hidden', panel.dataset.profPanel !== name);
      });
      document.querySelectorAll('[data-prof-tab]').forEach(button => {
        button.classList.toggle('active', button.dataset.profTab === name);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function initProfNavAutoHide() {
      const nav = document.getElementById('prof-nav');
      if (!nav) return;
      let timer = null;
      let lastY = window.scrollY || 0;
      const update = () => {
        const y = window.scrollY || 0;
        nav.classList.toggle('is-hidden', y > lastY && y > 80);
        lastY = y;
      };
      window.addEventListener('scroll', update, { passive: true });
    }

    function setAllPresent(value) {
      document.querySelectorAll('.attendance-check').forEach(input => {
        input.checked = value;
        toggleAbsent(input);
      });
    }

    function toggleAbsent(input) {
      const card = document.querySelector('[data-card="' + input.value + '"]');
      if (card) card.classList.toggle('absent', !input.checked);
      document.querySelectorAll('.recitation-entry[data-student="' + input.value + '"] .recitation-result').forEach(result => {
        if (!input.checked) result.value = 'غائب';
      });
    }

    function toggleVerseRangeBySelect(select) {
      const entry = select.closest('.recitation-entry');
      const range = entry ? entry.querySelector('.verse-range') : null;
      if (!range) return;
      range.classList.toggle('hidden', select.value !== 'جزء');
    }

    function toggleVerseRange(username) {
      const scope = document.querySelector('.recitation-scope[data-student="' + username + '"]');
      const range = document.querySelector('.verse-range[data-range="' + username + '"]');
      if (!scope || !range) return;
      range.classList.toggle('hidden', scope.value !== 'جزء');
    }

    async function saveDailySession() {
      const date = document.getElementById('session-date').value || new Date().toISOString().slice(0, 10);
      const present = Array.from(document.querySelectorAll('.attendance-check:checked')).map(input => input.value);
      const absent = myStudents.map(student => student.username).filter(username => !present.includes(username));
      const validations = myStudents.flatMap(student => {
        const username = student.username;
        const entries = Array.from(document.querySelectorAll('.recitation-entry[data-student="' + username + '"]'));
        if (!present.includes(username)) return [{ username, validation: 'غائب', surah: '', scope: 'كاملة', ayahStart: '', ayahEnd: '', comment: '' }];
        return entries.map(entry => {
          const result = entry.querySelector('.recitation-result');
          const surah = entry.querySelector('.recited-surah');
          const scope = entry.querySelector('.recitation-scope');
          const start = entry.querySelector('.recitation-start');
          const end = entry.querySelector('.recitation-end');
          const note = entry.querySelector('.recitation-note');
          return {
          username,
          validation: result ? result.value : 'ممتاز',
          surah: surah ? surah.value.trim() : '',
          scope: scope ? scope.value : 'كاملة',
          ayahStart: start ? start.value.trim() : '',
          ayahEnd: end ? end.value.trim() : '',
          comment: note ? note.value.trim() : ''
          };
        });
      });
      const record = {
        id: 'session_' + Date.now(),
        date,
        present,
        absent,
        validations,
        total: myStudents.length
      };
      if (typeof Auth.saveClassSession === 'function') await Auth.saveClassSession(session.username, record);
      if (typeof Auth.saveTeacherNote === 'function') {
        await Promise.all(validations.map(item => {
          if (!item.comment && !item.surah && item.validation === 'ممتاز') return Promise.resolve();
          return Auth.saveTeacherNote(item.username, {
            validation: item.validation,
            comment: item.comment,
            surah: item.surah,
            scope: item.scope,
            ayahStart: item.ayahStart,
            ayahEnd: item.ayahEnd,
            source: 'recitation',
            date
          });
        }));
      }
      await refreshProfDashboard(false);
      showToast('تم حفظ الحصة');
    }

    function openHomeworkFromStudent(studentId, studentName) {
      setSelectedProfStudent(studentId, { renderHistory: false });
      const homeworkSelect = document.getElementById('homework-student');
      if (homeworkSelect && Array.from(homeworkSelect.options).some(option => option.value === studentId)) {
        homeworkSelect.value = studentId;
      }
      const surahInput = document.querySelector('.recitation-entry[data-student="' + studentId + '"] .recited-surah');
      document.getElementById('devoir-student-id').value = studentId;
      document.getElementById('devoir-student-name').textContent = studentName;
      document.getElementById('devoir-surate').value = surahInput ? surahInput.value.trim() : '';
      document.getElementById('devoir-debut').value = '1';
      document.getElementById('devoir-fin').value = '';
      document.getElementById('devoir-date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('modal-devoir').classList.add('open');
    }

    function fermerModalDevoir() {
      document.getElementById('modal-devoir').classList.remove('open');
    }

    function handleModalClick(event) {
      if (event.target === document.getElementById('modal-devoir')) fermerModalDevoir();
    }

    async function envoyerDevoir() {
      const studentId = document.getElementById('devoir-student-id').value;
      const surate = document.getElementById('devoir-surate').value.trim();
      const debut = document.getElementById('devoir-debut').value;
      const fin = document.getElementById('devoir-fin').value;
      const date = document.getElementById('devoir-date').value;
      if (!surate || !debut || !fin || !date) {
        showToast('أكمل حقول الواجب');
        return;
      }
      const result = await Auth.ajouterDevoir(studentId, session.prenom, 'مراجعة: ' + surate, debut, fin, date);
      if (result.ok) {
        fermerModalDevoir();
        await refreshProfDashboard(false);
        showToast('تم إرسال الواجب');
      } else {
        showToast(result.error || 'تعذر إرسال الواجب');
      }
    }

    async function sendHomeworkFromTab() {
      const studentId = document.getElementById('homework-student').value;
      setSelectedProfStudent(studentId, { renderHistory: false });
      const surate = document.getElementById('homework-surate').value.trim();
      const debut = document.getElementById('homework-debut').value;
      const fin = document.getElementById('homework-fin').value;
      const date = document.getElementById('homework-date').value;
      if (!studentId || !surate || !debut || !fin || !date) {
        showToast('أكمل حقول الواجب');
        return;
      }
      const result = await Auth.ajouterDevoir(studentId, session.prenom, 'مراجعة: ' + surate, debut, fin, date);
      if (result.ok) {
        document.getElementById('homework-surate').value = '';
        document.getElementById('homework-debut').value = '';
        document.getElementById('homework-fin').value = '';
        await refreshProfDashboard(false);
        switchProfTab('homework');
        showToast('تم إرسال الواجب');
      } else {
        showToast(result.error || 'تعذر إرسال الواجب');
      }
    }

    async function sendAdminReport() {
      const reportSelect = document.getElementById('report-student');
      handleReportStudentChange(reportSelect);
      const student = reportSelect.value;
      const text = document.getElementById('admin-report-text').value.trim();
      if (!text) {
        showToast('اكتب الملاحظة أولا');
        return;
      }
      const result = await Auth.sendAdminReport(session.username, session.prenom, session.nom, 'المعني: ' + student + '\n' + text, 'حصة القراءة');
      if (result.ok) {
        document.getElementById('admin-report-text').value = '';
        showToast('تم الإرسال');
      } else {
        showToast(result.error || 'تعذر الإرسال');
      }
    }

    function deconnexion() {
      Auth.logout();
      window.location.href = 'login.html';
    }

    function showToast(text) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = text;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2600);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initProfDashboard();
      initProfNavAutoHide();
    });
  </script>
