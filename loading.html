<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            position: relative;
        }

        canvas {
            display: block;
        }

        .particles-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
        }

        .title-block {
            margin-top: 10px;
            text-align: center;
            direction: rtl;
        }

        .title-line1 {
            font-family: 'Amiri', serif;
            font-size: clamp(22px, 5vw, 30px);
            color: #e8d5a3;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.9s ease, transform 0.9s ease;
            display: block;
            letter-spacing: 1px;
        }

        .title-line2 {
            font-family: 'Amiri', serif;
            font-size: clamp(15px, 3.5vw, 19px);
            color: #9aad7a;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.7s ease 0.3s, transform 0.7s ease 0.3s;
            display: block;
            margin-top: 5px;
        }

        .title-line3 {
            font-family: 'Amiri', serif;
            font-size: clamp(12px, 2.5vw, 15px);
            color: rgba(200, 169, 110, 0.6);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.6s ease 0.55s, transform 0.6s ease 0.55s;
            display: block;
            margin-top: 3px;
        }

        .title-line1.show { opacity: 1; transform: translateY(0); }
        .title-line2.show { opacity: 1; transform: translateY(0); }
        .title-line3.show { opacity: 1; transform: translateY(0); }

        .ornament {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.7s ease 0.85s;
        }
        .ornament.show { opacity: 1; }
        .orn-line { width: 50px; height: 1px; background: linear-gradient(90deg, transparent, #c8a96e); }
        .orn-line.right { background: linear-gradient(90deg, #c8a96e, transparent); }
        .orn-dot { width: 5px; height: 5px; border-radius: 50%; background: #c8a96e; }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="particles-layer" id="particles"></div>
        <canvas id="bookCanvas"></canvas>
        <div class="title-block">
            <span class="title-line1" id="tl1">جمعية مواهب المنان</span>
            <span class="title-line2" id="tl2">دار القرآن والحديث</span>
            <span class="title-line3" id="tl3">عين العودة</span>
            <div class="ornament" id="orn">
                <div class="orn-line"></div>
                <div class="orn-dot"></div>
                <div class="orn-line right"></div>
            </div>
        </div>
    </div>

    <script>
        /* ═══════════════════════════════════════════
           DESTINATION : vers quelle page rediriger
           ─ Lire depuis sessionStorage (mis par login.html)
        ═══════════════════════════════════════════ */
        const REDIRECT_TO = sessionStorage.getItem('loading_redirect') || 'dashboard.html';
        const ANIM_DURATION = 3400; // ms avant la redirection

        /* ═══════════════════════════════════════════
           CANVAS SETUP
        ═══════════════════════════════════════════ */
        const canvas = document.getElementById('bookCanvas');
        const ctx    = canvas.getContext('2d');

        const SIZE   = Math.min(window.innerWidth * 0.85, 360);
        canvas.width  = SIZE;
        canvas.height = SIZE * 0.65;
        const W = canvas.width, H = canvas.height;
        const CX = W / 2, CY = H / 2 - 5;

        /* ═══════════════════════════════════════════
           UTILS
        ═══════════════════════════════════════════ */
        function easeOut(t)   { return 1 - Math.pow(1 - t, 3); }
        function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
        function lerp(a,b,t)  { return a + (b-a)*t; }
        function clamp(v,a,b) { return Math.max(a, Math.min(b, v)); }
        const sc = SIZE / 360;  /* facteur d'échelle global */

        /* ═══════════════════════════════════════════
           DRAW : LIVRE FERMÉ
        ═══════════════════════════════════════════ */
        function drawClosedBook(cx, cy, alpha) {
            const bw = 130*sc, bh = 86*sc, dep = 13*sc;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(cx, cy);

            /* ombre portée */
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(dep/2, bh/2+6*sc, bw*0.55, 7*sc, 0, 0, Math.PI*2);
            ctx.fill();

            /* tranche droite */
            ctx.fillStyle = '#2a1d14';
            ctx.beginPath();
            ctx.moveTo(-bw/2+dep, -bh/2+dep);
            ctx.lineTo( bw/2+dep, -bh/2+dep);
            ctx.lineTo( bw/2+dep,  bh/2+dep);
            ctx.lineTo(-bw/2+dep,  bh/2+dep);
            ctx.fill();

            /* couverture */
            ctx.fillStyle = '#3d2b1f';
            ctx.strokeStyle = '#c8a96e';
            ctx.lineWidth = 1.5*sc;
            ctx.beginPath();
            ctx.roundRect(-bw/2, -bh/2, bw, bh, 4*sc);
            ctx.fill();
            ctx.stroke();

            /* filet doré intérieur */
            ctx.beginPath();
            ctx.roundRect(-bw/2+9*sc, -bh/2+9*sc, bw-18*sc, bh-18*sc, 2*sc);
            ctx.strokeStyle = '#c8a96e';
            ctx.lineWidth = 0.8*sc;
            ctx.stroke();

            /* titre arabe */
            ctx.fillStyle = '#c8a96e';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `bold ${15*sc}px Amiri,serif`;
            ctx.fillText('القرآن', 0, -9*sc);
            ctx.font = `${10*sc}px Amiri,serif`;
            ctx.fillText('الكريم', 0, 8*sc);

            /* dos du livre */
            ctx.fillStyle = '#5a3d28';
            ctx.strokeStyle = '#c8a96e';
            ctx.lineWidth = 0.5*sc;
            ctx.fillRect(-bw/2-7*sc, -bh/2, 7*sc, bh);
            ctx.strokeRect(-bw/2-7*sc, -bh/2, 7*sc, bh);
            for(let i=1;i<5;i++){
                ctx.beginPath();
                ctx.moveTo(-bw/2-7*sc, -bh/2+bh*i/5);
                ctx.lineTo(-bw/2, -bh/2+bh*i/5);
                ctx.stroke();
            }
            ctx.restore();
        }

        /* ═══════════════════════════════════════════
           DRAW : LIVRE OUVERT
        ═══════════════════════════════════════════ */
        function drawOpenBook(cx, cy, openAmt) {
            const hw  = 75*sc * openAmt;
            const bh  = 78*sc;
            const cur = 20*sc * openAmt;
            ctx.save();
            ctx.translate(cx, cy);

            /* ombre ellipse */
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, bh/2+5*sc, hw+10*sc, 8*sc, 0, 0, Math.PI*2);
            ctx.fill();

            /* page gauche */
            ctx.fillStyle = '#e0d8c8';
            ctx.beginPath();
            ctx.moveTo(-2, -bh/2);
            ctx.quadraticCurveTo(-hw*0.5, -bh/2-cur*0.5, -hw, -bh/2+cur*0.3);
            ctx.lineTo(-hw, bh/2);
            ctx.quadraticCurveTo(-hw*0.5, bh/2+cur*0.2, -2, bh/2);
            ctx.fill();

            /* page droite */
            ctx.fillStyle = '#f5f0e8';
            ctx.beginPath();
            ctx.moveTo(2, -bh/2);
            ctx.quadraticCurveTo(hw*0.5, -bh/2-cur*0.5, hw, -bh/2+cur*0.3);
            ctx.lineTo(hw, bh/2);
            ctx.quadraticCurveTo(hw*0.5, bh/2+cur*0.2, 2, bh/2);
            ctx.fill();

            /* lignes de texte simulées */
            if(openAmt > 0.55) {
                ctx.strokeStyle = 'rgba(100,80,50,0.18)';
                ctx.lineWidth = 0.6;
                for(let i=1;i<6;i++){
                    const fy = -bh/2 + bh*i/6;
                    ctx.beginPath();
                    ctx.moveTo(6, fy);
                    ctx.quadraticCurveTo(hw*0.5, fy-2, hw-12*sc, fy+2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-6, fy);
                    ctx.quadraticCurveTo(-hw*0.5, fy-2, -hw+12*sc, fy+2);
                    ctx.stroke();
                }
            }

            /* couverture gauche */
            ctx.fillStyle = '#2a1d14';
            ctx.strokeStyle = '#c8a96e';
            ctx.lineWidth = 1.2*sc;
            ctx.beginPath();
            ctx.moveTo(-hw-9*sc, -bh/2-4*sc);
            ctx.lineTo(-hw-9*sc,  bh/2+4*sc);
            ctx.quadraticCurveTo(-hw-4*sc, bh/2+6*sc, -hw, bh/2+2*sc);
            ctx.lineTo(-hw, -bh/2+2*sc);
            ctx.quadraticCurveTo(-hw-4*sc, -bh/2-2*sc, -hw-9*sc, -bh/2-4*sc);
            ctx.fill(); ctx.stroke();

            /* couverture droite */
            ctx.fillStyle = '#3d2b1f';
            ctx.beginPath();
            ctx.moveTo(hw+9*sc, -bh/2-4*sc);
            ctx.lineTo(hw+9*sc,  bh/2+4*sc);
            ctx.quadraticCurveTo(hw+4*sc, bh/2+6*sc, hw, bh/2+2*sc);
            ctx.lineTo(hw, -bh/2+2*sc);
            ctx.quadraticCurveTo(hw+4*sc, -bh/2-2*sc, hw+9*sc, -bh/2-4*sc);
            ctx.fill(); ctx.stroke();

            /* reliure centrale */
            ctx.fillStyle = '#5a3d28';
            ctx.fillRect(-7*sc, -bh/2, 14*sc, bh);

            ctx.restore();
        }

        /* ═══════════════════════════════════════════
           DRAW : PLUME
        ═══════════════════════════════════════════ */
        function drawFeather(cx, cy, progress) {
            if(progress <= 0) return;
            const alpha   = Math.min(progress * 2.5, 1);
            const len     = 95*sc * Math.min(progress * 1.8, 1);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-0.55);
            ctx.globalAlpha = alpha;

            /* barbes */
            const barbs = 20;
            for(let i=0;i<barbs;i++){
                const frac = i/barbs;
                const sy   = -len * frac;
                const sx   = len * frac * 0.07;
                const bLen = (Math.sin(frac*Math.PI) * 32 + 5) * sc;
                ctx.strokeStyle = i%2===0 ? '#b8860b' : '#d4a017';
                ctx.lineWidth   = 1.1;
                ctx.globalAlpha = alpha * (0.55 + 0.45*Math.sin(frac*Math.PI));
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.quadraticCurveTo(sx+bLen*0.6, sy-bLen*0.3, sx+bLen, sy-bLen*0.1);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.quadraticCurveTo(sx-bLen*0.4, sy-bLen*0.2, sx-bLen*0.7, sy-bLen*0.05);
                ctx.stroke();
            }

            /* tige centrale */
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = '#8b6914';
            ctx.lineWidth   = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(len*0.04, -len*0.5, len*0.07, -len);
            ctx.stroke();

            /* pointe */
            ctx.fillStyle = '#c8a96e';
            ctx.beginPath();
            ctx.ellipse(len*0.07, -len, 3.5*sc, 7*sc, -0.3, 0, Math.PI*2);
            ctx.fill();

            ctx.globalAlpha = 1;
            ctx.restore();
        }

        /* ═══════════════════════════════════════════
           PARTICULES
        ═══════════════════════════════════════════ */
        let particlesDone = false;
        function spawnParticles() {
            if(particlesDone) return;
            particlesDone = true;
            const layer = document.getElementById('particles');
            for(let i=0;i<22;i++){
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = Math.random() * Math.PI * 2;
                const dist  = 50 + Math.random() * 100;
                const size  = 1.5 + Math.random() * 3;
                p.style.cssText = `
                    left:50%; top:42%;
                    width:${size}px; height:${size}px;
                    background:${Math.random()>0.5?'#c8a96e':'#9aad7a'};
                `;
                layer.appendChild(p);
                const tx = Math.cos(angle)*dist, ty = Math.sin(angle)*dist;
                p.animate([
                    { opacity:0, transform:`translate(-50%,-50%) scale(0)` },
                    { opacity:1, transform:`translate(calc(-50% + ${tx*0.3}px), calc(-50% + ${ty*0.3}px)) scale(1)`, offset:0.3 },
                    { opacity:0, transform:`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.2)` }
                ], { duration: 900+Math.random()*600, delay: Math.random()*250, easing:'ease-out', fill:'forwards' });
            }
        }

        /* ═══════════════════════════════════════════
           TEXTE
        ═══════════════════════════════════════════ */
        function showText() {
            document.getElementById('tl1').classList.add('show');
            setTimeout(()=>document.getElementById('tl2').classList.add('show'), 300);
            setTimeout(()=>document.getElementById('tl3').classList.add('show'), 560);
            setTimeout(()=>document.getElementById('orn').classList.add('show'), 850);
        }

        /* ═══════════════════════════════════════════
           MACHINE D'ÉTATS D'ANIMATION
           Phase 0 : livre fermé apparaît   (55 frames)
           Phase 1 : bascule sur le dos     (55 frames)
           Phase 2 : se redresse            (40 frames)
           Phase 3 : s'ouvre               (65 frames)
           Phase 4 : plume arrive + texte  (75 frames)
           Phase 5 : stable (attente redirect)
        ═══════════════════════════════════════════ */
        const PHASES = [55, 55, 40, 65, 75, 9999];
        let phase = 0, phaseT = 0, raf;

        function tick() {
            ctx.clearRect(0, 0, W, H);
            phaseT++;
            const dur = PHASES[phase];
            const pt  = clamp(phaseT / dur, 0, 1);

            if(phase === 0) {
                /* apparition */
                drawClosedBook(CX, CY, easeOut(pt));

            } else if(phase === 1) {
                /* bascule légère */
                const tiltY = Math.sin(pt * Math.PI) * 14*sc;
                drawClosedBook(CX, CY + tiltY, 1);

            } else if(phase === 2) {
                /* retour à plat */
                drawClosedBook(CX, CY, 1);

            } else if(phase === 3) {
                /* ouverture */
                drawOpenBook(CX, CY, easeInOut(pt));

            } else if(phase === 4) {
                /* plume */
                drawOpenBook(CX, CY, 1);
                const fProg = easeOut(pt);
                const fx = lerp(CX+70*sc, CX+22*sc, Math.min(pt*1.6,1));
                const fy = lerp(CY-110*sc, CY-58*sc, Math.min(pt*1.6,1));
                drawFeather(fx, fy, fProg);
                if(pt > 0.80 && !particlesDone) spawnParticles();

            } else {
                /* phase stable */
                drawOpenBook(CX, CY, 1);
                drawFeather(CX+22*sc, CY-58*sc, 1);
            }

            if(phaseT >= dur && phase < 5) {
                phase++;
                phaseT = 0;
                if(phase === 4) showText();
            }

            if(phase < 5) raf = requestAnimationFrame(tick);
        }

        /* ═══════════════════════════════════════════
           LANCEMENT + REDIRECTION
        ═══════════════════════════════════════════ */
        requestAnimationFrame(tick);

        setTimeout(() => {
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = REDIRECT_TO;
            }, 500);
        }, ANIM_DURATION);
    </script>
</body>
</html>
