<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>جاري التحميل...</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="platform-theme.css">
    <script src="platform-theme.js"></script>
<style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0c4a3b 0%, #1a3c34 50%, #14532d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        /* ── Cercle pulsant ── */
        .pulse-ring {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(200,169,110,0.5);
            animation: ringOut 2.2s ease-out infinite;
        }
        .ring:nth-child(1) { width:140px; height:140px; animation-delay:0s; }
        .ring:nth-child(2) { width:140px; height:140px; animation-delay:0.7s; }
        .ring:nth-child(3) { width:140px; height:140px; animation-delay:1.4s; }

        @keyframes ringOut {
            0%   { transform:scale(0.5); opacity:0.9; }
            100% { transform:scale(1.6); opacity:0; }
        }

        .logo-circle {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            animation: logoPulse 2.2s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(200,169,110,0.4);
        }

        @keyframes logoPulse {
            0%, 100% { transform:scale(1);    box-shadow: 0 0 0 0   rgba(200,169,110,0.4); }
            50%       { transform:scale(1.06); box-shadow: 0 0 0 14px rgba(200,169,110,0); }
        }

        .logo-circle img {
            width: 78px;
            height: 78px;
            object-fit: contain;
        }

        /* ── Texte ── */
        .title-block {
            text-align: center;
            direction: rtl;
        }

        .t1 {
            font-family: 'Amiri', serif;
            font-size: 26px;
            color: #e8d5a3;
            display: block;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.8s ease 0.3s forwards;
        }
        .t2 {
            font-family: 'Amiri', serif;
            font-size: 17px;
            color: #9aad7a;
            display: block;
            margin-top: 5px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.7s ease 0.6s forwards;
        }
        .t3 {
            font-family: 'Amiri', serif;
            font-size: 13px;
            color: rgba(200,169,110,0.6);
            display: block;
            margin-top: 3px;
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp 0.6s ease 0.85s forwards;
        }

        @keyframes fadeUp {
            to { opacity:1; transform:translateY(0); }
        }

        /* ── Ornement ── */
        .ornament {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            opacity: 0;
            animation: fadeUp 0.6s ease 1.1s forwards;
        }
        .orn-line       { width:44px; height:1px; background:linear-gradient(90deg,transparent,#c8a96e); }
        .orn-line.right { background:linear-gradient(90deg,#c8a96e,transparent); }
        .orn-dot        { width:5px; height:5px; border-radius:50%; background:#c8a96e; }

        /* ── Points de chargement ── */
        .dots {
            display: flex;
            gap: 8px;
        }
        .dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c8a96e;
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .dots span:nth-child(2) { animation-delay:0.2s; }
        .dots span:nth-child(3) { animation-delay:0.4s; }

        @keyframes dotBounce {
            0%,80%,100% { transform:scale(0.55); opacity:0.35; }
            40%          { transform:scale(1);    opacity:1; }
        }
    </style>
</head>
<body>
    <div class="wrap">

        <div class="pulse-ring">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="logo-circle">
                <img src="logo.webp" alt="مواهب المنان">
            </div>
        </div>

        <div class="title-block">
            <span class="t1">جمعية مواهب المنان</span>
            <span class="t2">دار القرآن والحديث</span>
            <span class="t3">عين العودة</span>
            <div class="ornament">
                <div class="orn-line"></div>
                <div class="orn-dot"></div>
                <div class="orn-line right"></div>
            </div>
        </div>

        <div class="dots">
            <span></span><span></span><span></span>
        </div>

    </div>

    <script>
        function getRedirectTarget() {
            let session = null;
            try {
                session = JSON.parse(localStorage.getItem('quran_session') || 'null');
            } catch (error) {}
            sessionStorage.removeItem('loading_redirect');
            if (session && session.role === 'admin') return 'controle-mawahib-7x9k.html';
            if (session && session.role === 'prof') return 'prof-recitation.html';
            if (session && session.role === 'student') return 'dashboard.html';
            return 'login.html';
        }
        const REDIRECT_TO = getRedirectTarget();

        setTimeout(() => {
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = '0';
            setTimeout(() => { window.location.href = REDIRECT_TO; }, 500);
        }, 3000);
    </script>
</body>
</html>
