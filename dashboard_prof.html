<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأستاذ - دار القرآن والحديث</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
        <link rel="stylesheet" href="platform-theme.css">
    <script src="platform-theme.js"></script>
<style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f0f8; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 10px; }

        .tab-btn {
            padding: 10px 20px;
            border-bottom: 2px solid transparent;
            font-weight: 700;
            font-size: 14px;
            color: #6b7280;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
        }
        .tab-btn.active {
            border-bottom-color: #7c3aed;
            color: #7c3aed;
        }

        .student-card {
            background: #fff;
            border: 1.5px solid #ede9fe;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: box-shadow .2s;
        }
        .student-card:hover { box-shadow: 0 4px 16px rgba(124,58,237,.1); }

        .devoir-row {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Modal overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
    </style>
</head>
<body class="p-4 md:p-6">

<div class="max-w-4xl mx-auto">

    <!-- ══ HEADER ═══════════════════════════════════════════ -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-4">
            <img src="logo.webp" alt="مواهب المنان" class="h-16 object-contain drop-shadow-md">
            <div>
                <h1 class="text-xl font-black text-purple-900">
                    مرحباً، <span id="prof-name">...</span>
                </h1>
                <p class="text-sm text-gray-500 font-bold">
                    القسم: <span id="prof-classe" class="text-purple-700">...</span>
                </p>
            </div>
        </div>
        <button onclick="deconnexion()"
                class="px-4 py-2 bg-rose-50 text-rose-600 font-bold rounded-xl hover:bg-rose-100 transition text-sm">
            خروج ↩
        </button>
    </div>

    <!-- ══ TABS ══════════════════════════════════════════════ -->
    <div class="bg-white rounded-2xl border border-purple-100 overflow-hidden shadow-sm">
        <div class="flex border-b border-gray-100 overflow-x-auto px-2">
            <button class="tab-btn active" onclick="switchTab('students')">👥 تلاميذي</button>
            <button class="tab-btn" onclick="switchTab('devoirs')">📋 متابعة الواجبات</button>
        </div>

        <!-- ── Tab: Students ──────────────────────────────── -->
        <div id="tab-students" class="p-6">
            <div id="students-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-gray-400 text-sm col-span-full text-center py-8">جاري التحميل...</p>
            </div>
        </div>

        <!-- ── Tab: Homework tracking ────────────────────── -->
        <div id="tab-devoirs" class="hidden p-6">
            <div class="flex justify-between items-center mb-4">
                <p class="text-sm text-gray-500 font-bold">الواجبات المرسلة حالياً</p>
                <button onclick="chargerSuiviDevoirs()"
                        class="text-xs bg-purple-100 text-purple-700 px-3 py-1.5 rounded-lg font-bold hover:bg-purple-200 transition">
                    🔄 تحديث
                </button>
            </div>
            <div id="liste-suivi-devoirs" class="space-y-3">
                <p class="text-gray-400 text-sm text-center py-8">جاري التحميل...</p>
            </div>
        </div>
    </div>

</div>

<!-- ══ MODAL: SEND HOMEWORK ══════════════════════════════ -->
<div id="modal-devoir" class="modal-overlay" onclick="handleModalClick(event)">
    <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl m-4">
        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
            <div>
                <h2 class="text-base font-black text-purple-900">📖 إرسال واجب</h2>
                <p class="text-xs text-gray-400 mt-0.5">
                    إلى: <span id="devoir-student-name" class="font-bold text-purple-700"></span>
                </p>
            </div>
            <button onclick="fermerModalDevoir()"
                    class="text-gray-400 hover:text-gray-700 font-bold text-xl px-2">✕</button>
        </div>

        <input type="hidden" id="devoir-student-id">

        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-600 mb-1">السورة</label>
                <input type="text" id="devoir-surate"
                       class="w-full px-3 py-2.5 border rounded-xl bg-gray-50 focus:border-purple-400 outline-none text-sm">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">من الآية</label>
                    <input type="number" id="devoir-debut" min="1"
                           class="w-full px-3 py-2.5 border rounded-xl bg-gray-50 focus:border-purple-400 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">إلى الآية</label>
                    <input type="number" id="devoir-fin" min="1"
                           class="w-full px-3 py-2.5 border rounded-xl bg-gray-50 focus:border-purple-400 outline-none text-sm">
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-600 mb-1">آخر أجل</label>
                <input type="date" id="devoir-date"
                       class="w-full px-3 py-2.5 border rounded-xl bg-gray-50 focus:border-purple-400 outline-none text-sm">
            </div>
        </div>

        <div class="px-6 pb-6 flex gap-3">
            <button onclick="fermerModalDevoir()"
                    class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition text-sm">
                إلغاء
            </button>
            <button onclick="envoyerDevoir()"
                    class="flex-1 py-2.5 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 transition text-sm">
                إرسال ✔️
            </button>
        </div>
    </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   TABS
══════════════════════════════════════════════════════════ */
function switchTab(name) {
    ['students','devoirs'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
    });
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', ['students','devoirs'][i] === name);
    });
    if (name === 'devoirs') chargerSuiviDevoirs();
}

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
async function initProfDashboard() {
    const session = Auth.getSession();
    if (!session || session.role !== 'prof') {
        window.location.href = 'login.html'; return;
    }

    document.getElementById('prof-name').innerText   = session.prenom;
    document.getElementById('prof-classe').innerText = session.nom; // 'nom' stocke la classe

    const profs = await Auth.getProfs();
    const users = await Auth.getAllUsers();
    const myData = profs[session.username];

    const grid = document.getElementById('students-grid');

    if (!myData || !myData.students || myData.students.length === 0) {
        grid.innerHTML = '<p class="text-gray-400 text-sm col-span-full text-center py-8">لا يوجد تلاميذ مرتبطين بحسابك حالياً.</p>';
    } else {
        grid.innerHTML = '';
        myData.students.forEach(studentId => {
            const s = users[studentId];
            if (!s) return;

            const completedSurahs = Object.values(s.progress || {})
                .filter(p => p && p.completedAt).length;

            const statusColor = s.isSuspended
                ? 'bg-red-100 text-red-700'
                : 'bg-emerald-100 text-emerald-700';
            const statusText = s.isSuspended ? '🚫 موقوف' : '✅ نشط';

            const card = document.createElement('div');
            card.className = 'student-card';
            card.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center font-black text-purple-700 text-lg flex-shrink-0">
                        ${s.prenom ? s.prenom[0] : '؟'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-black text-gray-800 text-sm leading-tight truncate">${s.prenom} ${s.nom}</p>
                        <p class="text-xs text-gray-400 font-mono">${studentId}</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs font-bold ${statusColor} px-2 py-0.5 rounded-full">${statusText}</span>
                    <span class="text-xs font-bold bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full">${completedSurahs} سورة</span>
                </div>
                <button onclick="ouvrirModalDevoir('${studentId}', '${s.prenom} ${s.nom}')"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-xl font-bold text-sm transition">
                    📖 إرسال واجب
                </button>
            `;
            grid.appendChild(card);
        });
    }

    chargerSuiviDevoirs();
    setInterval(chargerSuiviDevoirs, 10000);
}

/* ══════════════════════════════════════════════════════════
   HOMEWORK TRACKING
══════════════════════════════════════════════════════════ */
async function chargerSuiviDevoirs() {
    const session = Auth.getSession();
    const mesDevoirs = await Auth.getDevoirs('prof', session.username);
    const container  = document.getElementById('liste-suivi-devoirs');

    if (mesDevoirs.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm text-center py-8 italic">لا يوجد أي واجب مسجل</p>';
        return;
    }

    container.innerHTML = mesDevoirs.map(devoir => `
        <div class="devoir-row">
            <div class="flex-1 min-w-0">
                <p class="font-bold text-gray-800 text-sm">
                    سورة ${devoir.surate}
                    <span class="text-gray-400 font-normal text-xs">(الآية ${devoir.aya_debut} → ${devoir.aya_fin})</span>
                </p>
                <p class="text-xs text-gray-500 mt-0.5">
                    التلميذ: <span class="font-bold text-purple-700">${devoir.student_id}</span>
                </p>
            </div>
            <button onclick="confirmerAnnulationDevoir('${devoir.id}')"
                    class="px-3 py-1.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg text-xs font-bold hover:bg-rose-100 transition flex-shrink-0">
                إلغاء الواجب
            </button>
        </div>
    `).join('');
}

/* ══════════════════════════════════════════════════════════
   HOMEWORK ACTIONS
══════════════════════════════════════════════════════════ */
async function envoyerDevoir() {
    const studentId = document.getElementById('devoir-student-id').value;
    const surate    = document.getElementById('devoir-surate').value;
    const debut     = document.getElementById('devoir-debut').value;
    const fin       = document.getElementById('devoir-fin').value;
    const date      = document.getElementById('devoir-date').value;

    const session = Auth.getSession();
    const res = await Auth.ajouterDevoir(studentId, session.prenom, surate, debut, fin, date);
    if (res.ok) {
        showToast('✔️ تم إرسال الواجب بنجاح', 'success');
        fermerModalDevoir();
        chargerSuiviDevoirs();
    }
}

async function confirmerAnnulationDevoir(id) {
    if (confirm('هل أنت متأكد من إلغاء هذا الواجب؟')) {
        await Auth.annulerDevoir(id);
        chargerSuiviDevoirs();
        showToast('تم سحب الواجب', 'neutral');
    }
}

/* ══════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════ */
function ouvrirModalDevoir(studentId, studentName) {
    document.getElementById('devoir-student-id').value = studentId;
    document.getElementById('devoir-student-name').innerText = studentName;
    document.getElementById('devoir-surate').value  = '';
    document.getElementById('devoir-debut').value   = '';
    document.getElementById('devoir-fin').value     = '';
    document.getElementById('devoir-date').value    = '';
    document.getElementById('modal-devoir').classList.add('open');
}

function fermerModalDevoir() {
    document.getElementById('modal-devoir').classList.remove('open');
}

function handleModalClick(event) {
    if (event.target === document.getElementById('modal-devoir')) fermerModalDevoir();
}

/* ══════════════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════════════ */
function deconnexion() {
    Auth.logout();
    window.location.href = 'login.html';
}

/* ══════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════ */
function showToast(text, type) {
    const t = document.createElement('div');
    const bg = type === 'success' ? 'bg-purple-600' : 'bg-gray-600';
    t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 ${bg} text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg z-[100] transition-all`;
    t.innerText = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

window.onload = initProfDashboard;
</script>
</body>
</html>
