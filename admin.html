<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - دار القرآن والحديث</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="registry.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f0f8; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 10px; }

        /* ── Tabs ── */
        .tab-btn { transition: all .2s; border-bottom: 2px solid transparent; }
        .tab-btn.active { border-bottom-color: #7c3aed; color: #7c3aed; font-weight: 700; }

        /* ── Accordion ── */
        .accordion-body { display: none; }
        .accordion-body.open { display: block; }
        .accordion-icon { transition: transform .25s; }
        .accordion-header.open .accordion-icon { transform: rotate(180deg); }

        /* ── Action pill buttons ── */
        .pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px;
                border-radius: 20px; font-size: 12px; font-weight: 700;
                cursor: pointer; transition: opacity .15s; }
        .pill:hover { opacity: .8; }

        /* ── Student row ── */
        .student-row { border-radius: 12px; border: 1px solid #ede9fe;
                       background: #fff; padding: 10px 14px; margin-bottom: 8px;
                       display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        /* ── Class card ── */
        .class-card { background: #fff; border-radius: 16px;
                      border: 1.5px solid #ede9fe; overflow: hidden; margin-bottom: 16px; }
        .class-card-header { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
                             padding: 14px 20px; display: flex; align-items: center;
                             justify-content: space-between; cursor: pointer; }

        /* ── Modal ── */
        .modal-overlay { display: none; position: fixed; inset: 0;
                         background: rgba(0,0,0,.45); z-index: 50;
                         align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
    </style>
</head>
<body class="p-4 md:p-6">

<!-- ══ HEADER ══════════════════════════════════════════════ -->
<div class="max-w-5xl mx-auto">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-4">
            <img src="logo.webp" alt="مواهب المنان" class="h-16 object-contain drop-shadow-md">
            <div>
                <h1 class="text-xl font-black text-purple-900">لوحة تحكم الإدارة</h1>
                <p class="text-xs text-gray-500 font-bold">جمعية مواهب المنان — دار القرآن والحديث</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="total-badge" class="text-sm bg-purple-100 text-purple-800 px-3 py-1 rounded-full font-bold"></span>
            <a href="login.html" onclick="Auth.logout()"
               class="px-4 py-2 bg-rose-50 text-rose-600 font-bold rounded-xl hover:bg-rose-100 transition text-sm">
                خروج ↩
            </a>
        </div>
    </div>

    <!-- ══ TABS ══════════════════════════════════════════════ -->
    <div class="flex gap-6 border-b border-gray-200 mb-6 px-1">
        <button class="tab-btn active pb-3 text-sm text-gray-600" onclick="switchTab('classes')">🏫 الأقسام والطلاب</button>
        <button class="tab-btn pb-3 text-sm text-gray-600" onclick="switchTab('add-student')">➕ إضافة طالب</button>
        <button class="tab-btn pb-3 text-sm text-gray-600" onclick="switchTab('add-prof')">👤 إضافة أستاذ</button>
    </div>

    <!-- ══ TAB: CLASSES ══════════════════════════════════════ -->
    <div id="tab-classes">
        <div id="classes-container">
            <p class="text-center text-gray-400 py-12">جاري التحميل...</p>
        </div>
    </div>

    <!-- ══ TAB: ADD STUDENT ══════════════════════════════════ -->
    <div id="tab-add-student" class="hidden">
        <div class="max-w-md mx-auto bg-white rounded-2xl p-6 border border-purple-100 shadow-sm">
            <h2 class="text-lg font-bold text-gray-800 mb-5 border-b pb-2">إنشاء حساب طالب جديد</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">الاسم الشخصي</label>
                    <input id="new-prenom" type="text" class="w-full p-3 border rounded-xl bg-gray-50 focus:border-purple-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">الاسم العائلي</label>
                    <input id="new-nom" type="text" class="w-full p-3 border rounded-xl bg-gray-50 focus:border-purple-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">كلمة المرور</label>
                    <input id="new-pass" type="password" class="w-full p-3 border rounded-xl bg-gray-50 focus:border-purple-400 outline-none" placeholder="4 أحرف على الأقل">
                </div>
                <button onclick="createStudent()" id="btn-create"
                        class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl transition">
                    إضافة الطالب ✔️
                </button>
                <div id="admin-msg" class="text-center text-sm font-bold mt-2 hidden p-2 rounded"></div>
            </div>
        </div>
    </div>

    <!-- ══ TAB: ADD PROF ══════════════════════════════════════ -->
    <div id="tab-add-prof" class="hidden">
        <div class="max-w-xl mx-auto bg-white rounded-2xl p-6 border border-purple-100 shadow-sm">
            <h2 class="text-lg font-bold text-gray-800 mb-5 border-b pb-2">إضافة أستاذ جديد</h2>
            <div class="flex flex-col gap-3">
                <input type="text" id="new-prof-prenom" placeholder="اسم الأستاذ"
                       class="px-3 py-2.5 rounded-xl border w-full focus:border-purple-400 outline-none">
                <input type="text" id="new-prof-classe" placeholder="اسم القسم (مثال: المستوى 1)"
                       class="px-3 py-2.5 rounded-xl border w-full focus:border-purple-400 outline-none">
                <input type="text" id="new-prof-pass" placeholder="كلمة المرور"
                       class="px-3 py-2.5 rounded-xl border w-full focus:border-purple-400 outline-none">
                <button onclick="creerProf()"

                    إضافة الأستاذ ✔️

            </div>
        </div>
    </div>
</div>

<!-- ══ MODAL: INDIVIDUAL STUDENT ══════════════════════════ -->
<div id="student-modal" class="modal-overlay" onclick="closeStudentModal(event)">
    <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl relative max-h-[92vh] overflow-y-auto m-4">
        <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center z-10">
            <div>
                <h2 id="modal-student-name" class="text-lg font-black text-purple-900"></h2>
                <p id="modal-student-username" class="text-xs text-gray-400 font-mono"></p>
            </div>
            <button onclick="closeStudentModal()" class="text-gray-400 hover:text-gray-700 font-bold text-xl px-2">✕</button>
        </div>

        <input type="hidden" id="modal-username">

        <!-- Sub-tabs inside modal -->
        <div class="flex gap-1 px-6 pt-4 pb-2 border-b border-gray-100">
            <button onclick="switchModalTab('profile')" id="mtab-profile"
                    class="modal-tab-btn px-3 py-1.5 rounded-lg text-sm font-bold bg-purple-100 text-purple-700">

            <button onclick="switchModalTab('schedule')" id="mtab-schedule"

            </button>
            <button onclick="switchModalTab('message')" id="mtab-message"
                    class="modal-tab-btn px-3 py-1.5 rounded-lg text-sm font-bold text-gray-500 hover:bg-gray-100">

            </button>
            <button onclick="switchModalTab('progress')" id="mtab-progress"
                    class="modal-tab-btn px-3 py-1.5 rounded-lg text-sm font-bold text-gray-500 hover:bg-gray-100">
                📊 التقدم
            </button>
        </div>

        <div class="p-6">
            <!-- Profile tab -->
            <div id="modal-content-profile">
                <div class="space-y-4">
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <h3 class="font-bold text-gray-700 mb-3 text-sm">الوثائق المقدمة</h3>
                        <label class="flex items-center gap-2 cursor-pointer mb-2">
                            <input type="checkbox" id="modal-cin" class="w-4 h-4 accent-purple-600">
                            <span class="text-sm text-gray-600">نسخة بطاقة التعريف للأب أو الأم</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="modal-birthcert" class="w-4 h-4 accent-purple-600">
                            <span class="text-sm text-gray-600">عقد الازدياد</span>
                        </label>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-gray-700 text-sm">الأداءات الشهرية</h3>
                            <button onclick="addPaymentRow()"
                                    class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200">+ شهر</button>
                        </div>
                        <table class="w-full text-sm text-right">

                                <tr><th class="pb-1 w-1/2">الشهر</th><th class="pb-1">الحالة</th><th class="pb-1 text-center">—</th></tr>

                    <button onclick="saveAdminProfile()"

            <!-- Schedule tab -->

                    <button onclick="sendSingleMsg()"

                </div>
            </div>

            <!-- Progress tab -->
            <div id="modal-content-progress" class="hidden">
                <div id="modal-progress-content" class="space-y-2">
                    <p class="text-gray-400 text-sm text-center">جاري التحميل...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ══ MODAL: CLASS ACTIONS ════════════════════════════════ -->
<div id="class-modal" class="modal-overlay" onclick="closeClassModal(event)">
    <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl relative m-4">
        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
            <h2 id="class-modal-title" class="text-base font-black text-purple-900"></h2>
            <button onclick="closeClassModal()" class="text-gray-400 hover:text-gray-700 font-bold text-xl px-2">✕</button>
        </div>
        <div class="p-6 space-y-4">
            <!-- Class message -->
            <div>
                <label class="block text-sm font-bold text-gray-600 mb-1">✉️ رسالة لجميع طلاب القسم</label>
                <textarea id="class-msg-text" rows="3"
                          placeholder="اكتب الرسالة للكل..."

                <button onclick="sendClassMsg()"

                <textarea id="class-schedule-text" rows="2"
                          placeholder="مثال: الإثنين 17:00 والخميس 18:00"

                <button onclick="saveClassSchedule()"
                        class="mt-2 w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition text-sm">

                </button>
            </div>
            <hr class="border-gray-100">
            <!-- Assign student -->
            <div>
                <label class="block text-sm font-bold text-gray-600 mb-1">👤 إضافة طالب للقسم</label>
                <select id="assign-student-select"
                        class="w-full p-2.5 border rounded-xl text-sm bg-gray-50 focus:border-purple-400 outline-none"></select>
                <button onclick="assignStudentToClass()"
                        class="mt-2 w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl transition text-sm">
                    ربط الطالب بالقسم ✔️
                </button>
            </div>
            <hr class="border-gray-100">
            <!-- Delete prof -->
            <button onclick="deleteCurrentProf()"
                    class="w-full py-2 bg-rose-50 text-rose-600 border border-rose-200 font-bold rounded-xl hover:bg-rose-100 transition text-sm">
                🗑️ حذف القسم والأستاذ
            </button>
        </div>
    </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   AUTH GUARD
══════════════════════════════════════════════════════════ */
const ADMIN_PASSWORD = 'admin1234';
if (localStorage.getItem('adminAuth') !== 'true') {
    const pwd = prompt("الرجاء إدخال رمز الإدارة:");
    if (pwd === ADMIN_PASSWORD) {
        localStorage.setItem('adminAuth', 'true');
    } else {
        alert("رمز غير صحيح!");
        document.body.innerHTML = "";
        window.location.replace("login.html");
    }
}

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let _allStudents = [];
let _allProfs    = {};
let _allUsers    = {};
let _currentClassProfId  = null;
let _currentClassStudents = [];
let _openAccordions = new Set(); // remember which accordions are open

/* ══════════════════════════════════════════════════════════
   TABS
══════════════════════════════════════════════════════════ */
function switchTab(name) {
    ['classes','add-student','add-prof'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
    });
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', ['classes','add-student','add-prof'][i] === name);
    });
}

/* ══════════════════════════════════════════════════════════
   MAIN RENDER
══════════════════════════════════════════════════════════ */
async function renderAll() {
    _allStudents = await Auth.getAllStudents();
    _allProfs    = await Auth.getProfs();
    _allUsers    = await Auth.getAllUsers();

    document.getElementById('total-badge').innerText = _allStudents.length + ' طالب';

    const container = document.getElementById('classes-container');
    container.innerHTML = '';

    /* Build lookup: which students belong to which prof */
    const studentToProfId = {};
    Object.entries(_allProfs).forEach(([profId, prof]) => {
        (prof.students || []).forEach(sid => { studentToProfId[sid] = profId; });
    });

    /* ── Section per prof ── */
    Object.entries(_allProfs).forEach(([profId, prof]) => {
        const profStudents = _allStudents.filter(s =>
            (prof.students || []).includes(s.username)
        );
        container.appendChild(buildClassCard(profId, prof, profStudents));
    });

    /* ── Students with no prof ── */
    const unassigned = _allStudents.filter(s => !studentToProfId[s.username]);
    if (unassigned.length > 0 || Object.keys(_allProfs).length === 0) {
        container.appendChild(buildUnassignedCard(unassigned));
    }
}

/* ── Class card ─────────────────────────────────────────── */
function buildClassCard(profId, prof, students) {
    const wrap = document.createElement('div');
    wrap.className = 'class-card';
    wrap.id = 'class-card-' + profId;

    const isOpen = _openAccordions.has(profId);

    /* Header */
    const header = document.createElement('div');
    header.className = 'class-card-header accordion-header' + (isOpen ? ' open' : '');
    header.innerHTML = `
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-white font-black text-lg">
                ${prof.prenom ? prof.prenom[0] : '؟'}
            </div>
            <div>
                <p class="text-white font-black text-base leading-tight">${prof.prenom}</p>
                <p class="text-purple-200 text-xs font-bold">${prof.classe} &nbsp;·&nbsp; ${students.length} طالب</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openClassModal('${profId}', event)"
                    class="px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-bold rounded-lg transition">
                إجراءات القسم ⚙️
            </button>
            <span class="accordion-icon text-white text-lg">▾</span>
        </div>
    `;
    header.onclick = function(e) {
        if (e.target.closest('button')) return;
        toggleAccordion(profId);
    };
    wrap.appendChild(header);

    /* Body */
    const body = document.createElement('div');
    body.className = 'accordion-body p-4 space-y-1' + (isOpen ? ' open' : '');
    body.id = 'accordion-body-' + profId;

    if (students.length === 0) {
        body.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">لا يوجد طلاب في هذا القسم بعد</p>';
    } else {
        students.forEach(s => body.appendChild(buildStudentRow(s)));
    }
    wrap.appendChild(body);
    return wrap;
}

/* ── Unassigned card ─────────────────────────────────────── */
function buildUnassignedCard(students) {
    const wrap = document.createElement('div');
    wrap.className = 'class-card';
    wrap.id = 'class-card-unassigned';

    const isOpen = _openAccordions.has('unassigned');

    const header = document.createElement('div');
    header.style.cssText = 'background: linear-gradient(135deg,#64748b,#475569); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;';
    header.className = 'accordion-header' + (isOpen ? ' open' : '');
    header.innerHTML = `
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl">👥</div>
            <div>
                <p class="text-white font-black text-base">طلاب بدون قسم</p>
                <p class="text-slate-300 text-xs font-bold">${students.length} طالب غير مُرتَّب</p>
            </div>
        </div>
        <span class="accordion-icon text-white text-lg">▾</span>
    `;
    header.onclick = () => toggleAccordion('unassigned');
    wrap.appendChild(header);

    const body = document.createElement('div');
    body.className = 'accordion-body p-4 space-y-1' + (isOpen ? ' open' : '');
    body.id = 'accordion-body-unassigned';

    if (students.length === 0) {
        body.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">جميع الطلاب مُوزَّعون على أقسام ✅</p>';
    } else {
        students.forEach(s => body.appendChild(buildStudentRow(s)));
    }
    wrap.appendChild(body);
    return wrap;
}

/* ── Student row ─────────────────────────────────────────── */
function buildStudentRow(student) {
    const row = document.createElement('div');
    row.className = 'student-row';

    const completedSurahs = Object.entries(student.progress || {})
        .filter(([id, p]) => p && p.completedAt).length;

    const statusColor = student.isSuspended
        ? 'bg-red-100 text-red-700'
        : 'bg-emerald-100 text-emerald-700';
    const statusText = student.isSuspended ? '🚫 موقوف' : '✅ نشط';

    row.innerHTML = `
        <div class="flex-1 min-w-[140px]">
            <p class="font-bold text-gray-800 text-sm">${student.prenom} ${student.nom}</p>
            <p class="text-xs text-gray-400 font-mono">${student.username}</p>
        </div>
        <span class="text-xs font-bold ${statusColor} px-2 py-0.5 rounded-full">${statusText}</span>
        <span class="text-xs text-purple-700 bg-purple-50 px-2 py-0.5 rounded-full font-bold">
            ${completedSurahs} سورة
        </span>
        <div class="flex gap-1.5 flex-wrap">
            <button onclick="openStudentModal('${student.username}', '${student.prenom} ${student.nom}')"
                    class="pill bg-purple-100 text-purple-800">
                📂 الملف
            </button>
            <button onclick="toggleUserSuspension('${student.username}')"
                    class="pill ${student.isSuspended ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                ${student.isSuspended ? '🔄 تفعيل' : '🚫 إيقاف'}
            </button>
            <button onclick="confirmRemoveStudent('${student.username}', '${student.prenom} ${student.nom}')"
                    class="pill bg-rose-100 text-rose-700">
                🗑️
            </button>
        </div>
    `;

    /* Messages row if any */
    const msgs = student.messages || [];
    if (msgs.length > 0) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'w-full mt-1 space-y-1';
        msgs.forEach(m => {
            const d = document.createElement('div');
            d.className = 'flex items-center justify-between bg-blue-50 border border-blue-100 rounded-lg px-2 py-1';
            d.innerHTML = `
                <span class="text-xs text-blue-800 font-semibold">
                    ${m.text}
                    <span class="text-blue-400">(${m.date})</span>
                </span>
                <button onclick="deleteMessage('${m.id}')"
                        class="text-rose-500 hover:text-rose-700 font-bold text-sm mr-2">✕</button>
            `;
            msgDiv.appendChild(d);
        });
        row.appendChild(msgDiv);
    }

    return row;
}

/* ── Toggle accordion ────────────────────────────────────── */
function toggleAccordion(id) {
    const header = document.querySelector('#class-card-' + id + ' .accordion-header');
    const body   = document.getElementById('accordion-body-' + id);
    if (!body) return;

    const isOpen = body.classList.contains('open');
    if (isOpen) {
        body.classList.remove('open');
        if (header) header.classList.remove('open');
        _openAccordions.delete(id);
    } else {
        body.classList.add('open');
        if (header) header.classList.add('open');
        _openAccordions.add(id);
    }
}

/* ══════════════════════════════════════════════════════════
   STUDENT MODAL
══════════════════════════════════════════════════════════ */
async function openStudentModal(username, fullName) {
    document.getElementById('modal-username').value = username;
    document.getElementById('modal-student-name').innerText = fullName;
    document.getElementById('modal-student-username').innerText = '@' + username;
    switchModalTab('profile');

    const profile = await Auth.getProfile(username);
    document.getElementById('modal-cin').checked = profile.cinProvided;
    document.getElementById('modal-birthcert').checked = profile.birthCertProvided;

    const tbody = document.getElementById('modal-payments-body');
    tbody.innerHTML = '';
    (profile.payments || []).forEach(p => addPaymentRow(p.month, p.status));

    document.getElementById('student-modal').classList.add('open');
}

function closeStudentModal(event) {
    if (event && event.target !== document.getElementById('student-modal')) return;
    document.getElementById('student-modal').classList.remove('open');
}

function switchModalTab(name) {
    ['profile','schedule','message','progress'].forEach(t => {
        document.getElementById('modal-content-' + t).classList.toggle('hidden', t !== name);
        const btn = document.getElementById('mtab-' + t);
        if (t === name) {
            btn.classList.add('bg-purple-100','text-purple-700');
            btn.classList.remove('text-gray-500');
        } else {
            btn.classList.remove('bg-purple-100','text-purple-700');
            btn.classList.add('text-gray-500');
        }
    });

    if (name === 'schedule') loadStudentSchedule();
    if (name === 'progress') loadStudentProgress();
}

async function loadStudentSchedule() {
    const username = document.getElementById('modal-username').value;
    const sched = await Auth.getSchedule(username);
    document.getElementById('modal-schedule-text').value =
        sched === 'لم يتم تحديد أوقات الحصص بعد.' ? '' : sched;
}

async function saveSchedule() {
    const username = document.getElementById('modal-username').value;
    const text = document.getElementById('modal-schedule-text').value.trim();
    if (!text) { alert('الرجاء كتابة الجدول أولاً'); return; }
    await Auth.setSchedule(username, text);
    showToast('تم حفظ الجدول ✔️', 'success');
}

async function sendSingleMsg() {
    const username = document.getElementById('modal-username').value;
    const text = document.getElementById('modal-msg-text').value.trim();
    if (!text) { alert('الرجاء كتابة الرسالة أولاً'); return; }
    await Auth.sendMessage(username, text);
    document.getElementById('modal-msg-text').value = '';
    showToast('تم الإرسال ✔️', 'success');
    await renderAll();
}

async function loadStudentProgress() {
    const username = document.getElementById('modal-username').value;
    const student  = _allStudents.find(s => s.username === username);
    const container = document.getElementById('modal-progress-content');
    if (!student) { container.innerHTML = '<p class="text-gray-400 text-sm">لا توجد بيانات</p>'; return; }

    const progress = student.progress || {};
    const entries  = Object.entries(progress);
    if (entries.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">لم يُنجز أي سورة بعد</p>';
        return;
    }

    container.innerHTML = entries.map(([id, p]) => {
        const name  = (SURAH_REGISTRY.find(s => s.id === id) || {}).nameAr || id;
        const score = p.globalScore != null ? p.globalScore : 100;
        const date  = p.completedAt ? new Date(p.completedAt).toLocaleDateString('ar') : '—';
        const color = score >= 80 ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800';
        return `
            <div class="flex items-center justify-between ${color} rounded-xl px-3 py-2 text-sm font-bold">
                <span>✅ ${name}</span>
                <span>${score}% &nbsp;·&nbsp; ${date}</span>
            </div>`;
    }).join('');
}

/* ══════════════════════════════════════════════════════════
   PROFILE / PAYMENTS
══════════════════════════════════════════════════════════ */
function addPaymentRow(month, status) {
    month  = month  || '';
    status = status || 'en attente';
    const tbody = document.getElementById('modal-payments-body');
    const tr = document.createElement('tr');
    tr.className = 'payment-row border-b border-gray-100';
    const colorClass = status === 'payé' ? 'text-emerald-600' : 'text-amber-600';
    tr.innerHTML = `
        <td class="py-2 pr-1">
            <input type="text" class="month-input w-full p-1 border rounded text-sm bg-white" value="${month}">
        </td>
        <td class="py-2 px-1">
            <select class="status-input w-full p-1 border rounded text-sm bg-white font-bold ${colorClass}">
                <option value="en attente"${status !== 'payé' ? ' selected':''}>⏳ في الانتظار</option>
                <option value="payé"${status === 'payé' ? ' selected':''}>✅ خالص</option>
            </select>
        </td>
        <td class="py-2 text-center">
            <button onclick="this.closest('tr').remove()" class="text-rose-500 font-bold hover:text-rose-700">✕</button>
        </td>`;
    tr.querySelector('.status-input').addEventListener('change', function() {
        this.className = 'status-input w-full p-1 border rounded text-sm bg-white font-bold ' +
            (this.value === 'payé' ? 'text-emerald-600' : 'text-amber-600');
    });
    tbody.appendChild(tr);
}

async function saveAdminProfile() {
    const username = document.getElementById('modal-username').value;
    const cinProvided       = document.getElementById('modal-cin').checked;
    const birthCertProvided = document.getElementById('modal-birthcert').checked;
    const payments = [];
    document.querySelectorAll('.payment-row').forEach(row => {
        const month  = row.querySelector('.month-input').value.trim();
        const status = row.querySelector('.status-input').value;
        if (month) payments.push({ month, status });
    });
    await Auth.updateProfile(username, { cinProvided, birthCertProvided, payments });
    showToast('تم حفظ الملف ✔️', 'success');
    document.getElementById('student-modal').classList.remove('open');
    await renderAll();
}

/* ══════════════════════════════════════════════════════════
   CLASS MODAL
══════════════════════════════════════════════════════════ */
function openClassModal(profId, event) {
    if (event) event.stopPropagation();
    _currentClassProfId = profId;
    const prof = _allProfs[profId];
    _currentClassStudents = _allStudents.filter(s =>
        (prof.students || []).includes(s.username)
    );

    document.getElementById('class-modal-title').innerText =
        'قسم: ' + prof.classe + ' — ' + prof.prenom;
    document.getElementById('class-msg-text').value = '';
    document.getElementById('class-schedule-text').value = '';

    /* Populate student selector (unassigned students) */
    const sel = document.getElementById('assign-student-select');
    const assignedAll = Object.values(_allProfs)
        .flatMap(p => p.students || []);
    const unassigned = _allStudents.filter(s => !assignedAll.includes(s.username));
    sel.innerHTML = unassigned.length === 0
        ? '<option>لا يوجد طلاب غير مُرتَّبين</option>'
        : unassigned.map(s =>
            `<option value="${s.username}">${s.prenom} ${s.nom}</option>`).join('');

    document.getElementById('class-modal').classList.add('open');
}

function closeClassModal(event) {
    if (event && event.target !== document.getElementById('class-modal')) return;
    document.getElementById('class-modal').classList.remove('open');
}

async function sendClassMsg() {
    const text = document.getElementById('class-msg-text').value.trim();
    if (!text) { alert('الرجاء كتابة الرسالة'); return; }
    if (_currentClassStudents.length === 0) { alert('لا يوجد طلاب في هذا القسم'); return; }

    await Promise.all(_currentClassStudents.map(s => Auth.sendMessage(s.username, text)));
    showToast('✔️ تم الإرسال لـ ' + _currentClassStudents.length + ' طلاب', 'success');
    document.getElementById('class-msg-text').value = '';
    closeClassModal();
    await renderAll();
}

async function saveClassSchedule() {
    const text = document.getElementById('class-schedule-text').value.trim();
    if (!text) { alert('الرجاء كتابة الجدول'); return; }
    if (_currentClassStudents.length === 0) { alert('لا يوجد طلاب في هذا القسم'); return; }

    await Promise.all(_currentClassStudents.map(s => Auth.setSchedule(s.username, text)));
    showToast('✔️ تم حفظ الجدول لـ ' + _currentClassStudents.length + ' طلاب', 'success');
    document.getElementById('class-schedule-text').value = '';
    closeClassModal();
    await renderAll();
}

async function assignStudentToClass() {
    const studentId = document.getElementById('assign-student-select').value;
    if (!studentId || !_currentClassProfId) return;
    await Auth.assignStudentToProf(_currentClassProfId, studentId);
    showToast('✔️ تم الربط', 'success');
    closeClassModal();
    await renderAll();
}

async function deleteCurrentProf() {
    const prof = _allProfs[_currentClassProfId];
    if (!confirm('هل أنت متأكد من حذف القسم "' + prof.classe + '" والأستاذ "' + prof.prenom + '"؟')) return;
    await Auth.deleteProf(_currentClassProfId);
    closeClassModal();
    await renderAll();
}

/* ══════════════════════════════════════════════════════════
   STUDENT ACTIONS
══════════════════════════════════════════════════════════ */
async function confirmRemoveStudent(username, fullName) {
    if (confirm('هل أنت متأكد من حذف ' + fullName + ' نهائياً؟')) {
        await Auth.deleteStudent(username);
        await renderAll();
    }
}

async function toggleUserSuspension(username) {
    await Auth.toggleSuspension(username);
    await renderAll();
}

async function deleteMessage(msgId) {
    await Auth.deleteMessageById(msgId);
    await renderAll();
}

/* ══════════════════════════════════════════════════════════
   ADD STUDENT
══════════════════════════════════════════════════════════ */
async function createStudent() {
    const prenom = document.getElementById('new-prenom').value.trim();
    const nom    = document.getElementById('new-nom').value.trim();
    const pass   = document.getElementById('new-pass').value.trim();
    const btn    = document.getElementById('btn-create');

    if (!prenom || !nom || !pass) { showAdminMsg('يرجى ملء جميع الخانات', false); return; }
    btn.disabled = true; btn.innerText = 'جاري الإضافة...';

    const res = await Auth.register(prenom, nom, pass, true);
    btn.disabled = false; btn.innerText = 'إضافة الطالب ✔️';

    if (res.ok) {
        showAdminMsg('✅ تم إنشاء حساب ' + prenom + ' ' + nom, true);
        document.getElementById('new-prenom').value = '';
        document.getElementById('new-nom').value = '';
        document.getElementById('new-pass').value = '';
        await renderAll();
    } else {
        showAdminMsg('❌ ' + res.error, false);
    }
}

function showAdminMsg(text, ok) {
    const box = document.getElementById('admin-msg');
    box.classList.remove('hidden');
    box.innerText = text;
    box.className = 'text-center text-sm font-bold mt-2 p-2 rounded ' +
        (ok ? 'text-emerald-600 bg-emerald-50' : 'text-rose-600 bg-rose-50');
    setTimeout(() => box.classList.add('hidden'), 4000);
}

/* ══════════════════════════════════════════════════════════
   ADD PROF
══════════════════════════════════════════════════════════ */
async function creerProf() {
    const p = document.getElementById('new-prof-prenom').value.trim();
    const c = document.getElementById('new-prof-classe').value.trim();
    const m = document.getElementById('new-prof-pass').value.trim();
    if (!p || !c || !m) { alert('المرجو ملء جميع الخانات'); return; }

    const res = await Auth.registerProf(p, c, m);
    if (res.ok) {
        document.getElementById('new-prof-prenom').value = '';
        document.getElementById('new-prof-classe').value = '';
        document.getElementById('new-prof-pass').value = '';
        showToast('✅ تم إضافة الأستاذ', 'success');
        await renderAll();
        switchTab('classes');
    } else {
        alert('❌ ' + res.error);
    }
}

/* ══════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════ */
function showToast(text, type) {
    const t = document.createElement('div');
    const bg = type === 'success' ? 'bg-emerald-600' : 'bg-rose-600';
    t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 ${bg} text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg z-[100] transition-all`;
    t.innerText = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
