<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفتر المتابعة - مواهب المنان</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <link rel="stylesheet" href="platform-theme.css">
  <script src="platform-theme.js"></script>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background:
        radial-gradient(circle at top right, rgba(15, 23, 42, .12), transparent 32rem),
        linear-gradient(135deg, #f8fafc, #e2e8f0);
      color: #0f172a;
      padding: 16px;
    }
    .shell { width: min(980px, 100%); margin: 0 auto; }
    .book {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 560px;
      border-radius: 30px;
      background: linear-gradient(90deg, #f8f1df, #fffaf0 48%, #d9c6a3 50%, #fffaf0 52%, #f8f1df);
      box-shadow: 0 30px 90px rgba(15, 23, 42, .22);
      overflow: hidden;
      border: 1px solid rgba(120, 92, 45, .2);
    }
    .book::before {
      content: '';
      position: absolute;
      inset-block: 0;
      right: 50%;
      width: 18px;
      transform: translateX(50%);
      background: linear-gradient(90deg, rgba(61, 43, 24, .18), rgba(255,255,255,.35), rgba(61, 43, 24, .18));
      z-index: 2;
    }
    .page {
      position: relative;
      padding: 34px 30px;
      background:
        linear-gradient(rgba(15,23,42,.035) 1px, transparent 1px) 0 74px / 100% 34px,
        radial-gradient(circle at top, rgba(255,255,255,.75), transparent 18rem);
    }
    .page-left { box-shadow: inset -18px 0 26px rgba(120, 92, 45, .08); }
    .page-right { box-shadow: inset 18px 0 26px rgba(120, 92, 45, .08); }
    .page-title { font-family: 'Amiri', serif; font-size: clamp(28px, 5vw, 46px); font-weight: 700; line-height: 1.1; }
    .recitation-row {
      border-radius: 18px;
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(120, 92, 45, .14);
      padding: 12px;
      margin-top: 10px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .turning { animation: pageTurn .42s ease both; transform-origin: right center; }
    @keyframes pageTurn {
      from { transform: rotateY(0deg); opacity: .55; }
      to { transform: rotateY(-5deg); opacity: 1; }
    }
    @media (max-width: 760px) {
      body { padding: 10px; }
      .book { display: block; min-height: auto; border-radius: 24px; }
      .book::before { display: none; }
      .page { min-height: 420px; padding: 24px 18px; }
      .page-left { display: none; }
    }
    body { padding-bottom: 96px; }
  .mawahib-nav-padding { height: 82px; }
</style>
</head>
<body>
  <script>Auth.requireAuth('login.html');</script>
  <div class="shell">
    <header class="flex items-center justify-between gap-3 mb-5">
      <div>
        <p class="text-xs font-black text-slate-500">دفتر المتابعة</p>
        <h1 id="student-name" class="text-2xl md:text-4xl font-black">...</h1>
      </div>
      <a href="dashboard.html" class="rounded-2xl bg-slate-900 text-white px-4 py-2 font-black text-sm">لوحتي</a>
    </header>

    <section class="book" id="book">
      <aside class="page page-right">
        <p class="text-xs font-black text-slate-500 mb-3">الفهرس</p>
        <h2 class="page-title mb-5">أيام التسميع</h2>
        <div id="day-list" class="space-y-2"></div>
      </aside>
      <article class="page page-left" id="day-page">
        <p class="text-slate-500 font-bold">جاري التحميل...</p>
      </article>
    </section>
  </div>

  <script>
    let groupedDays = [];
    let activeDayIndex = 0;

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    }

    function tone(result) {
      const value = String(result || '');
      if (/ممتاز|جيد جدا|متقن/.test(value)) return 'bg-emerald-50 text-emerald-700';
      if (value.includes('جيد')) return 'bg-blue-50 text-blue-700';
      if (value.includes('غائب')) return 'bg-slate-100 text-slate-600';
      return 'bg-amber-50 text-amber-700';
    }

    function noteDate(note) {
      const raw = note.savedAt || note.createdAt || note.date || '';
      const parsed = raw ? new Date(raw) : null;
      if (parsed && !Number.isNaN(parsed.getTime())) return parsed.toLocaleDateString('ar-MA');
      return raw || '-';
    }

    function rangeLabel(note) {
      if (note.scope === 'جزء') {
        if (note.ayahStart && note.ayahEnd) return 'من الآية ' + note.ayahStart + ' إلى ' + note.ayahEnd;
        if (note.ayahStart) return 'من الآية ' + note.ayahStart;
      }
      return 'السورة كاملة';
    }

    function groupByDay(notes) {
      const map = new Map();
      notes.sort((a, b) => {
        const da = new Date(a.savedAt || a.createdAt || a.date || 0).getTime() || 0;
        const db = new Date(b.savedAt || b.createdAt || b.date || 0).getTime() || 0;
        return db - da;
      }).forEach(note => {
        const day = noteDate(note);
        if (!map.has(day)) map.set(day, []);
        map.get(day).push(note);
      });
      return Array.from(map.entries()).map(([date, items]) => ({ date, items }));
    }

    function renderDayList() {
      const box = document.getElementById('day-list');
      box.innerHTML = groupedDays.length ? groupedDays.map((day, index) => {
        const active = index === activeDayIndex ? 'bg-slate-900 text-white' : 'bg-white/70 text-slate-700';
        return '<button onclick="openDay(' + index + ')" class="w-full rounded-2xl px-4 py-3 text-right font-black ' + active + '">'
          + '<span class="block">' + escapeHtml(day.date) + '</span>'
          + '<span class="block text-xs opacity-70 mt-1">' + day.items.length + ' تسميع</span>'
          + '</button>';
      }).join('') : '<p class="text-slate-500 font-bold">لا يوجد تسميع مسجل بعد.</p>';
    }

    function renderActiveDay() {
      const page = document.getElementById('day-page');
      const day = groupedDays[activeDayIndex];
      if (!day) {
        page.innerHTML = '<h2 class="page-title mb-4">لا يوجد سجل</h2><p class="text-slate-500 font-bold">عندما يسجل الأستاذ التسميع سيظهر هنا.</p>';
        return;
      }
      page.classList.remove('turning');
      void page.offsetWidth;
      page.classList.add('turning');
      page.innerHTML = '<p class="text-xs font-black text-slate-500 mb-2">صفحة اليوم</p>'
        + '<h2 class="page-title">' + escapeHtml(day.date) + '</h2>'
        + '<p class="text-sm text-slate-500 font-bold mt-2 mb-5">' + day.items.length + ' تسميع في هذا اليوم</p>'
        + day.items.map(note => {
          return '<div class="recitation-row">'
            + '<div class="flex items-start justify-between gap-3"><div><strong class="text-lg text-slate-900">' + escapeHtml(note.surah || 'تسميع عام') + '</strong><p class="text-sm font-black text-slate-500 mt-1">' + escapeHtml(rangeLabel(note)) + '</p></div><span class="chip ' + tone(note.validation) + '">' + escapeHtml(note.validation || '-') + '</span></div>'
            + (note.comment ? '<p class="text-sm text-slate-700 font-bold mt-3">' + escapeHtml(note.comment) + '</p>' : '')
            + (note.profName ? '<p class="text-xs text-slate-400 font-black mt-3">الأستاذ: ' + escapeHtml(note.profName) + '</p>' : '')
            + '</div>';
        }).join('');
    }

    function openDay(index) {
      activeDayIndex = index;
      renderDayList();
      renderActiveDay();
    }

    async function initCarnet() {
      const params = new URLSearchParams(location.search);
      let studentId = params.get('student');
      if (!studentId && typeof Auth.getSavedAccounts === 'function') {
        const savedStudent = Auth.getSavedAccounts().find(account => account && account.role === 'student');
        studentId = savedStudent ? savedStudent.username : '';
      }
      if (!studentId) {
        document.getElementById('day-page').innerHTML = '<p class="text-slate-500 font-bold">لم يتم اختيار طالب.</p>';
        return;
      }
      const users = await Auth.getAllUsers();
      const student = users[studentId] || {};
      document.getElementById('student-name').textContent = ((student.prenom || '') + ' ' + (student.nom || '')).trim() || studentId;
      const notes = typeof Auth.getTeacherNotes === 'function' ? await Auth.getTeacherNotes(studentId) : [];
      groupedDays = groupByDay(notes.filter(note => note && (note.source === 'recitation' || note.surah || note.validation)));
      renderDayList();
      renderActiveDay();
    }

    window.addEventListener('DOMContentLoaded', initCarnet);
  </script>

<nav class="nav-bottom">
  <div class="max-w-4xl mx-auto flex justify-around items-center h-16 px-4">
    <a href="dashboard.html#surah-focus" class="flex flex-col items-center gap-1 text-emerald-700 hover:text-emerald-900 transition group">
      <div class="w-10 h-10 rounded-xl bg-emerald-50 group-hover:bg-emerald-100 flex items-center justify-center text-xl transition">📖</div>
      <span class="text-[11px] font-black">السور</span>
    </a>
    <a href="profil.html" class="flex flex-col items-center gap-1 text-blue-700 hover:text-blue-900 transition group">
      <div class="w-10 h-10 rounded-xl bg-blue-50 group-hover:bg-blue-100 flex items-center justify-center text-xl transition">🗂️</div>
      <span class="text-[11px] font-black">الملف</span>
    </a>
    <a href="dashboard.html" class="active flex flex-col items-center gap-1 text-blue-700 hover:text-blue-900 transition group">
      <div class="w-10 h-10 rounded-xl bg-blue-50 group-hover:bg-blue-100 flex items-center justify-center text-xl transition">🏠</div>
      <span class="text-[11px] font-black">الرئيسية</span>
    </a>
    <a href="carnet-suivi.html" class="flex flex-col items-center gap-1 text-amber-700 hover:text-amber-900 transition group">
      <div class="w-10 h-10 rounded-xl bg-amber-50 group-hover:bg-amber-100 flex items-center justify-center text-xl transition">📘</div>
      <span class="text-[11px] font-black">دفتر متابعة التعلم</span>
    </a>
    <button type="button" data-settings-toggle class="flex flex-col items-center gap-1 text-slate-700 hover:text-slate-900 transition group">
      <div class="w-10 h-10 rounded-xl bg-slate-50 group-hover:bg-slate-100 flex items-center justify-center text-xl transition">⚙</div>
      <span class="text-[11px] font-black">الإعدادات</span>
    </button>
  </div>
</nav>
<div class="mawahib-nav-padding"></div>

<script src="app-settings.js"></script>
<script src="notifications.js"></script>
</body>
</html>
