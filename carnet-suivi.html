<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <title>دفتر متابعة التعلم - مواهب المنان</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260730-carnet-sync-8"></script>
  <link rel="stylesheet" href="platform-theme.css?v=20260801-design-restore-1">
  <script src="platform-theme.js?v=20260801-design-restore-1"></script>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f8f5f0;
      color: #0f172a;
      padding: 12px 12px calc(96px + env(safe-area-inset-bottom));
    }
    .shell { width: min(920px, 100%); margin: 0 auto; }
    .brand-logo {
      width: 78px;
      height: 78px;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(15, 23, 42, .12));
    }
    .page-head {
      background: linear-gradient(135deg, var(--platform-primary-dark, #0c4a3b), var(--platform-primary, #14532d));
      color: white;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, .15);
    }
    .list-panel {
      margin-top: 14px;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(15,23,42,.08);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(15, 23, 42, .07);
    }
    .day-group {
      padding: 16px 18px;
      border-top: 1px solid #eef2f7;
    }
    .day-group:first-child { border-top: 0; }
    .day-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      list-style: none;
    }
    .day-title::-webkit-details-marker { display: none; }
    .day-title::before { content: '\25BE'; color: var(--platform-primary, #14532d); font-size: 18px; font-weight: 900; transition: transform .18s ease; }
    .day-group:not([open]) .day-title::before { transform: rotate(-90deg); }
    .day-content { padding-top: 10px; }
    .recitation-row {
      position: relative;
      padding: 12px 14px 12px 0;
      border-top: 1px solid #f1f5f9;
    }
    .recitation-row::before {
      content: '';
      position: absolute;
      right: 0;
      top: 17px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--platform-primary, #14532d);
    }
    .recitation-row:first-of-type { border-top: 0; }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }
    .nav-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: white;
      border-top: 1px solid #e5e7eb;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mawahib-nav-padding { display: none; }
    @media (max-width: 640px) {
      body { padding: 10px 10px calc(104px + env(safe-area-inset-bottom)); }
      .brand-logo { width: 60px; height: 60px; }
      .page-head { border-radius: 18px; padding: 14px; }
      .day-group { padding: 14px; }
      .day-title { align-items: flex-start; flex-direction: column; }
      .recitation-row { padding-inline-start: 0; }
      .nav-bottom span { font-size: 9px; line-height: 1.1; }
      .nav-bottom .max-w-4xl { padding-inline: 6px; }
    }
  </style>
<link rel="stylesheet" href="mawahib-design-system.css?v=20260802-nav-juz-lock-1">
</head>
<body>
  <script>Auth.requireAuth('login.html');</script>

  <main class="shell">
    <div class="flex justify-center mb-2">
      <img src="logo.webp" alt="مواهب المنان" class="brand-logo">
    </div>

    <header class="page-head">
      <p class="text-xs font-black opacity-80">دفتر متابعة التعلم</p>
      <div class="mt-1 flex items-end justify-between gap-3">
        <h1 id="student-name" class="text-2xl md:text-4xl font-black leading-tight">...</h1>
        <a href="dashboard.html" class="shrink-0 rounded-full bg-white/14 px-4 py-2 text-sm font-black text-white">لوحتي</a>
      </div>
    </header>

    <section class="list-panel">
      <div id="recitation-list" class="min-h-[180px]">
        <div class="day-group text-slate-500 font-bold">جاري التحميل...</div>
      </div>
    </section>
  </main>

  <script>
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    }

    function tone(result) {
      const value = String(result || '');
      if (/ممتاز|جيد جدا|متقن/.test(value)) return 'bg-emerald-50 text-emerald-700';
      if (value.includes('جيد')) return 'bg-blue-50 text-blue-700';
      if (value.includes('غائب')) return 'bg-slate-100 text-slate-600';
      return 'bg-amber-50 text-amber-700';
    }

    function noteDate(note) {
      const raw = note.savedAt || note.createdAt || note.date || '';
      const parsed = raw ? new Date(raw) : null;
      if (parsed && !Number.isNaN(parsed.getTime())) return parsed.toLocaleDateString('ar-MA');
      return raw || '-';
    }

    function rangeLabel(note) {
      if (note.scope === 'جزء') {
        if (note.ayahStart && note.ayahEnd) return 'من الآية ' + note.ayahStart + ' إلى ' + note.ayahEnd;
        if (note.ayahStart) return 'من الآية ' + note.ayahStart;
      }
      return 'السورة كاملة';
    }

    function groupByDay(notes) {
      const map = new Map();
      notes.sort((a, b) => {
        const da = new Date(a.savedAt || a.createdAt || a.date || 0).getTime() || 0;
        const db = new Date(b.savedAt || b.createdAt || b.date || 0).getTime() || 0;
        return db - da;
      }).forEach(note => {
        const day = noteDate(note);
        if (!map.has(day)) map.set(day, []);
        map.get(day).push(note);
      });
      return Array.from(map.entries()).map(([date, items]) => ({ date, items }));
    }

    function renderRecitations(days) {
      const list = document.getElementById('recitation-list');
      if (!days.length) {
        list.innerHTML = '<div class="day-group text-slate-500 font-bold">لا يوجد تسميع مسجل بعد.</div>';
        return;
      }
      list.innerHTML = days.map((day, index) => {
        return '<details class="day-group"' + (index === 0 ? ' open' : '') + '>'
          + '<summary class="day-title"><h2 class="text-lg font-black text-slate-900">' + escapeHtml(day.date) + '</h2><span class="text-xs font-black text-slate-400">' + day.items.length + ' تسميع</span></summary>'
          + '<div class="day-content">' + day.items.map(note => {
            return '<div class="recitation-row">'
              + '<div class="flex items-start justify-between gap-3"><div><strong class="text-base text-slate-900">' + escapeHtml(note.surah || 'تسميع عام') + '</strong><p class="text-xs font-black text-slate-500 mt-1">' + escapeHtml(rangeLabel(note)) + '</p></div><span class="chip ' + tone(note.validation) + '">' + escapeHtml(note.validation || '-') + '</span></div>'
              + (note.comment ? '<p class="text-sm text-slate-700 font-bold mt-2">' + escapeHtml(note.comment) + '</p>' : '')
              + (note.profName ? '<p class="text-xs text-slate-400 font-black mt-2">الأستاذ: ' + escapeHtml(note.profName) + '</p>' : '')
              + '</div>';
          }).join('') + '</div>'
          + '</details>';
      }).join('');
    }

    async function initCarnet() {
      const params = new URLSearchParams(location.search);
      let studentId = params.get('student');
      const session = typeof Auth.getSession === 'function' ? Auth.getSession() : null;
      if (!studentId && session && session.role === 'student') studentId = session.username;
      if (!studentId && typeof Auth.getSavedAccounts === 'function') {
        const savedStudent = Auth.getSavedAccounts().find(account => account && account.role === 'student');
        studentId = savedStudent ? savedStudent.username : '';
      }
      if (!studentId) {
        window.location.href = 'dashboard.html';
        return;
      }
      const users = await Auth.getAllUsers();
      const student = users[studentId] || {};
      document.getElementById('student-name').textContent = ((student.prenom || '') + ' ' + (student.nom || '')).trim() || studentId;
      const notes = typeof Auth.getTeacherNotes === 'function' ? await Auth.getTeacherNotes(studentId) : [];
      renderRecitations(groupByDay(notes.filter(note => note && (note.source === 'recitation' || note.surah || note.validation))));
    }

    window.addEventListener('DOMContentLoaded', initCarnet);
  </script>
