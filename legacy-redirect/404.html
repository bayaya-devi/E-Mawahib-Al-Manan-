<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مواهب المنان</title><link rel="stylesheet" href="/E-Mawahib-Al-Manan-/redirect.css"></head><body><main><p>جار فتح المنصة الجديدة...</p><a id="continue" href="https://e-mawahib-al-manan.vercel.app/ar">متابعة</a></main><script>const p=location.pathname.toLowerCase();let t='/ar';if(p.includes('login'))t='/login';else if(p.includes('prof'))t='/teacher';else if(p.includes('parent')||p.includes('carnet'))t='/family';else if(p.includes('admin')||p.includes('controle'))t='/admin';else if(p.includes('dashboard'))t='/student';const u='https://e-mawahib-al-manan.vercel.app'+t;document.getElementById('continue').href=u;Promise.all([navigator.serviceWorker?.getRegistrations().then(r=>Promise.all(r.map(x=>x.unregister()))),window.caches?.keys().then(n=>Promise.all(n.filter(x=>x.startsWith('mawahib-')).map(x=>caches.delete(x))))]).finally(()=>location.replace(u));</script></body></html>
