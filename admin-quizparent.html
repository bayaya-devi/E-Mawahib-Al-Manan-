<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإدارة - نتائج استبيان أولياء الأمور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js?v=20260713-emergency-refresh-1"></script>

        <link rel="stylesheet" href="platform-theme.css">
    <script src="platform-theme.js"></script>
<style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f5f0; }
        .table-header { background-color: #1e293b; color: white; }
        @media (max-width: 640px) {
            body { padding: 10px !important; }
            .max-w-7xl > .flex { align-items: stretch; flex-direction: column; gap: 10px; margin-bottom: 14px; }
            h1 { font-size: 1.35rem !important; line-height: 1.35; }
            .max-w-7xl > .flex a { min-height: 44px; display: flex; align-items: center; justify-content: center; }
            table { min-width: 760px; }
            th, td { padding: 10px !important; }
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black text-gray-800">نتائج استبيان أولياء الأمور</h1>
            <a href="controle-mawahib-7x9k.html" class="px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-lg hover:bg-gray-300">عودة للإدارة</a>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <!-- جدول موحد للبيانات -->
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="table-header text-sm">
                            <th class="p-4 border-b border-gray-300">معرف الولي</th>
                            <th class="p-4 border-b border-gray-300 text-center">جودة التعليم</th>
                            <th class="p-4 border-b border-gray-300 text-center">التنظيم</th>
                            <th class="p-4 border-b border-gray-300 text-center">التواصل</th>
                            <th class="p-4 border-b border-gray-300 text-center">المنصة</th>
                            <th class="p-4 border-b border-gray-300">ملاحظات أو اقتراحات</th>
                            <th class="p-4 border-b border-gray-300">التاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="feedback-table-body">
                        <tr><td colspan="7" class="text-center p-6 text-gray-500 font-bold">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('adminAuth') !== 'true') {
            window.location.replace('controle-mawahib-7x9k.html');
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
        }

        async function loadFeedback() {
            const tbody = document.getElementById('feedback-table-body');
            
            // استدعاء البيانات من Supabase
            const { data, error } = await Auth.getSupabaseClient()
                .from('parent_feedback')
                .select('*')
                .order('date_soumission', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-red-500 font-bold">حدث خطأ في تحميل البيانات</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-gray-500 font-bold">لا توجد تقييمات حتى الآن</td></tr>`;
                return;
            }

            let html = '';
            data.forEach(item => {
                const date = new Date(item.date_soumission).toLocaleDateString('ar-MA');
                html += `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                        <td class="p-4 font-bold text-blue-700">${escapeHtml(item.parent_id)}</td>
                        <td class="p-4 text-center font-bold text-gray-700">${item.q1_enseignement}/10</td>
                        <td class="p-4 text-center font-bold text-gray-700">${item.q2_organisation}/10</td>
                        <td class="p-4 text-center font-bold text-gray-700">${item.q3_communication}/10</td>
                        <td class="p-4 text-center font-bold text-gray-700">${item.q4_plateforme}/10</td>
                        <td class="p-4 text-gray-600 text-sm max-w-xs break-words">${escapeHtml(item.commentaires || '-')}</td>
                        <td class="p-4 text-gray-500 text-sm dir-ltr text-right">${date}</td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }

        window.onload = loadFeedback;
    </script>
</body>
</html>
