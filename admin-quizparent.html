<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family:'Cairo',sans-serif; background:#eef4f0; padding-bottom:92px !important; }
        .table-header { background:#124c35; color:white; }
        .admin-parent-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-radius:16px;background:#124c35;color:#fff;box-shadow:0 14px 34px rgba(12,74,59,.2)}
        .admin-parent-back{min-height:42px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:900;text-decoration:none}
        .parent-admin-nav{position:fixed;z-index:100;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 16px),420px);display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px;background:#fff;border:1px solid #d8e4dc;border-radius:14px;box-shadow:0 12px 34px rgba(15,40,28,.18)}
        .parent-admin-nav a{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;color:#52635b;text-decoration:none;font-size:11px;font-weight:900}
        .parent-admin-nav a.active{background:#124c35;color:#fff}
        @media (max-width: 640px) {
            body { padding:10px 10px 92px !important; }
            .max-w-7xl > .flex { align-items: stretch; flex-direction: column; gap: 10px; margin-bottom: 14px; }
            h1 { font-size: 1.35rem !important; line-height: 1.35; }
            .max-w-7xl > .flex a { min-height: 44px; display: flex; align-items: center; justify-content: center; }
            table { min-width: 760px; }
            th, td { padding: 10px !important; }
        }
    </style>
<link rel="stylesheet" href="mawahib-design-system.css?v=20260802-nav-juz-lock-1">
</head>
<body class="p-6">

    <div class="max-w-7xl mx-auto">
        <div class="admin-parent-head mb-6">
            <div class="flex items-center gap-3"><img src="logo.webp" alt="" class="w-12 h-12 object-contain bg-white rounded-lg"><h1 class="text-2xl font-black">إجابات أولياء الأمور</h1></div>
            <a href="controle-mawahib-7x9k.html" class="admin-parent-back">الرئيسية</a>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <!-- جدول موحد للبيانات -->
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="table-header text-sm">
                            <th class="p-4 border-b border-gray-300">معرف الولي</th>
                            <th class="p-4 border-b border-gray-300 text-center">جودة التعليم</th>
                            <th class="p-4 border-b border-gray-300 text-center">التنظيم</th>
                            <th class="p-4 border-b border-gray-300 text-center">التواصل</th>
                            <th class="p-4 border-b border-gray-300 text-center">المنصة</th>
                            <th class="p-4 border-b border-gray-300">ملاحظات أو اقتراحات</th>
                            <th class="p-4 border-b border-gray-300">التاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="feedback-table-body">
                        <tr><td colspan="7" class="text-center p-6 text-gray-500 font-bold">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>    <nav class="parent-admin-nav" aria-label="التنقل">
        <a href="controle-mawahib-7x9k.html"><span>⌂</span><span>الرئيسية</span></a>
        <a class="active" href="admin-quizparent.html"><span>▤</span><span>إجابات الأولياء</span></a>
    </nav>
    <script>
        const adminSession = Auth.getSession();
        if (!adminSession || adminSession.role !== 'admin') {
            window.location.replace('login.html');
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
        }

        async function loadFeedback() {
            const tbody = document.getElementById('feedback-table-body');
            
            // استدعاء البيانات من Supabase
            const { data, error } = await Auth.getSupabaseClient()
                .from('parent_feedback')
                .select('*')
                .order('date_soumission', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-red-500 font-bold">حدث خطأ في تحميل البيانات</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-gray-500 font-bold">لا توجد تقييمات حتى الآن</td></tr>`;
                return;
            }

            let html = '';
            data.forEach(item => {
                const date = new Date(item.date_soumission).toLocaleDateString('ar-MA');
                html += `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                        <td class="p-4 font-bold text-blue-700">${escapeHtml(item.parent_id)}</td>
                        <td class="p-4 text-center font-bold text-gray-700">${item.q1_enseignement}/10</td>
                        <td class="p-4 text-center font-bold text-gray-700">${item.q2_organisation}/10</td>
                        <td class="p-4 text-center font-bold text-gray-700">${item.q3_communication}/10</td>
                        <td class="p-4 text-center font-bold text-gray-700">${item.q4_plateforme}/10</td>
                        <td class="p-4 text-gray-600 text-sm max-w-xs break-words">${escapeHtml(item.commentaires || '-')}</td>
                        <td class="p-4 text-gray-500 text-sm dir-ltr text-right">${date}</td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }

        window.onload = loadFeedback;
    </script>
</body>
</html>
