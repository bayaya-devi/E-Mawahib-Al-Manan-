<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f5137">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="pwa-icons/icon-192.png">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>منصة دار القرآن مواهب المنان — تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js?v=20260726-virtual-teacher-1"></script>
<style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0c4a3b 0%, #1a3c34 50%, #14532d 100%);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow-x: hidden;
        }
        *, *::before, *::after { box-sizing: border-box; }
        .hidden { display: none !important; }
        .quran-font { font-family: 'Amiri', serif; }

        .card {
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            width: min(100%, 384px);
            padding: 24px;
        }

        .card img { width: auto; max-width: 100%; height: 64px; }

        .tab-active {
            background: #059669;
            color: white;
            border-radius: 10px;
        }
        .tab-inactive {
            color: #6b7280;
        }

        .input-field {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            min-height: 44px;
            font-size: 16px;
            transition: border-color 0.2s;
            outline: none;
            direction: rtl;
        }
        .input-field[type="password"] {
            direction: ltr;
            text-align: left;
            unicode-bidi: plaintext;
            font-family: 'Cairo', Arial, sans-serif;
        }
        .input-field:focus { border-color: #059669; }

        .btn-primary {
            width: 100%;
            min-height: 46px;
            padding: 10px;
            background: #059669;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:hover  { background: #047857; }
        .btn-primary:active { transform: scale(0.98); }

        .discover-link {
            width: fit-content;
            max-width: 100%;
            min-height: 42px;
            margin: -4px auto 16px;
            padding: 9px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            background: #14532d;
            border: 2px solid #d6a33d;
            border-radius: 11px;
            box-shadow: 0 8px 18px rgba(20, 83, 45, .2);
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .discover-link:hover { transform: translateY(-2px); background: #166534; box-shadow: 0 11px 22px rgba(20, 83, 45, .28); }
        .discover-link:active { transform: scale(.97); }
        .discover-link .discover-icon { color: #f8d477; font-size: 16px; line-height: 1; }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 700;
            display: none;
        }

        .deco-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.07;
            background: white;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease; }

        @media (max-width: 480px) {
            body { padding: 10px !important; align-items: flex-start !important; overflow-y: auto !important; }
            .card { margin-block: max(8px, env(safe-area-inset-top)) 12px; padding: 18px 14px; border-radius: 16px; }
            .card img { height: 58px; margin-bottom: 10px !important; }
            .card h1 { font-size: 1.15rem !important; }
            .deco-circle { display: none; }
            #form-login, #form-register { width: 100%; }
            label { min-height: 28px; }
        }
    </style>
    <script src="platform-theme.js?v=20260723-juz-verse-puzzle-1"></script>
</head>
<body class="flex items-center justify-center p-4 relative overflow-hidden">

    <div class="deco-circle w-96 h-96 -top-20 -left-20"></div>
    <div class="deco-circle w-64 h-64 bottom-10 right-10"></div>

    <div class="card w-full max-w-sm p-6 relative fade-in z-20">

        <div class="text-center mb-5">
            <img src="logo.webp" alt="مواهب المنان" class="h-16 mx-auto mb-4 object-contain">
            <h1 class="text-xl font-black text-gray-800">منصة دار القرآن</h1>
            <p class="text-xs text-emerald-700 font-semibold mt-1">جمعية مواهب المنان • عين العودة</p>
        </div>
        <a class="discover-link" href="dar-al-hadith.html" aria-label="اعرف المزيد عن الجمعية">
            <span class="discover-icon" aria-hidden="true">ⓘ</span>
            <span>اعرف المزيد</span>
            <span aria-hidden="true">←</span>
        </a>
        <div class="flex bg-gray-100 rounded-xl p-1 mb-5 gap-1"></div>

        <div id="error-box" class="error-box mb-4"></div>

        <div id="form-login" class="space-y-3">
            
            <div class="flex justify-center gap-4 mb-3 bg-gray-50 p-2 rounded-lg border border-gray-100">
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="role" value="student" checked onchange="toggleRoleUI()" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500">
                    <span class="font-bold text-gray-700 text-xs">تلميذ</span>
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="role" value="prof" onchange="toggleRoleUI()" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500">
                    <span class="font-bold text-gray-700 text-xs">أستاذ</span>
                </label>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">الاسم :</label>
                <input id="login-prenom" type="text" class="input-field">
            </div>
            
            <div id="container-nom">
                <label class="block text-xs font-bold text-gray-600 mb-1">الاسم العائلي :</label>
                <input id="login-nom" type="text" class="input-field">
            </div>

            <div id="container-classe" class="hidden">
                <label class="block text-xs font-bold text-gray-600 mb-1">القسم :</label>
                <input type="text" id="login-classe" class="input-field" placeholder="ex: 1A, 2B...">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">كلمة المرور :</label>
                <input id="login-password" type="password" dir="ltr" autocomplete="current-password" class="input-field" placeholder="••••••"
                       onkeydown="if(event.key==='Enter') doLogin()">
            </div>
            <button class="btn-primary mt-3" onclick="doLogin()">دخول</button>
            <p id="student-login-help" class="mt-2 text-center text-xs font-medium text-gray-400 leading-relaxed">
                إذا لم تكن لديك معلومات الدخول، تواصل مع الإدارة.
            </p>
        </div>

        <div id="form-register" class="space-y-3 hidden">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">الاسم</label>
                <input id="reg-prenom" type="text" class="input-field">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">اللقب</label>
                <input id="reg-nom" type="text" class="input-field">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">كلمة المرور</label>
                <input id="reg-password" type="password" dir="ltr" autocomplete="new-password" class="input-field" placeholder="4 أحرف على الأقل"
                       onkeydown="if(event.key==='Enter') doRegister()">
            </div>
            <button class="btn-primary mt-3" onclick="doRegister()">إنشاء الحساب</button>
        </div>
    </div>
    
    <script>
        if (Auth.getSession()) {
            const s = Auth.getSession();
            sessionStorage.setItem('loading_redirect', s.role === 'admin' ? 'controle-mawahib-7x9k.html' : (s.role === 'prof' ? 'dashboard_prof.html' : 'dashboard.html'));
            window.location.href = 'loading.html';
        }

        function targetForSession(session) {
            if (session?.role === 'admin') return 'controle-mawahib-7x9k.html';
            if (session?.role === 'prof') return 'dashboard_prof.html';
            return 'dashboard.html';
        }

        function showTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('form-login').classList.toggle('hidden', !isLogin);
            document.getElementById('form-register').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login').className = `flex-1 py-1.5 font-bold text-xs ${isLogin ? 'tab-active' : 'tab-inactive'} transition-all`;
            hideError();
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.textContent = msg;
            box.style.display = 'block';
        }
        function hideError() {
            document.getElementById('error-box').style.display = 'none';
        }

        async function doRegister() {
            // ✅ .trim() sur tous les champs
            const prenom   = document.getElementById('reg-prenom').value.trim();
            const nom      = document.getElementById('reg-nom').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            
            const result = await Auth.register(prenom, nom, password);
            
            if (result.ok) {
                window.location.href = 'dashboard.html';
            } else {
                showError(result.error);
            }
        }

        function toggleRoleUI() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const containerNom = document.getElementById('container-nom');
            const containerClasse = document.getElementById('container-classe');

            if (role === 'prof') {
                containerNom.classList.add('hidden');
                containerClasse.classList.remove('hidden');
                document.getElementById('student-login-help').classList.add('hidden');
            } else {
                containerNom.classList.remove('hidden');
                containerClasse.classList.add('hidden');
                document.getElementById('student-login-help').classList.remove('hidden');
            }
        }

        async function doLogin() {
            const role = document.querySelector('input[name="role"]:checked').value;
            // ✅ .trim() sur tous les champs
            const prenom   = document.getElementById('login-prenom').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (role === 'prof') {
                const classe = document.getElementById('login-classe').value.trim(); // ✅
                const result = await Auth.loginProf(prenom, classe, password);
                if (result.ok) {
                sessionStorage.setItem('loading_redirect', targetForSession(Auth.getSession()));
    window.location.href = 'loading.html';
}
                else { showError(result.error); }
            } else {
                const nom = document.getElementById('login-nom').value.trim(); // ✅
                const result = await Auth.login(prenom, nom, password);
                if (result.ok) {
    sessionStorage.setItem('loading_redirect', 'dashboard.html');
    window.location.href = 'loading.html';
}
                else { showError(result.error); }
            }
        }
    </script>
</body>
</html>
