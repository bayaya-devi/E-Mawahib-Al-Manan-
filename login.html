<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f5137">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="pwa-icons/icon-192.png">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>منصة دار الحديث والقرآن مواهب المنان — تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js?v=20260730-teacher-force-9"></script>
<style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0c4a3b 0%, #1a3c34 50%, #14532d 100%);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow-x: hidden;
        }
        *, *::before, *::after { box-sizing: border-box; }
        .hidden { display: none !important; }
        .quran-font { font-family: 'Amiri', serif; }

        .card {
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            width: min(100%, 384px);
            padding: 24px;
        }

        .card img { width: auto; max-width: 100%; height: 64px; }

        .tab-active {
            background: #059669;
            color: white;
            border-radius: 10px;
        }
        .tab-inactive {
            color: #6b7280;
        }

        .input-field {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            min-height: 44px;
            font-size: 16px;
            transition: border-color 0.2s;
            outline: none;
            direction: rtl;
        }
        .input-field[type="password"] {
            direction: ltr;
            text-align: left;
            unicode-bidi: plaintext;
            font-family: 'Cairo', Arial, sans-serif;
        }
        .input-field:focus { border-color: #059669; }

        .btn-primary {
            width: 100%;
            min-height: 46px;
            padding: 10px;
            background: #059669;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:hover  { background: #047857; }
        .btn-primary:active { transform: scale(0.98); }

        .discover-link {
            width: fit-content;
            max-width: 100%;
            min-height: 42px;
            margin: -4px auto 16px;
            padding: 9px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            background: #14532d;
            border: 2px solid #d6a33d;
            border-radius: 11px;
            box-shadow: 0 8px 18px rgba(20, 83, 45, .2);
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .discover-link:hover { transform: translateY(-2px); background: #166534; box-shadow: 0 11px 22px rgba(20, 83, 45, .28); }
        .discover-link:active { transform: scale(.97); }
        .discover-link .discover-icon { color: #f8d477; font-size: 16px; line-height: 1; }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 700;
            display: none;
        }

        .deco-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.07;
            background: white;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease; }

        @media (max-width: 480px) {
            body { padding: 10px !important; align-items: flex-start !important; overflow-y: auto !important; }
            .card { margin-block: max(8px, env(safe-area-inset-top)) 12px; padding: 18px 14px; border-radius: 16px; }
            .card img { height: 58px; margin-bottom: 10px !important; }
            .card h1 { font-size: 1.15rem !important; }
            .deco-circle { display: none; }
            #form-login, #form-register { width: 100%; }
            label { min-height: 28px; }
            input[type="checkbox"], input[type="radio"] { width: 20px !important; height: 20px !important; flex: 0 0 20px; }
        }
    </style>
    <script src="platform-theme.js?v=20260801-design-restore-1"></script>
<link rel="stylesheet" href="mawahib-design-system.css?v=20260801-typography-accordion-1">
<link rel="stylesheet" href="login-2026.css?v=20260801-large-type-6"></head>
<body class="login-page">
<main class="login-shell" aria-label="منصة دار الحديث والقرآن">
<section class="login-brand" aria-labelledby="platform-title"><img src="logo.webp" alt="جمعية مواهب المنان" class="brand-logo"><h1 id="platform-title">منصة دار الحديث والقرآن</h1><p class="brand-subtitle">جمعية مواهب المنان - عين العودة</p><span class="brand-divider" aria-hidden="true">✦</span><a class="discover-link" href="dar-al-hadith.html" aria-label="زيارة الموقع"><span aria-hidden="true">◎</span><span>زيارة الموقع</span></a></section>
<section class="login-card" aria-labelledby="login-title"><header class="login-card-head"><h2 id="login-title">تسجيل الدخول</h2><span class="login-star" aria-hidden="true">✦</span><p>مرحباً بك، يرجى إدخال بياناتك للدخول إلى المنصة</p></header><div id="error-box" class="error-box" role="alert" aria-live="polite" hidden></div><form id="form-login" novalidate onsubmit="event.preventDefault(); doLogin();"><fieldset class="role-selector"><legend>نوع الحساب</legend><label class="role-option" for="role-student"><input id="role-student" type="radio" name="role" value="student" checked onchange="toggleRoleUI()"><span class="role-icon" aria-hidden="true">♙</span><span>تلميذ</span></label><label class="role-option" for="role-prof"><input id="role-prof" type="radio" name="role" value="prof" onchange="toggleRoleUI()"><span class="role-icon" aria-hidden="true">⌘</span><span>أستاذ</span></label></fieldset><div class="field-group"><label for="login-prenom">الاسم</label><div class="field-control"><span aria-hidden="true">♙</span><input id="login-prenom" type="text" autocomplete="given-name" placeholder="أدخل اسمك"></div></div><div id="container-nom" class="field-group"><label for="login-nom">الاسم العائلي</label><div class="field-control"><span aria-hidden="true">♙</span><input id="login-nom" type="text" autocomplete="family-name" placeholder="أدخل اسم العائلة"></div></div><div id="container-classe" class="field-group hidden"><label for="login-classe">القسم</label><div class="field-control"><span aria-hidden="true">▦</span><input id="login-classe" type="text" dir="auto" autocomplete="organization" placeholder="أدخل القسم"></div></div><div class="field-group"><label for="login-password">كلمة المرور</label><div class="field-control password-control"><span aria-hidden="true">⌑</span><input id="login-password" type="password" dir="ltr" autocomplete="current-password" placeholder="أدخل كلمة المرور"><button type="button" class="password-toggle" onclick="toggleLoginPassword()" aria-label="إظهار كلمة المرور" aria-pressed="false">◉</button></div></div><button id="login-submit" type="submit" class="btn-primary"><span aria-hidden="true">↲</span><span class="login-submit-label">دخول</span></button><p id="student-login-help" class="login-help">إذا لم تكن لديك معلومات الدخول، تواصل مع الإدارة.</p></form><div id="form-register" class="hidden" aria-hidden="true"><input id="reg-prenom" type="text"><input id="reg-nom" type="text"><input id="reg-password" type="password" dir="ltr"><button type="button" onclick="doRegister()">إنشاء الحساب</button></div></section>
</main>
<script>
if(Auth.getSession()){const s=Auth.getSession();sessionStorage.setItem('loading_redirect',s.role==='admin'?'controle-mawahib-7x9k.html':(s.role==='prof'?'dashboard_prof.html':'dashboard.html'));window.location.href='loading.html';}
function targetForSession(session){if(session?.role==='admin')return 'controle-mawahib-7x9k.html';if(session?.role==='prof')return 'dashboard_prof.html';return 'dashboard.html';}
function showTab(tab){const isLogin=tab==='login';document.getElementById('form-login').classList.toggle('hidden',!isLogin);document.getElementById('form-register').classList.toggle('hidden',isLogin);hideError();}
function showError(message){const box=document.getElementById('error-box');box.textContent=message||'معلومات الدخول غير صحيحة.';box.hidden=false;}
function hideError(){const box=document.getElementById('error-box');box.hidden=true;box.textContent='';}
function setLoginSubmitting(active){const button=document.getElementById('login-submit');button.disabled=active;button.querySelector('.login-submit-label').textContent=active?'جاري الدخول...':'دخول';button.setAttribute('aria-busy',String(active));}
function toggleLoginPassword(){const input=document.getElementById('login-password'),button=document.querySelector('.password-toggle'),visible=input.type==='text';input.type=visible?'password':'text';button.setAttribute('aria-label',visible?'إظهار كلمة المرور':'إخفاء كلمة المرور');button.setAttribute('aria-pressed',String(!visible));input.focus();}
async function doRegister(){const prenom=document.getElementById('reg-prenom').value.trim(),nom=document.getElementById('reg-nom').value.trim(),password=document.getElementById('reg-password').value.trim(),result=await Auth.register(prenom,nom,password);if(result.ok)window.location.href='dashboard.html';else showError(result.error);}
function toggleRoleUI(){const isProf=document.querySelector('input[name="role"]:checked').value==='prof';document.getElementById('container-nom').classList.toggle('hidden',isProf);document.getElementById('container-classe').classList.toggle('hidden',!isProf);hideError();}
async function doLogin(){if(document.getElementById('login-submit').disabled)return;hideError();const role=document.querySelector('input[name="role"]:checked').value,prenom=document.getElementById('login-prenom').value.trim(),password=document.getElementById('login-password').value.trim(),nom=document.getElementById('login-nom').value.trim(),classe=document.getElementById('login-classe').value.trim();if(!prenom)return showError('يرجى إدخال الاسم.');if(role==='student'&&!nom)return showError('يرجى إدخال الاسم العائلي.');if(role==='prof'&&!classe)return showError('يرجى إدخال القسم.');if(!password)return showError('يرجى إدخال كلمة المرور.');setLoginSubmitting(true);try{const result=role==='prof'?await Auth.loginProf(prenom,classe,password):await Auth.login(prenom,nom,password);if(!result.ok)return showError(result.error||'معلومات الدخول غير صحيحة.');sessionStorage.setItem('loading_redirect',role==='prof'?targetForSession(Auth.getSession()):'dashboard.html');window.location.href='loading.html';}catch(_){showError('تعذر الاتصال، يرجى المحاولة مرة أخرى.');}finally{setLoginSubmitting(false);}}
</script></body></html>
