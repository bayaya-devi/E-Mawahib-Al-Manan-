<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f5f0; }
        .quran-font { font-family: 'Amiri', serif; }
        .surah-card { transition: transform 0.25s ease, box-shadow 0.25s ease; cursor: pointer; }
        .surah-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px -6px rgba(0,0,0,0.15); }
        .surah-card-locked { opacity: 0.55; cursor: not-allowed; filter: grayscale(0.3); }
        .filter-chip { transition: all .2s ease; }
        .filter-chip.active { background: #047857; color: white; border-color: #047857; box-shadow: 0 8px 18px rgba(4,120,87,.22); }
        .sort-select, .search-input { min-height: 46px; }
        .juz-section { scroll-margin-top: 16px; }
        .header-bg { background: linear-gradient(135deg, #1a3c34 0%, #0c4a3b 40%, #14532d 100%); }
        .nav-bottom { 
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: white; border-top: 1px solid #e5e7eb;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    padding-bottom: env(safe-area-inset-bottom);
}
body { padding-bottom: 80px; }

<body>
<div class="flex justify-center mb-4 mt-2">
    <img src="logo.webp" alt="مواهب المنان" class="h-24 object-contain drop-shadow-md">
</div>

    <script>Auth.requireAuth('login.html');</script>

    <header class="header-bg text-white py-6 px-4 shadow-xl">
       <div id="messages-container" class="max-w-5xl mx-auto mb-6 hidden"></div>
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-2xl overflow-hidden border border-white/20 shadow-inner bg-white/10 flex items-center justify-center">
                    <span class="text-3xl">📖</span>
                </div>
                <div>
                    <h1 class="text-xl md:text-3xl font-black leading-tight">مرحباً بك(ي)، <span id="student-name" class="text-emerald-300"></span> ! </h1>
                    <p class="text-emerald-100 font-semibold mt-1 text-sm">اختر(ي) السورة التي تود(ي) دراستها ومراجعتها اليوم</p>

            <button onclick="Auth.logout(); window.location.href='login.html'" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white font-bold rounded-xl border border-white/20 transition text-sm">
الخروج            </button>

<!-- Zone des devoirs (Générée par JS) -->
<div id="zone-devoirs" class="mb-8 space-y-3">
    <!-- Les devoirs s'afficheront ici -->
</div>
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6 flex items-center justify-between max-w-4xl mx-auto mt-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center text-2xl shadow-inner">
                📅
            </div>
            <div>
                <h2 class="text-sm text-gray-500 font-bold mb-1"> توقيت الحصص </h2>
                <p id="student-schedule" class="text-lg text-blue-900 font-extrabold quran-font"></p>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 mt-6">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex items-center gap-4">
            <div class="flex-grow">
                <div class="flex justify-between text-sm mb-2 font-bold text-gray-700">
                    <span>تقدمك(ي) العام</span>
                    <span id="student-progress-label">0 / 0 سورة</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-3 shadow-inner overflow-hidden">

                </div>
            </div>

        </div>

    <main class="max-w-5xl mx-auto px-4 py-6">
        <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4 md:p-5 mb-5">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-lg font-black text-gray-800 flex items-center gap-2">
                        <span class="w-2 h-6 bg-emerald-500 rounded-full inline-block"></span>
                        مكتبة السور حسب الأجزاء
                    </h2>
                    <p class="text-xs text-gray-500 font-bold mt-1">ابحث، صفّي، ثم اختر الجزء المناسب بدون أن تضيع وسط ١١٤ سورة.</p>
                </div>
                <div id="library-count" class="bg-emerald-50 text-emerald-700 rounded-2xl px-4 py-2 text-sm font-black text-center"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-[1fr_180px] gap-3 mb-4">
                <input id="surah-search" class="search-input w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 font-bold outline-none focus:border-emerald-500" type="search" placeholder="ابحث بالاسم، الرقم، أو عدد الآيات">
                <select id="surah-sort" class="sort-select rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 font-bold outline-none focus:border-emerald-500">
                    <option value="num">حسب الرقم</option>
                    <option value="name">حسب الاسم</option>
                    <option value="ayat">حسب عدد الآيات</option>
                </select>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2" id="filter-bar">
                <button class="filter-chip active shrink-0 rounded-full border border-gray-200 px-4 py-2 text-sm font-black" data-filter="all">كل السور</button>
                <button class="filter-chip shrink-0 rounded-full border border-gray-200 px-4 py-2 text-sm font-black" data-filter="progress">قيد الدراسة</button>
                <button class="filter-chip shrink-0 rounded-full border border-gray-200 px-4 py-2 text-sm font-black" data-filter="completed">تمت</button>
                <button class="filter-chip shrink-0 rounded-full border border-gray-200 px-4 py-2 text-sm font-black" data-filter="short">قصيرة</button>
                <button class="filter-chip shrink-0 rounded-full border border-gray-200 px-4 py-2 text-sm font-black" data-filter="medium">متوسطة</button>
                <button class="filter-chip shrink-0 rounded-full border border-gray-200 px-4 py-2 text-sm font-black" data-filter="long">طويلة</button>
            </div>
        </section>
        <h2 id="section-available" class="hidden text-lg font-black text-gray-700 mb-4 items-center gap-2">
    <span class="w-2 h-6 bg-emerald-500 rounded-full inline-block"></span>
    السور المتاحة للتعلم
</h2>
        <div class="space-y-4 mb-10" id="available-grid"></div>

        <h2 id="section-locked" class="hidden text-lg font-black text-gray-700 mb-4 items-center gap-2">
    <span class="w-2 h-6 bg-gray-300 rounded-full inline-block"></span>
    السور القادمة قريباً
</h2>
        <div class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3" id="locked-grid"></div>
    </main>

    <script>
        function toArabicNum(n) { return String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }
        const dashboardState = { filter: 'all', search: '', sort: 'num', surahs: [] };
        const juzRanges = [
            [1, 1], [2, 2], [2, 2], [3, 4], [4, 4], [4, 5], [5, 6], [6, 7], [7, 8], [8, 9],
            [9, 10], [11, 12], [12, 14], [15, 16], [17, 18], [18, 20], [21, 22], [23, 25], [25, 27], [27, 29],
            [29, 33], [33, 36], [36, 39], [39, 41], [41, 45], [46, 51], [51, 57], [58, 66], [67, 77], [78, 114]
        ];

        function getProgressFor(progressData, surah) {
            if (Array.isArray(progressData)) {
                return progressData.find(p => p.surah_id === surah.id || p.surah_id === surah.id.replace('_', '-')) || {};
            }
            return progressData ? (progressData[surah.id] || progressData[surah.id.replace('_', '-')] || {}) : {};
        }

        function getLengthType(ayat) {
            if (ayat <= 10) return 'short';
            if (ayat <= 50) return 'medium';
            return 'long';
        }

        function matchesFilter(surah) {
            if (dashboardState.filter === 'completed') return surah.isCompleted;
            if (dashboardState.filter === 'progress') return !surah.isCompleted;
            if (['short', 'medium', 'long'].includes(dashboardState.filter)) return surah.lengthType === dashboardState.filter;
            return true;
        }

        function matchesSearch(surah) {
            const q = dashboardState.search.trim().toLowerCase();
            if (!q) return true;
            return [surah.nameAr, surah.nameFr || '', String(surah.num), String(surah.ayat)]
                .some(value => String(value).toLowerCase().includes(q));
        }

        function sortSurahs(items) {
            return [...items].sort((a, b) => {
                if (dashboardState.sort === 'name') return String(a.nameAr).localeCompare(String(b.nameAr), 'ar');
                if (dashboardState.sort === 'ayat') return a.ayat - b.ayat || a.num - b.num;
                return a.num - b.num;
            });
        }

        function renderSurahCard(surah) {
            const statusBadge = surah.isCompleted
                ? `<span class="bg-emerald-100 text-emerald-800 text-[11px] px-2 py-1 rounded-full font-black">تمت ${surah.score ? `• ${surah.score}%` : ''}</span>`
                : `<span class="bg-amber-100 text-amber-800 text-[11px] px-2 py-1 rounded-full font-black">قيد الدراسة</span>`;
            return `
                <button onclick="window.location.href='${surah.file}'" class="surah-card bg-white rounded-2xl p-3 border border-gray-100 flex items-center justify-between text-right hover:border-emerald-300">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-11 h-11 rounded-xl flex items-center justify-center text-lg font-black shrink-0" style="background-color:${surah.color}15;color:${surah.color}">
                            ${toArabicNum(surah.num)}
                        </div>
                        <div class="min-w-0">
                            <h3 class="font-black text-lg text-gray-800 quran-font truncate">${surah.nameAr}</h3>
                            <p class="text-[11px] font-bold text-gray-500">${surah.type} • ${toArabicNum(surah.ayat)} آيات • ${surah.nameFr || ''}</p>
                        </div>
                    </div>
                    <div class="shrink-0">${statusBadge}</div>
                </button>
            `;
        }

        function renderSurahLibrary() {
            const container = document.getElementById('available-grid');
            const filtered = sortSurahs(dashboardState.surahs.filter(s => matchesFilter(s) && matchesSearch(s)));
            document.getElementById('library-count').innerText = `${toArabicNum(filtered.length)} / ${toArabicNum(dashboardState.surahs.length)} سورة`;
            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-2xl border border-gray-100 p-8 text-center text-gray-500 font-bold">لا توجد سورة مطابقة لهذا البحث.</div>`;
                return;
            }
            container.innerHTML = juzRanges.map(([start, end], index) => {
                const items = filtered.filter(s => s.num >= start && s.num <= end);
                if (items.length === 0) return '';
                const juzSurahs = dashboardState.surahs.filter(s => s.num >= start && s.num <= end).sort((a, b) => a.num - b.num);
                const firstSurah = juzSurahs[0];
                const lastSurah = juzSurahs[juzSurahs.length - 1];
                const juzRangeLabel = firstSurah && lastSurah
                    ? `من ${firstSurah.nameAr} إلى ${lastSurah.nameAr}`
                    : `من سورة ${toArabicNum(start)} إلى سورة ${toArabicNum(end)}`;
                return `
                    <section class="juz-section bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                        <details ${index === 29 || dashboardState.search || dashboardState.filter !== 'all' ? 'open' : ''}>
                            <summary class="cursor-pointer list-none px-4 py-4 flex items-center justify-between gap-3 bg-gray-50 hover:bg-emerald-50">
                                <div>
                                    <h3 class="font-black text-gray-800">الجزء ${toArabicNum(index + 1)}</h3>
                                    <p class="text-xs text-gray-500 font-bold quran-font">${juzRangeLabel}</p>
                                </div>
                                <span class="bg-white border border-gray-200 rounded-full px-3 py-1 text-xs font-black text-emerald-700">${toArabicNum(items.length)} سورة</span>
                            </summary>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 p-3">
                                ${items.map(renderSurahCard).join('')}
                            </div>
                        </details>
                    </section>
                `;
            }).join('');
        }

        function bindLibraryControls() {
            document.querySelectorAll('.filter-chip').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    dashboardState.filter = btn.dataset.filter;
                    renderSurahLibrary();
                };
            });
            document.getElementById('surah-search').oninput = (event) => {
                dashboardState.search = event.target.value;
                renderSurahLibrary();
            };
            document.getElementById('surah-sort').onchange = (event) => {
                dashboardState.sort = event.target.value;
                renderSurahLibrary();
            };
        }

        // Ajoute ceci dans la fonction d'initialisation de ta page (ex: window.onload)
async function chargerDevoirs() {
            const session = Auth.getSession();
            if (!session) return;
            const devoirs = await Auth.getDevoirs('student', session.username);
            const devoirsEnAttente = devoirs.filter(d => d.statut === 'en_attente');
            
            const zoneDevoirs = document.getElementById('zone-devoirs');
            if (devoirsEnAttente.length > 0) {
                let html = '<h2 class="text-xl font-black text-rose-600 mb-3">🚨 واجبات جديدة </h2>';
                devoirsEnAttente.forEach(devoir => {
                    html += `<div class="bg-rose-50 border border-rose-200 p-4 rounded-xl mb-3">
                        <p class="text-sm text-rose-800 font-bold mb-1"> من الأستاذ(ة): ${devoir.prof_name}</p>
                        <h3 class="text-lg font-black text-gray-800">سورة ${devoir.surate} : من الآية ${devoir.aya_debut} إلى الآية ${devoir.aya_fin}</h3>
                        <p class="text-sm text-gray-600 mt-1">⏳ آخر أجل : ${devoir.date_limite}</p>
                        <button onclick="validerDevoir('${devoir.id}')" class="mt-2 bg-rose-600 text-white px-4 py-1 rounded font-bold">حفظت الواجب ✅</button>
                    </div>`;
                });
                zoneDevoirs.innerHTML = html;
            } else {
                zoneDevoirs.innerHTML = `<div class="text-center p-6 bg-white rounded-xl border border-gray-200 shadow-sm mb-4"><div class="text-4xl mb-3 opacity-50">📚</div><p class="text-gray-600 text-lg font-bold" dir="rtl">لا يوجد أي واجب حالياً.</p></div>`;
            }
        }

        

        async function buildStudentDashboard() {
            const session = Auth.getSession();
            if (!session) return;
            
            // 1. Affichage des messages administratifs
            const userMessages = await Auth.getMessages(session.username);
            const msgContainer = document.getElementById('messages-container');
            if (userMessages.length > 0) {
                msgContainer.classList.remove('hidden');
                msgContainer.innerHTML = userMessages.map(m => `
                    <div class="bg-blue-50 border-r-4 border-blue-500 p-4 rounded-xl mb-3 shadow-sm flex justify-between items-center">
                        <div><h4 class="font-bold text-blue-800 text-sm">رسالة من الإدارة 📢 :</h4><p class="text-blue-900 mt-1 text-lg font-semibold">${m.text}</p></div>
                        <button onclick="Auth.clearMessages('${session.username}'); window.location.reload();" class="bg-white text-blue-500 px-3 py-1 rounded-lg text-sm font-bold shadow-sm">إخفاء ✓</button>
                    </div>`).join('');
            }

            // 2. Affichage des infos de l'élève
            document.getElementById('student-schedule').innerText = await Auth.getSchedule(session.username);
            document.getElementById('student-name').innerText = session.prenom;
            
            // 3. Récupération de la progression
            const progressData = await Auth.getProgress(session.username);
            
            // 4. GÉNÉRATION DES SOURATES (C'est ce qui te manquait !)
            const availableGrid = document.getElementById('available-grid');
            const lockedGrid = document.getElementById('locked-grid');
            availableGrid.innerHTML = '';
            lockedGrid.innerHTML = '';

            let availableCount = 0;
            let completedCount = 0;

            SURAH_REGISTRY.forEach(surah => {
                if (surah.available) {
                    availableCount++;

                    
// --- DÉBUT DE LA CORRECTION ---
let pData = {};

// 1. Gérer le format des données (Si Supabase renvoie une liste/tableau)
if (Array.isArray(progressData)) {
    pData = progressData.find(p => 
        p.surah_id === surah.id || 
        p.surah_id === surah.id.replace('_', '-') // Corrige la différence al_qadr / al-qadr
    ) || {};
} 
// 2. Gérer le format Objet (Dictionnaire)
else if (progressData) {
    pData = progressData[surah.id] || progressData[surah.id.replace('_', '-')] || {};
}

// 3. Gérer les noms exacts des colonnes dans ta base de données Supabase
const isCompleted = pData.is_completed === true || !!pData.completed_at || !!pData.completedAt || pData.status === 'completed';
const score = pData.score || pData.global_score || pData.globalScore || 0;
// --- FIN DE LA CORRECTION ---



                    
                    if (isCompleted) completedCount++;

                    const statusBadge = isCompleted 
                        ? `<span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded font-bold">مكتملة ✅ (${score}%)</span>`
                        : `<span class="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded font-bold">قيد الدراسة ⏳</span>`;

                    availableGrid.innerHTML += `
                        <div onclick="window.location.href='${surah.file}'" class="surah-card bg-white rounded-2xl p-5 border-2 border-transparent flex items-center justify-between group hover:shadow-md" style="--hover-border: ${surah.color};" onmouseover="this.style.borderColor='${surah.color}'" onmouseout="this.style.borderColor='transparent'">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow-inner" style="background-color: ${surah.color}15; color: ${surah.color}">
                                    ${surah.emoji}
                                </div>
                                <div>
                                    <h3 class="font-black text-xl text-gray-800 mb-1 quran-font">${surah.nameAr}</h3>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs font-bold text-gray-500">${surah.type} • ${toArabicNum(surah.ayat)} آيات</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col items-end gap-2">
                                <span class="text-sm font-black text-gray-300">﴿${toArabicNum(surah.num)}﴾</span>
                                ${statusBadge}
                            </div>
                        </div>
                    `;
                } else {
                    lockedGrid.innerHTML += `
                        <div class="surah-card-locked bg-gray-50 rounded-xl p-4 border border-gray-200 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-gray-200 flex items-center justify-center text-lg grayscale">
                                ${surah.emoji}
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-600 quran-font">${surah.nameAr}</h3>
                                <span class="text-[10px] font-bold text-gray-400">قريباً إن شاء الله</span>
                            </div>
                        </div>
                    `;
                }
            });

            // 5. Mise à jour de la barre de progression globale
            document.getElementById('student-progress-label').innerText = `${completedCount} / ${availableCount} سورة`;
            const progressPercent = availableCount === 0 ? 0 : Math.round((completedCount / availableCount) * 100);
            document.getElementById('student-progress-fill').style.width = `${progressPercent}%`;

            dashboardState.surahs = SURAH_REGISTRY
                .filter(surah => surah.available)
                .map(surah => {
                    const pData = getProgressFor(progressData, surah);
                    const isCompleted = pData.is_completed === true || !!pData.completed_at || !!pData.completedAt || pData.status === 'completed';
                    const score = pData.score || pData.global_score || pData.globalScore || 0;
                    return {
                        ...surah,
                        isCompleted,
                        score,
                        lengthType: getLengthType(surah.ayat)
                    };
                });
            bindLibraryControls();
            renderSurahLibrary();
        }

        chargerDevoirs();
        buildStudentDashboard();
    </script>
