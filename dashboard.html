        body { font-family: 'Cairo', sans-serif; background-color: #f8f5f0; }
        .quran-font { font-family: 'Amiri', serif; }
        .surah-card { transition: transform 0.25s ease, box-shadow 0.25s ease; cursor: pointer; }
        .surah-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px -6px rgba(0,0,0,0.15); }
        .surah-card-locked { opacity: 0.55; cursor: not-allowed; filter: grayscale(0.3); }
        .juz-section { scroll-margin-top: 16px; transition: opacity .2s ease, filter .2s ease, transform .2s ease; }
        .juz-section.is-muted { opacity: .42; filter: grayscale(.9); }
        .juz-section.is-active { opacity: 1; filter: none; transform: translateY(-1px); }
        .juz-section.is-complete { opacity: .82; filter: saturate(.85); }
        .juz-section.is-muted .surah-journey { pointer-events: none; }
        .juz-section.is-muted .juz-road-header { background: linear-gradient(135deg, #e5e7eb, #f8fafc) !important; }
        .juz-section.is-active .juz-road-header { box-shadow: inset 0 -5px 0 color-mix(in srgb, var(--platform-primary) 18%, transparent); }
        .surah-journey { position: relative; padding: 18px 8px 22px; }
        .surah-journey::before {
            content: ''; position: absolute; top: 22px; bottom: 22px; left: 50%; width: 8px;
            transform: translateX(-50%); border-radius: 999px;
            background: linear-gradient(180deg, var(--platform-primary-soft), rgba(148,163,184,.26));
        }
        .journey-step { position: relative; min-height: 92px; display: flex; align-items: center; margin: 2px 0; }
        .journey-step:nth-child(odd) { justify-content: flex-start; padding-left: calc(50% + 28px); }
        .journey-step:nth-child(even) { justify-content: flex-end; padding-right: calc(50% + 28px); }
        .journey-node {
            width: min(100%, 280px); border: 0; text-align: right; border-radius: 24px; padding: 12px 14px;
            background: white; box-shadow: 0 15px 34px rgba(15,23,42,.12); display: flex; align-items: center; gap: 12px;
        }
        .journey-node:disabled { cursor: not-allowed; }
        .journey-orb-button { border: 6px solid #fff; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
        .journey-orb-button:hover { transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 16px 32px rgba(15,23,42,.22); }
        .journey-orb {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 58px; height: 58px; border-radius: 999px; display: grid; place-items: center;
            border: 6px solid #fff; box-shadow: 0 12px 26px rgba(15,23,42,.16); font-weight: 900;
        }
        .journey-node.done, .journey-orb.done { background: linear-gradient(135deg, #10b981, #047857); color: white; }
        .journey-node.current, .journey-orb.current { background: linear-gradient(135deg, var(--platform-primary), var(--platform-accent)); color: white; }
        .journey-node.current, .journey-orb.current { animation: nextSurahPulse 1.8s ease-in-out infinite; }
        @keyframes nextSurahPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(20,83,45,.10); } 50% { box-shadow: 0 0 0 8px rgba(20,83,45,.24); } }
        .completed-juz-picker { display:flex; gap:8px; overflow-x:auto; padding:2px 1px 8px; scrollbar-width:none; }
        .completed-juz-picker::-webkit-scrollbar { display:none; }
        .completed-juz-button { flex:0 0 auto; min-height:42px; border:1px solid #dbe5df; border-radius:10px; padding:0 13px; background:#fff; color:#405049; font-weight:900; font-size:12px; }
        .journey-node.locked { background: #f3f4f6; color: #94a3b8; box-shadow: inset 0 0 0 1px rgba(148,163,184,.18); }
        .mini-exam-node { background: linear-gradient(135deg, #fff7ed, #ffffff); border: 1px solid rgba(249,115,22,.22); }
        .mini-exam-node.done { background: linear-gradient(135deg, #10b981, #047857); color: #fff; }
        .mini-exam-node.locked { background: #f1f5f9; color: #94a3b8; border-color: rgba(148,163,184,.22); }
        .mini-exam-orb { background: linear-gradient(135deg, #f97316, var(--platform-accent)); color: #fff; }
        .mini-exam-orb.done { background: linear-gradient(135deg, #10b981, #047857); }
        .mini-exam-orb.locked { background: #e2e8f0; color: #94a3b8; }
        .mini-exam-modal { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(15,23,42,.55); backdrop-filter: blur(10px); }
        .mini-exam-modal.open { display: flex; }
        .mini-exam-card { width: min(100%, 520px); border-radius: 26px; background: #fff; box-shadow: 0 24px 70px rgba(15,23,42,.24); padding: 18px; }
        .mini-exam-option { width: 100%; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px 14px; text-align: right; font-weight: 900; background: #f8fafc; }
        .mini-exam-option:hover { border-color: var(--platform-primary); background: var(--platform-primary-soft); }
        .mini-exam-option.correct { background: #dcfce7; color: #166534; border-color: #22c55e; }
        .mini-exam-option.wrong { background: #fee2e2; color: #991b1b; border-color: #f87171; }
        .journey-orb.locked { background: #e5e7eb; color: #94a3b8; }
        .journey-meta { font-size: 11px; font-weight: 800; opacity: .78; }
        .journey-state { font-size: 11px; font-weight: 900; border-radius: 999px; padding: 4px 9px; background: rgba(255,255,255,.76); color: inherit; }
        .juz-road-header { background: linear-gradient(135deg, var(--platform-primary-soft), #fff); }
        .daily-hub { max-width: 64rem; margin: 12px auto 0; padding: 0 16px; }
        .daily-hub-card {
            background: rgba(255,255,255,.96); border: 1px solid rgba(16,185,129,.14); border-radius: 18px;
            box-shadow: 0 12px 26px rgba(15,23,42,.06); padding: 10px;
        }
        .daily-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(220px, .82fr) minmax(0, 1fr); gap: 12px; align-items: stretch; }
        .daily-tile {
            min-height: 74px; border-radius: 14px; background: linear-gradient(135deg, #f8fffb, #ffffff);
            border: 1px solid rgba(16,185,129,.12); padding: 9px 10px; overflow: hidden;
        }
        .daily-title { font-size: 11px; font-weight: 900; color: var(--platform-primary-dark); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .daily-title::before { content: ''; width: 6px; height: 6px; border-radius: 999px; background: var(--platform-accent); box-shadow: 0 0 0 3px var(--platform-primary-soft); }
        .daily-text { color: #334155; font-size: 12px; font-weight: 700; line-height: 1.45; max-height: 72px; overflow: auto; }
        .daily-text:empty::after { content: 'لا يوجد جديد اليوم'; color: #94a3b8; font-weight: 800; }
        .daily-progress { display: grid; grid-template-columns: auto minmax(160px, 1fr) auto; gap: 10px; align-items: center; margin-top: 10px; color: #475569; font-size: 12px; font-weight: 900; }
        .daily-progress-track { height: 8px; background: rgba(148,163,184,.16); border-radius: 999px; overflow: hidden; }
        .daily-progress-track > div { height: 100%; background: linear-gradient(90deg, var(--platform-primary), var(--platform-accent)); }
        .reward-strip {
            margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(170px, 280px)); justify-content: center; gap: 8px;
        }
        .reward-pill {
            border-radius: 18px; padding: 12px 16px; text-align: center; background: linear-gradient(135deg, #fff7ed, #ffffff);
            border: 1px solid rgba(217,164,65,.22); min-height: 72px; box-shadow: 0 14px 28px rgba(217,119,6,.10);
        }
        .reward-kicker { font-size: 11px; color: #64748b; font-weight: 900; }
        .reward-value { margin-top: 3px; font-size: 28px; color: #111827; font-weight: 900; line-height: 1; }
        .reward-stars-value { color: #d97706; text-shadow: 0 2px 12px rgba(250, 204, 21, .45); animation: starPulse 2.4s ease-in-out infinite; }
        .reward-rank-value { color: var(--platform-primary-dark); }
        .reward-note { margin-top: 5px; font-size: 10px; color: #64748b; font-weight: 800; line-height: 1.25; }
        @keyframes starPulse { 0%,100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.08); filter: brightness(1.18); } }
        .header-bg { background: linear-gradient(135deg, #1a3c34 0%, #0c4a3b 40%, #14532d 100%); }

        @media (max-width: 900px) {
            .daily-grid { grid-template-columns: 1fr 1fr; }
            .daily-tile:last-child { grid-column: 1 / -1; }
        }
        @media (max-width: 640px) {
            .daily-hub { margin-top: 12px; padding: 0 12px; }
            .daily-grid { grid-template-columns: 1fr; }
            .daily-tile:last-child { grid-column: auto; }
            .daily-progress { grid-template-columns: 1fr; gap: 6px; }

            .surah-journey { padding-inline: 0; }
            .surah-journey::before { left: 28px; transform: none; width: 6px; }
            .journey-step, .journey-step:nth-child(odd), .journey-step:nth-child(even) { justify-content: stretch; padding-left: 72px; padding-right: 0; }
            .journey-orb { left: 31px; width: 50px; height: 50px; border-width: 5px; }
            .journey-node { width: 100%; border-radius: 20px; }
        }

    <script>
        function toArabicNum(n) { return String(n); }
        const dashboardState = { surahs: [], openedJuzIndex: null };
        const juzJourney = [
            { num: 30, name: 'جزء عمّ', start: 78, end: 114 },
            { num: 29, name: 'جزء تبارك', start: 67, end: 77 },
            { num: 28, name: 'جزء قد سمع', start: 58, end: 66 },
            { num: 27, name: 'جزء الذاريات', start: 51, end: 57 },
            { num: 26, name: 'جزء الأحقاف', start: 46, end: 50 },
            { num: 25, name: 'جزء إليه يرد', start: 42, end: 45 },
            { num: 24, name: 'جزء فمن أظلم', start: 40, end: 41 },
            { num: 23, name: 'جزء وما لي', start: 37, end: 39 },
            { num: 22, name: 'جزء ومن يقنت', start: 34, end: 36 },
            { num: 21, name: 'جزء اتل ما أوحي', start: 30, end: 33 },
            { num: 20, name: 'جزء أمن خلق', start: 28, end: 29 },
            { num: 19, name: 'جزء وقال الذين', start: 26, end: 27 },
            { num: 18, name: 'جزء قد أفلح', start: 23, end: 25 },
            { num: 17, name: 'جزء اقترب للناس', start: 21, end: 22 },
            { num: 16, name: 'جزء قال ألم', start: 19, end: 20 },
            { num: 15, name: 'جزء سبحان الذي', start: 17, end: 18 },
            { num: 14, name: 'جزء ربما', start: 15, end: 16 },
            { num: 13, name: 'جزء وما أبرئ', start: 13, end: 14 },
            { num: 12, name: 'جزء وما من دابة', start: 12, end: 12 },
            { num: 11, name: 'جزء يعتذرون', start: 11, end: 11 },
            { num: 10, name: 'جزء واعلموا', start: 10, end: 10 },
            { num: 9, name: 'جزء قال الملأ', start: 9, end: 9 },
            { num: 8, name: 'جزء ولو أننا', start: 8, end: 8 },
            { num: 7, name: 'جزء وإذا سمعوا', start: 7, end: 7 },
            { num: 6, name: 'جزء لا يحب الله', start: 6, end: 6 },
            { num: 5, name: 'جزء والمحصنات', start: 5, end: 5 },
            { num: 4, name: 'جزء لن تنالوا البر', start: 4, end: 4 },
            { num: 3, name: 'جزء تلك الرسل', start: 3, end: 3 },
            { num: 2, name: 'جزء سيقول', start: 2, end: 2 },
            { num: 1, name: 'جزء الفاتحة', start: 1, end: 1 }
        ];

        function getProgressFor(progressData, surah) {
            const canonicalId = (typeof Auth !== 'undefined' && Auth.normalizeSurahId) ? Auth.normalizeSurahId(surah.id) : surah.id;
            if (Array.isArray(progressData)) {
                return progressData.find(p => {
                    const progressId = (typeof Auth !== 'undefined' && Auth.normalizeSurahId) ? Auth.normalizeSurahId(p.surah_id) : p.surah_id;
                    return progressId === canonicalId || p.surah_id === surah.id || p.surah_id === surah.id.replace('_', '-');
                }) || {};
            }
            return progressData ? (progressData[canonicalId] || progressData[surah.id] || progressData[surah.id.replace('_', '-')] || {}) : {};
        }

        function getLengthType(ayat) {
            if (ayat <= 10) return 'short';
            if (ayat <= 50) return 'medium';
            return 'long';
        }

        function getSurahStars(surah) {
            if (!surah) return 0;
            if (surah.ayat <= 10) return 3;
            if (surah.ayat <= 50) return 5;
            return 8;
        }

        function getJourneyOrder() {
            return [...dashboardState.surahs].sort((a, b) => b.num - a.num);
        }

        function getJourneyState(surah) {
            const order = getJourneyOrder();
            const index = order.findIndex(item => item.num === surah.num);
            const firstOpenIndex = order.findIndex(item => !item.isCompleted);
            if (surah.isCompleted) return 'done';
            if ((firstOpenIndex === -1 || index === firstOpenIndex) && isSurahAllowedByJuzExam(surah)) return 'current';
            return 'locked';
        }

        function getJuzExamKey(juzNumber) {
            const student = dashboardState.studentKey || 'guest';
            return 'mawahib_juz_exam_' + student + '_' + juzNumber;
        }

        function getJuzExamResult(juzNumber) {
            try { return JSON.parse(localStorage.getItem(getJuzExamKey(juzNumber)) || 'null'); }
            catch (error) { return null; }
        }

        function isJuzExamPassed(juz) {
            const result = juz && getJuzExamResult(juz.num);
            return !!(result && result.passed === true && result.score === 100);
        }

        function getJuzSurahs(juz) {
            return getJourneyOrder().filter(surah => surah.num >= juz.start && surah.num <= juz.end);
        }

        function isJuzSurahWorkComplete(juz) {
            const surahs = getJuzSurahs(juz);
            return surahs.length > 0 && surahs.every(surah => surah.isCompleted);
        }

        function isSurahAllowedByJuzExam(surah) {
            const juzIndex = juzJourney.findIndex(juz => surah.num >= juz.start && surah.num <= juz.end);
            if (juzIndex <= 0) return true;
            return juzJourney.slice(0, juzIndex).every(juz => isJuzSurahWorkComplete(juz) && isJuzExamPassed(juz));
        }

        function getJourneyLabel(state, surah) {
            if (state === 'done') return surah.score ? `تمت • ${surah.score}%` : 'تمت';
            if (state === 'current') return 'ابدأ الآن';
            return 'مقفلة';
        }

        function renderSurahCard(surah) {
            const state = getJourneyState(surah);
            const currentSurah = getCurrentSurah();
            const lastCompletedSurah = getLastCompletedSurah();
            const focus = currentSurah && currentSurah.num === surah.num ? 'current' : (lastCompletedSurah && lastCompletedSurah.num === surah.num ? 'last-completed' : '');
            const focusAttr = focus ? `data-journey-focus="${focus}"` : '';
            const icon = state === 'done' ? '✓' : state === 'current' ? '▶' : '🔒';
            const disabled = state === 'locked' ? 'disabled aria-disabled="true"' : '';
            const action = state === 'locked' ? '' : `onclick="window.location.href='${surah.file}'"`;
            const orbTag = state === 'locked'
                ? `<div class="journey-orb ${state}" aria-hidden="true">${icon}</div>`
                : `<button type="button" ${action} class="journey-orb journey-orb-button ${state}" aria-label="فتح ${surah.nameAr}">${icon}</button>`;
            return `
                <div id="journey-surah-${surah.num}" class="journey-step" data-journey-state="${state}" ${focusAttr}>
                    ${orbTag}
                    <button type="button" ${action} ${disabled} class="journey-node ${state}">
                        <div class="min-w-0 flex-grow">
                            <div class="flex items-center justify-between gap-2 mb-1">
                                <h3 class="quran-font text-xl font-black truncate">${surah.nameAr}</h3>
                                <span class="journey-state">${getJourneyLabel(state, surah)}</span>
                            </div>
                            <p class="journey-meta">سورة ${toArabicNum(surah.num)} • ${toArabicNum(surah.ayat)} آيات • ${getSurahStars(surah)} نجوم • ${surah.nameFr || ''}</p>
                        </div>
                    </button>
                </div>
            `;
        }


        function getMiniExamKey(groupNumber) {
            const student = dashboardState.studentKey || 'guest';
            return 'mawahib_mini_exam_' + student + '_' + groupNumber;
        }

        function getMiniExamResult(groupNumber) {
            try { return JSON.parse(localStorage.getItem(getMiniExamKey(groupNumber)) || 'null'); }
            catch (error) { return null; }
        }

        function getMiniExamGroup(groupNumber) {
            const order = getJourneyOrder();
            return order.slice((groupNumber - 1) * 4, groupNumber * 4);
        }

        function getMiniExamState(groupNumber) {
            const group = getMiniExamGroup(groupNumber);
            if (group.length < 4) return 'hidden';
            const unlocked = group.every(surah => surah.isCompleted);
            const result = getMiniExamResult(groupNumber);
            if (result && result.score >= 70) return 'done';
            return unlocked ? 'current' : 'locked';
        }

        function renderMiniExamCard(groupNumber) {
            const group = getMiniExamGroup(groupNumber);
            const state = getMiniExamState(groupNumber);
            if (state === 'hidden') return '';
            const result = getMiniExamResult(groupNumber);
            const icon = state === 'done' ? '✓' : state === 'current' ? '★' : '🔒';
            const disabled = state === 'locked' ? 'disabled aria-disabled="true"' : '';
            const action = state === 'locked' ? '' : 'onclick="openMiniExam(' + groupNumber + ')"';
            const label = state === 'done' ? 'تم الاختبار • ' + result.score + '%' : state === 'current' ? 'اختبار مفتوح' : 'أكمل 4 سور';
            const names = group.map(s => s.nameAr).join('، ');
            return '<div class="journey-step mini-exam-step">' +
                '<div class="journey-orb mini-exam-orb ' + state + '" aria-hidden="true">' + icon + '</div>' +
                '<button type="button" ' + action + ' ' + disabled + ' class="journey-node mini-exam-node ' + state + '">' +
                    '<div class="min-w-0 flex-grow">' +
                        '<div class="flex items-center justify-between gap-2 mb-1">' +
                            '<h3 class="text-lg font-black">تمرين حفظ ' + groupNumber + '</h3>' +
                            '<span class="journey-state">' + label + '</span>' +
                        '</div>' +
                        '<p class="journey-meta">آيات من: ' + names + '</p>' +
                    '</div>' +
                '</button>' +
            '</div>';
        }

        function escapeMiniExamText(text) {
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function jsString(text) {
            return JSON.stringify(String(text)).replace(/</g, '\\u003c');
        }

        function cleanVerseText(text) {
            return String(text || '').replace(/\s+/g, ' ').trim();
        }

        function splitVerseWords(text) {
            return cleanVerseText(text).split(/\s+/).filter(word => word.length > 2);
        }

        function shortVerseText(text, limit = 110) {
            const clean = cleanVerseText(text);
            return clean.length > limit ? clean.slice(0, limit) + '…' : clean;
        }

        function shuffleItems(items) {
            return [...items].sort(() => Math.random() - 0.5);
        }

        function readLocalArray(html, variableName) {
            const assignment = new RegExp('(?:const|let|var)\\s+' + variableName + '\\s*=');
            const match = assignment.exec(html);
            if (!match) return null;
            const start = html.indexOf('[', match.index + match[0].length);
            if (start < 0) return null;
            let depth = 0;
            let quote = '';
            let escaped = false;
            for (let index = start; index < html.length; index++) {
                const char = html[index];
                if (quote) {
                    if (escaped) escaped = false;
                    else if (char === '\\') escaped = true;
                    else if (char === quote) quote = '';
                    continue;
                }
                if (char === '"' || char === "'" || char === '`') { quote = char; continue; }
                if (char === '[') depth++;
                if (char === ']' && --depth === 0) {
                    const literal = html.slice(start, index + 1);
                    try { return Function('"use strict"; return (' + literal + ');')(); }
                    catch (error) { return null; }
                }
            }
            return null;
        }

        async function loadSurahVerses(surah) {
            if (!surah || !surah.file) return { surah, verses: [] };
            try {
                const html = await fetch(surah.file, { cache: 'no-store' }).then(response => response.text());
                const directVerses = readLocalArray(html, 'verses');
                const sections = readLocalArray(html, 'surahData');
                const verses = Array.isArray(directVerses)
                    ? directVerses
                    : (Array.isArray(sections) ? sections.flatMap(section => Array.isArray(section.verses) ? section.verses : []) : []);
                return {
                    surah,
                    verses: verses
                        .filter(verse => verse && verse.text)
                        .map(verse => ({
                            key: surah.id + ':' + verse.num,
                            surah,
                            num: Number(verse.num),
                            text: cleanVerseText(verse.text)
                        }))
                };
            } catch (error) {
                return { surah, verses: [] };
            }
        }

        async function loadVerseBank(group) {
            const loaded = await Promise.all(group.map(loadSurahVerses));
            const entries = loaded.flatMap(item => item.verses);
            if (entries.length > 0) return entries;
            return group.flatMap(surah => [
                { key: surah.id + ':1', surah, num: 1, text: surah.nameAr + ' - الآية 1' },
                { key: surah.id + ':2', surah, num: 2, text: surah.nameAr + ' - الآية 2' },
                { key: surah.id + ':3', surah, num: 3, text: surah.nameAr + ' - الآية 3' }
            ]);
        }

        function optionTexts(correct, pool, mapper, count = 4) {
            const correctText = mapper(correct);
            const distractors = shuffleItems(pool)
                .map(mapper)
                .filter(text => text && text !== correctText);
            return shuffleItems([correctText, ...Array.from(new Set(distractors)).slice(0, count - 1)]);
        }

        function findNextVerse(entry, bank) {
            return bank.find(item => item.surah.id === entry.surah.id && item.num === entry.num + 1) || null;
        }

        function buildMissingWordQuestion(entry, bank) {
            const words = splitVerseWords(entry.text);
            const answer = words[Math.min(words.length - 1, Math.max(0, Math.floor(words.length / 2)))] || words[0] || entry.surah.nameAr;
            const prompt = shortVerseText(entry.text.replace(answer, '______'), 140);
            const poolWords = bank.flatMap(item => splitVerseWords(item.text)).filter(word => word !== answer);
            return {
                kind: 'missing-word',
                prompt: 'أكمل الكلمة الناقصة في الآية:',
                source: prompt,
                answer,
                options: shuffleItems([answer, ...Array.from(new Set(shuffleItems(poolWords))).slice(0, 3)])
            };
        }

        function buildNextVerseQuestion(entry, bank) {
            const next = findNextVerse(entry, bank);
            if (!next) return buildMissingWordQuestion(entry, bank);
            return {
                kind: 'next-verse',
                prompt: 'ما الآية التي تأتي بعدها مباشرة؟',
                source: shortVerseText(entry.text, 150),
                answer: shortVerseText(next.text, 150),
                options: optionTexts(next, bank.filter(item => item.key !== next.key), item => shortVerseText(item.text, 150))
            };
        }

        function buildSurahMatchQuestion(entry, group) {
            const surahPool = group.length > 1 ? group : SURAH_REGISTRY;
            return {
                kind: 'surah-match',
                prompt: 'إلى أي سورة تنتمي هذه الآية؟',
                source: shortVerseText(entry.text, 150),
                answer: entry.surah.nameAr,
                options: shuffleItems([entry.surah.nameAr, ...shuffleItems(surahPool.filter(surah => surah.id !== entry.surah.id)).slice(0, 3).map(surah => surah.nameAr)])
            };
        }

        function buildEndingQuestion(entry, bank) {
            const words = splitVerseWords(entry.text);
            if (words.length < 5) return buildMissingWordQuestion(entry, bank);
            const splitAt = Math.max(2, Math.floor(words.length / 2));
            const start = words.slice(0, splitAt).join(' ');
            const answer = words.slice(splitAt).join(' ');
            const endings = bank
                .map(item => {
                    const itemWords = splitVerseWords(item.text);
                    return shortVerseText(itemWords.slice(Math.floor(itemWords.length / 2)).join(' '), 90);
                })
                .filter(text => text && text !== answer);
            return {
                kind: 'ending',
                prompt: 'أكمل نهاية الآية:',
                source: shortVerseText(start + ' ...', 130),
                answer,
                options: shuffleItems([answer, ...Array.from(new Set(shuffleItems(endings))).slice(0, 3)])
            };
        }

        async function buildMiniExamQuestions(group) {
            const bank = await loadVerseBank(group);
            const withNext = bank.filter(entry => findNextVerse(entry, bank));
            const samples = shuffleItems(bank).slice(0, 6);
            return [
                buildNextVerseQuestion(withNext[0] || samples[0], bank),
                buildMissingWordQuestion(samples[1] || samples[0], bank),
                buildSurahMatchQuestion(samples[2] || samples[0], group),
                buildEndingQuestion(samples[3] || samples[0], bank),
                buildNextVerseQuestion(withNext[1] || samples[4] || samples[0], bank),
                buildMissingWordQuestion(samples[5] || samples[0], bank)
            ].filter(Boolean);
        }

        function ensureMiniExamModal() {
            let modal = document.getElementById('mini-exam-modal');
            if (modal) return modal;
            modal = document.createElement('div');
            modal.id = 'mini-exam-modal';
            modal.className = 'mini-exam-modal';
            modal.innerHTML = '<div class="mini-exam-card" dir="rtl"><div class="flex items-start justify-between gap-3 mb-4"><div><p class="text-xs font-black text-orange-600">مراجعة قصيرة</p><h3 id="mini-exam-title" class="text-xl font-black text-gray-900"></h3></div><button type="button" onclick="closeMiniExam()" class="w-9 h-9 rounded-full bg-gray-100 text-gray-600 font-black">×</button></div><div id="mini-exam-body"></div></div>';
            document.body.appendChild(modal);
            modal.addEventListener('click', event => { if (event.target === modal) closeMiniExam(); });
            return modal;
        }
        let activeMiniExam = null;

        async function openMiniExam(groupNumber) {
            const group = getMiniExamGroup(groupNumber);
            if (group.length < 4 || !group.every(surah => surah.isCompleted)) return;
            ensureMiniExamModal().classList.add('open');
            document.getElementById('mini-exam-title').textContent = 'اختبار حفظ ' + groupNumber;
            document.getElementById('mini-exam-body').innerHTML = '<div class="py-8 text-center font-black text-gray-500">جاري تجهيز تمارين الآيات...</div>';
            activeMiniExam = { groupNumber, questions: await buildMiniExamQuestions(group), index: 0, correct: 0 };
            ensureMiniExamModal().classList.add('open');
            renderMiniExamQuestion();
        }

        function closeMiniExam() {
            const modal = document.getElementById('mini-exam-modal');
            if (modal) modal.classList.remove('open');
        }

        function renderMiniExamQuestion() {
            const body = document.getElementById('mini-exam-body');
            if (!activeMiniExam || !body) return;
            const q = activeMiniExam.questions[activeMiniExam.index];
            document.getElementById('mini-exam-title').textContent = 'اختبار حفظ ' + activeMiniExam.groupNumber;
            body.innerHTML = '<div class="mb-3 text-sm font-black text-gray-500">سؤال ' + (activeMiniExam.index + 1) + ' / ' + activeMiniExam.questions.length + '</div>' +
                '<div class="rounded-2xl bg-orange-50 border border-orange-100 p-4 font-black text-gray-900 mb-3">' + escapeMiniExamText(q.prompt) + '</div>' +
                '<div class="quran-font rounded-2xl bg-white border border-gray-100 p-4 text-lg leading-loose text-gray-800 mb-4">' + escapeMiniExamText(q.source || '') + '</div>' +
                '<div class="space-y-2">' + q.options.map(option => '<button type="button" class="mini-exam-option" data-answer="' + escapeMiniExamText(option) + '">' + escapeMiniExamText(option) + '</button>').join('') + '</div>';
            body.querySelectorAll('.mini-exam-option').forEach(button => {
                button.addEventListener('click', () => answerMiniExam(button, button.dataset.answer));
            });
        }

        function answerMiniExam(button, answer) {
            if (!activeMiniExam) return;
            const q = activeMiniExam.questions[activeMiniExam.index];
            const options = Array.from(document.querySelectorAll('.mini-exam-option'));
            options.forEach(option => {
                option.disabled = true;
                if (option.textContent === q.answer) option.classList.add('correct');
            });
            if (answer === q.answer) {
                activeMiniExam.correct++;
                button.classList.add('correct');
            } else {
                button.classList.add('wrong');
            }
            setTimeout(() => {
                activeMiniExam.index++;
                if (activeMiniExam.index >= activeMiniExam.questions.length) finishMiniExam();
                else renderMiniExamQuestion();
            }, 700);
        }

        function finishMiniExam() {
            const score = Math.round((activeMiniExam.correct / activeMiniExam.questions.length) * 100);
            const passed = score >= 70;
            localStorage.setItem(getMiniExamKey(activeMiniExam.groupNumber), JSON.stringify({ score, passed, date: new Date().toISOString() }));
            const body = document.getElementById('mini-exam-body');
            body.innerHTML = '<div class="text-center py-5"><div class="mx-auto mb-4 w-20 h-20 rounded-full grid place-items-center text-2xl font-black ' + (passed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700') + '">' + score + '%</div><h4 class="text-xl font-black text-gray-900 mb-2">' + (passed ? 'ممتاز، الاختبار مكتمل' : 'محاولة جيدة، أعد الاختبار') + '</h4><p class="text-sm font-bold text-gray-500 mb-4">نتيجتك: ' + activeMiniExam.correct + ' / ' + activeMiniExam.questions.length + '</p><button type="button" onclick="closeMiniExam(); renderSurahLibrary();" class="px-5 py-2 rounded-full bg-emerald-600 text-white font-black">العودة للمسار</button></div>';
        }

        function getJuzExamState(juz) {
            if (isJuzExamPassed(juz)) return 'done';
            return isJuzSurahWorkComplete(juz) ? 'current' : 'locked';
        }

        function renderJuzExamCard(juz) {
            const state = getJuzExamState(juz);
            const icon = state === 'done' ? '✓' : state === 'current' ? '★' : '🔒';
            const action = state === 'current' || state === 'done' ? 'onclick="openJuzExam(' + juz.num + ')"' : '';
            const disabled = state === 'locked' ? 'disabled aria-disabled="true"' : '';
            const label = state === 'done' ? 'تم الامتحان • 100%' : state === 'current' ? 'الامتحان مفتوح' : 'أكمل سور الجزء';
            return '<div class="journey-step mini-exam-step juz-final-exam">' +
                '<div class="journey-orb mini-exam-orb ' + state + '" aria-hidden="true">' + icon + '</div>' +
                '<button type="button" ' + action + ' ' + disabled + ' class="journey-node mini-exam-node ' + state + '">' +
                    '<div class="min-w-0 flex-grow"><div class="flex items-center justify-between gap-2 mb-1">' +
                        '<h3 class="text-lg font-black">امتحان الجزء الكامل</h3><span class="journey-state">' + label + '</span>' +
                    '</div><p class="journey-meta">5 تمارين كحد أقصى • يشمل جميع سور الجزء • خطأ واحد مسموح في كل تمرين</p></div>' +
                '</button></div>';
        }

        let activeJuzExam = null;

        async function buildJuzExamExercises(juz) {
            const group = getJuzSurahs(juz);
            const banks = await Promise.all(group.map(async surah => ({ surah, bank: await loadVerseBank([surah]) })));
            const exerciseCount = Math.min(5, Math.max(1, group.length));
            const exercises = Array.from({ length: exerciseCount }, () => []);
            banks.forEach((item, index) => {
                const bank = item.bank;
                const entry = bank[Math.floor(bank.length / 2)] || bank[0];
                if (!entry) return;
                const type = index % 4;
                const question = type === 0 ? buildSurahMatchQuestion(entry, group)
                    : type === 1 ? buildMissingWordQuestion(entry, bank)
                    : type === 2 ? buildNextVerseQuestion(entry, bank)
                    : buildEndingQuestion(entry, bank);
                exercises[index % exerciseCount].push(question);
            });
            return exercises.filter(exercise => exercise.length > 0);
        }

        async function openJuzExam(juzNumber) {
            const juz = juzJourney.find(item => item.num === juzNumber);
            if (!juz || !isJuzSurahWorkComplete(juz)) return;
            ensureMiniExamModal().classList.add('open');
            document.getElementById('mini-exam-title').textContent = 'امتحان ' + juz.name;
            document.getElementById('mini-exam-body').innerHTML = '<div class="py-8 text-center font-black text-gray-500">جاري تجهيز امتحان الجزء...</div>';
            const exercises = await buildJuzExamExercises(juz);
            activeJuzExam = { juz, exercises, exerciseIndex: 0, questionIndex: 0, exerciseErrors: 0 };
            renderJuzExamQuestion();
        }

        function renderJuzExamQuestion(message) {
            const body = document.getElementById('mini-exam-body');
            if (!activeJuzExam || !body) return;
            activeJuzExam.answerLocked = false;
            const exercise = activeJuzExam.exercises[activeJuzExam.exerciseIndex];
            const q = exercise[activeJuzExam.questionIndex];
            document.getElementById('mini-exam-title').textContent = 'امتحان ' + activeJuzExam.juz.name;
            body.innerHTML = '<div class="mb-2 text-sm font-black text-orange-600">التمرين ' + (activeJuzExam.exerciseIndex + 1) + ' / ' + activeJuzExam.exercises.length + '</div>' +
                '<div class="mb-3 text-xs font-bold text-gray-500">السورة ' + (activeJuzExam.questionIndex + 1) + ' / ' + exercise.length + ' • الخطأ المسموح: 1</div>' +
                (message ? '<div class="mb-3 rounded-xl bg-amber-50 p-3 text-center text-sm font-black text-amber-700">' + message + '</div>' : '') +
                '<div class="rounded-2xl bg-orange-50 border border-orange-100 p-4 font-black text-gray-900 mb-3">' + escapeMiniExamText(q.prompt) + '</div>' +
                '<div class="quran-font rounded-2xl bg-white border border-gray-100 p-4 text-lg leading-loose text-gray-800 mb-4">' + escapeMiniExamText(q.source || '') + '</div>' +
                '<div class="space-y-2">' + q.options.map(option => '<button type="button" class="mini-exam-option" data-answer="' + escapeMiniExamText(option) + '">' + escapeMiniExamText(option) + '</button>').join('') + '</div>';
            body.querySelectorAll('.mini-exam-option').forEach(button => button.addEventListener('click', () => answerJuzExam(button, button.dataset.answer)));
        }

        function answerJuzExam(button, answer) {
            if (!activeJuzExam || activeJuzExam.answerLocked) return;
            activeJuzExam.answerLocked = true;
            const exercise = activeJuzExam.exercises[activeJuzExam.exerciseIndex];
            const q = exercise[activeJuzExam.questionIndex];
            if (answer !== q.answer) {
                activeJuzExam.exerciseErrors++;
                button.classList.add('wrong');
                if (activeJuzExam.exerciseErrors > 1) {
                    activeJuzExam.questionIndex = 0;
                    activeJuzExam.exerciseErrors = 0;
                    setTimeout(() => renderJuzExamQuestion('خطآن: أعد هذا التمرين من بدايته.'), 650);
                } else {
                    setTimeout(() => renderJuzExamQuestion('صحح الإجابة قبل المتابعة.'), 650);
                }
                return;
            }
            button.classList.add('correct');
            setTimeout(() => {
                activeJuzExam.questionIndex++;
                if (activeJuzExam.questionIndex < exercise.length) return renderJuzExamQuestion();
                activeJuzExam.exerciseIndex++;
                activeJuzExam.questionIndex = 0;
                activeJuzExam.exerciseErrors = 0;
                if (activeJuzExam.exerciseIndex < activeJuzExam.exercises.length) renderJuzExamQuestion();
                else finishJuzExam();
            }, 550);
        }

        function finishJuzExam() {
            localStorage.setItem(getJuzExamKey(activeJuzExam.juz.num), JSON.stringify({
                passed: true, score: 100, date: new Date().toISOString(),
                exerciseCount: activeJuzExam.exercises.length,
                surahCount: getJuzSurahs(activeJuzExam.juz).length
            }));
            document.getElementById('mini-exam-body').innerHTML = '<div class="text-center py-5"><div class="mx-auto mb-4 w-20 h-20 rounded-full grid place-items-center text-2xl font-black bg-emerald-100 text-emerald-700">100%</div><h4 class="text-xl font-black text-gray-900 mb-2">تم إتقان الجزء</h4><p class="text-sm font-bold text-gray-500 mb-4">تم فتح الجزء التالي.</p><button type="button" onclick="closeMiniExam(); renderSurahLibrary();" class="px-5 py-2 rounded-full bg-emerald-600 text-white font-black">العودة للمسار</button></div>';
        }

        function getCurrentSurah() {
            const order = getJourneyOrder();
            return order.find(surah => !surah.isCompleted && isSurahAllowedByJuzExam(surah)) || null;
        }

        function getLastCompletedSurah() {
            const order = getJourneyOrder();
            const currentIndex = order.findIndex(surah => !surah.isCompleted);
            if (currentIndex > 0) return order[currentIndex - 1];
            if (currentIndex === -1) return order[order.length - 1] || null;
            return null;
        }

        function scrollToJourneyFocus(event) {
            if (event) event.preventDefault();
            const currentEl = document.querySelector('[data-journey-focus="current"]');
            const lastEl = document.querySelector('[data-journey-focus="last-completed"]');
            const target = currentEl || lastEl || document.getElementById('section-available');
            if (!target) return;
            if (currentEl && lastEl) {
                const lastRect = lastEl.getBoundingClientRect();
                const currentRect = currentEl.getBoundingClientRect();
                const lastCenter = window.scrollY + lastRect.top + lastRect.height / 2;
                const currentCenter = window.scrollY + currentRect.top + currentRect.height / 2;
                const focusCenter = (lastCenter + currentCenter) / 2;
                window.scrollTo({ top: Math.max(0, focusCenter - window.innerHeight * 0.42), behavior: 'smooth' });
                return;
            }
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function isCurrentJuz(juz) {
            const current = getCurrentSurah();
            return !!current && current.num >= juz.start && current.num <= juz.end;
        }

        function getActiveJuzIndex() {
            const index = juzJourney.findIndex(juz => !isJuzSurahWorkComplete(juz) || !isJuzExamPassed(juz));
            return index >= 0 ? index : Math.max(0, juzJourney.length - 1);
        }

        function toggleCompletedJuz(index) {
            dashboardState.openedJuzIndex = dashboardState.openedJuzIndex === index ? null : index;
            renderSurahLibrary();
        }

        function renderSurahLibrary() {
            const container = document.getElementById('available-grid');
            const filtered = getJourneyOrder();
            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-2xl border border-gray-100 p-8 text-center text-gray-500 font-bold">لا توجد سورة مطابقة لهذا البحث.</div>`;
                return;
            }
            const activeJuzIndex = getActiveJuzIndex();
            const completedPicker = activeJuzIndex > 0
                ? '<div class="completed-juz-picker">' + juzJourney.slice(0, activeJuzIndex).map((juz, index) => '<button type="button" class="completed-juz-button" onclick="toggleCompletedJuz(' + index + ')">' + juz.name + '</button>').join('') + '</div>'
                : '';
            container.innerHTML = completedPicker + juzJourney.map((juz, index) => {
                const isActiveSection = index === activeJuzIndex;
                const isNextSection = index === activeJuzIndex + 1;
                const isOpenedCompleted = index === dashboardState.openedJuzIndex && index < activeJuzIndex;
                if (!isActiveSection && !isNextSection && !isOpenedCompleted) return '';
                const items = filtered.filter(s => s.num >= juz.start && s.num <= juz.end);
                if (items.length === 0) return '';
                const allJuzSurahs = dashboardState.surahs.filter(s => s.num >= juz.start && s.num <= juz.end).sort((a, b) => b.num - a.num);
                const fromSurah = allJuzSurahs[0];
                const toSurah = allJuzSurahs[allJuzSurahs.length - 1];
                const completedInJuz = allJuzSurahs.filter(s => s.isCompleted).length;
                const rangeLabel = fromSurah && toSurah ? `من سورة ${fromSurah.nameAr} إلى سورة ${toSurah.nameAr}` : '';
                const sectionState = isActiveSection ? 'is-active' : (isOpenedCompleted ? 'is-complete' : 'is-muted');
                const visibleItems = (isActiveSection || isOpenedCompleted) ? items : items.slice(0, 2);
                const mutedMessage = isNextSection
                    ? '<div class="mx-4 mb-4 rounded-2xl border border-dashed border-gray-300 bg-gray-50 px-4 py-3 text-center text-xs font-black text-gray-500">أكمل هذا الجزء أولاً، ثم يظهر هذا الجزء كاملاً.</div>'
                    : '';
                return `
                    <section class="juz-section ${sectionState} bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                        <div class="juz-road-header px-4 py-4 flex items-center justify-between gap-3">
                            <div>
                                <h3 class="font-black text-gray-900 text-lg">${juz.name}</h3>
                                <p class="text-xs text-gray-500 font-bold quran-font">${rangeLabel}</p>
                            </div>
                            <span class="bg-white border border-gray-200 rounded-full px-3 py-1 text-xs font-black text-emerald-700">${toArabicNum(completedInJuz)} / ${toArabicNum(allJuzSurahs.length)}</span>
                        </div>
                        <div class="surah-journey">
                            ${visibleItems.map(surah => {
                                const globalIndex = filtered.findIndex(item => item.id === surah.id);
                                const groupNumber = Math.floor((globalIndex + 1) / 4);
                                const miniExam = sectionState !== 'is-muted' && ((globalIndex + 1) % 4 === 0) ? renderMiniExamCard(groupNumber) : '';
                                return renderSurahCard(surah) + miniExam;
                            }).join('')}
                            ${sectionState !== 'is-muted' ? renderJuzExamCard(juz) : ''}
                        </div>
                        ${mutedMessage}
                    </section>
                `;
            }).join('');
        }
        // Ajoute ceci dans la fonction d'initialisation de ta page (ex: window.onload)
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
        }

        function escapeJsArg(value) {
            return escapeHtml(String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        }

async function chargerDevoirs() {
            const session = Auth.getSession();
            if (!session) return;
            const devoirs = await Auth.getDevoirs('student', session.username);
            const devoirsEnAttente = devoirs.filter(d => d.statut === 'en_attente');
            const zoneDevoirs = document.getElementById('zone-devoirs');
            if (!zoneDevoirs) return;
            if (devoirsEnAttente.length > 0) {
                zoneDevoirs.innerHTML = devoirsEnAttente.map(function(devoir) {
                    return '<div class="mb-2 rounded-xl bg-rose-50 border border-rose-100 p-2">' +
                        '<div class="font-black text-rose-700">سورة ' + escapeHtml(devoir.surate) + '</div>' +
                        '<div class="text-[11px] text-gray-600">من الآية ' + escapeHtml(devoir.aya_debut) + ' إلى ' + escapeHtml(devoir.aya_fin) + '</div>' +
                        '<button onclick="validerDevoir(\'' + escapeJsArg(devoir.id) + '\')" class="mt-2 rounded-full bg-rose-600 text-white px-3 py-1 text-[11px] font-black">حفظت الواجب</button>' +
                    '</div>';
                }).join('');
            } else {
                zoneDevoirs.innerHTML = '<span class="text-gray-500">لا يوجد واجب حاليًا.</span>';
            }
        }

        async function buildStudentDashboard() {
            const session = Auth.getSession();
            if (!session) return;
            dashboardState.studentKey = session.username || session.prenom || 'guest';
            
            // 1. Affichage des messages administratifs
            const userMessages = await Auth.getMessages(session.username);
            const msgContainer = document.getElementById('messages-container');
            if (msgContainer) {
                if (userMessages.length > 0) {
                    msgContainer.innerHTML = userMessages.map(function(m) {
                        return '<div class="mb-2 rounded-xl bg-blue-50 border border-blue-100 p-2">' +
                            '<div class="font-black text-blue-800 text-xs">رسالة من الإدارة</div>' +
                            '<p class="text-blue-900 mt-1">' + escapeHtml(m.text) + '</p>' +
                            '<button onclick="Auth.clearMessages(\'' + escapeJsArg(session.username) + '\'); window.location.reload();" class="mt-2 rounded-full bg-white text-blue-600 px-3 py-1 text-[11px] font-black shadow-sm">إخفاء</button>' +
                        '</div>';
                    }).join('');
                } else {
                    msgContainer.innerHTML = '<span class="text-gray-500">لا توجد رسائل جديدة.</span>';
                }
            }

            // 2. Affichage des infos de l'élève
            document.getElementById('student-schedule').innerText = await Auth.getSchedule(session.username);
            document.getElementById('student-name').innerText = session.prenom;
            
            // 3. Récupération de la progression
            const progressData = await Auth.getProgress(session.username);
            
            dashboardState.surahs = SURAH_REGISTRY
                .filter(surah => surah.available)
                .map(surah => {
                    const pData = getProgressFor(progressData, surah);
                    const isCompleted = pData.is_completed === true || !!pData.completed_at || !!pData.completedAt || pData.status === 'completed';
                    const score = pData.score || pData.global_score || pData.globalScore || 0;
                    return {
                        ...surah,
                        isCompleted,
                        score,
                        lengthType: getLengthType(surah.ayat)
                    };
                });
            const availableCount = dashboardState.surahs.length;
            const completedCount = dashboardState.surahs.filter(surah => surah.isCompleted).length;
            const progressLabel = document.getElementById('student-progress-label');
            const progressFill = document.getElementById('student-progress-fill');
            if (progressLabel) progressLabel.innerText = `${toArabicNum(completedCount)} / ${toArabicNum(availableCount)}`;
            if (progressFill) {
                const progressPercent = availableCount === 0 ? 0 : Math.round((completedCount / availableCount) * 100);
                progressFill.style.width = `${progressPercent}%`;
            }
            if (typeof Auth.syncRewardsFromSurahs === 'function') Auth.syncRewardsFromSurahs(dashboardState.surahs);
            updateRewardPanel();
            renderSurahLibrary();
            if (typeof Auth.prepareOfflineLessons === 'function') Auth.prepareOfflineLessons(dashboardState.surahs);
            if (window.location.hash === '#surah-focus') setTimeout(scrollToJourneyFocus, 180);
        }

        async function updateRewardPanel() {
            if (typeof Auth === 'undefined' || typeof Auth.getRewardState !== 'function') return;
            const rewards = Auth.getRewardState();
            if (!rewards) return;
            const starsEl = document.getElementById('reward-stars');
            const noteEl = document.getElementById('reward-decay-note');
            if (starsEl) starsEl.textContent = rewards.stars || 0;
            if (noteEl && rewards.lostNow > 0) noteEl.textContent = 'نقصت ' + rewards.lostNow + ' نجوم فقط بسبب فترة توقف.';
            const rankValueEl = document.getElementById('class-rank-value');
            const rankNoteEl = document.getElementById('class-rank-note');
            if (!rankValueEl || typeof Auth.getClassStarRanking !== 'function') return;
            rankValueEl.textContent = '...';
            try {
                const ranking = await Auth.getClassStarRanking();
                if (!ranking) {
                    rankValueEl.textContent = '-';
                    if (rankNoteEl) rankNoteEl.textContent = 'الترتيب غير متاح الآن.';
                    return;
                }
                if (!ranking.isAssigned || !ranking.total) {
                    rankValueEl.textContent = '-';
                    if (rankNoteEl) rankNoteEl.textContent = 'سيظهر بعد ربطك بقسم.';
                    return;
                }
                rankValueEl.textContent = ranking.rank + ' / ' + ranking.total;
                if (rankNoteEl) rankNoteEl.textContent = '';
            } catch (error) {
                rankValueEl.textContent = '-';
                if (rankNoteEl) rankNoteEl.textContent = 'الترتيب غير متاح الآن.';
            }
        }

        chargerDevoirs();
        buildStudentDashboard();
    </script>
