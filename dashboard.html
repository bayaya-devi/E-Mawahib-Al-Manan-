        function getProgressFor(progressData, surah) {
            const canonicalId = (typeof Auth !== 'undefined' && Auth.normalizeSurahId) ? Auth.normalizeSurahId(surah.id) : surah.id;
            if (Array.isArray(progressData)) {
                return progressData.find(p => {
                    const progressId = (typeof Auth !== 'undefined' && Auth.normalizeSurahId) ? Auth.normalizeSurahId(p.surah_id) : p.surah_id;
                    return progressId === canonicalId || p.surah_id === surah.id || p.surah_id === surah.id.replace('_', '-');
                }) || {};
            }
            return progressData ? (progressData[canonicalId] || progressData[surah.id] || progressData[surah.id.replace('_', '-')] || {}) : {};
        }

        function getLengthType(ayat) {
            if (ayat <= 10) return 'short';
            if (ayat <= 50) return 'medium';
            return 'long';
        }

        function getSurahStars(surah) {
            if (!surah) return 0;
            if (surah.ayat <= 10) return 3;
            if (surah.ayat <= 50) return 5;
            return 8;
        }

        function getJourneyOrder() {
            return [...dashboardState.surahs].sort((a, b) => b.num - a.num);
        }

        function getJourneyState(surah) {
            const order = getJourneyOrder();
            const index = order.findIndex(item => item.num === surah.num);
            const firstOpenIndex = order.findIndex(item => !item.isCompleted);
            if (surah.isCompleted) return 'done';
            if (firstOpenIndex === -1 || index === firstOpenIndex) return 'current';
            return 'locked';
        }

        function getJourneyLabel(state, surah) {
            if (state === 'done') return surah.score ? `تمت • ${surah.score}%` : 'تمت';
            if (state === 'current') return 'ابدأ الآن';
            return 'مقفلة';
        }

        function renderSurahCard(surah) {
            const state = getJourneyState(surah);
            const currentSurah = getCurrentSurah();
            const lastCompletedSurah = getLastCompletedSurah();
            const focus = currentSurah && currentSurah.num === surah.num ? 'current' : (lastCompletedSurah && lastCompletedSurah.num === surah.num ? 'last-completed' : '');
            const focusAttr = focus ? `data-journey-focus="${focus}"` : '';
            const icon = state === 'done' ? '✓' : state === 'current' ? '▶' : '🔒';
            const disabled = state === 'locked' ? 'disabled aria-disabled="true"' : '';
            const action = state === 'locked' ? '' : `onclick="window.location.href='${surah.file}'"`;
            const orbTag = state === 'locked'
                ? `<div class="journey-orb ${state}" aria-hidden="true">${icon}</div>`
                : `<button type="button" ${action} class="journey-orb journey-orb-button ${state}" aria-label="فتح ${surah.nameAr}">${icon}</button>`;
            return `
                <div id="journey-surah-${surah.num}" class="journey-step" data-journey-state="${state}" ${focusAttr}>
                    ${orbTag}
                    <button type="button" ${action} ${disabled} class="journey-node ${state}">
                        <div class="min-w-0 flex-grow">
                            <div class="flex items-center justify-between gap-2 mb-1">
                                <h3 class="quran-font text-xl font-black truncate">${surah.nameAr}</h3>
                                <span class="journey-state">${getJourneyLabel(state, surah)}</span>
                            </div>
                            <p class="journey-meta">سورة ${toArabicNum(surah.num)} • ${toArabicNum(surah.ayat)} آيات • ${getSurahStars(surah)} نجوم • ${surah.nameFr || ''}</p>
                        </div>
                    </button>
                </div>
            `;
        }


        function getMiniExamKey(groupNumber) {
            const student = dashboardState.studentKey || 'guest';
            return 'mawahib_mini_exam_' + student + '_' + groupNumber;
        }

        const miniGameTypes = [
            { type: 'race', icon: '🏎️', title: 'سباق الآيات', hint: 'تتقدم السيارة مع كل إجابة صحيحة.' },
            { type: 'treasure', icon: '💎', title: 'كنز السورة', hint: 'افتح الكنز باسم السورة الصحيح.' },
            { type: 'lantern', icon: '🪔', title: 'مصابيح الترتيب', hint: 'أضئ المصباح باختيار السورة المناسبة.' },
            { type: 'bridge', icon: '🌉', title: 'جسر الحفظ', hint: 'اعبر الجسر بإجابة دقيقة.' },
            { type: 'meteor', icon: '☄️', title: 'شهب المراجعة', hint: 'التقط المعلومة قبل أن تفلت.' },
            { type: 'garden', icon: '🌿', title: 'حديقة السور', hint: 'ازرع خطوة جديدة في المسار.' },
            { type: 'tower', icon: '🧱', title: 'برج الآيات', hint: 'ابن البرج بسؤال صحيح.' },
            { type: 'compass', icon: '🧭', title: 'بوصلة الجزء', hint: 'اختر الاتجاه الصحيح في الجزء.' },
            { type: 'balloon', icon: '🎈', title: 'بالون النجوم', hint: 'ارفع البالون بإجابة موفقة.' },
            { type: 'shield', icon: '🛡️', title: 'درع المراجعة', hint: 'احم حفظك بمراجعة سريعة.' }
        ];

        const miniGameThemes = ['التركيز', 'السرعة', 'الهدوء', 'التثبيت', 'التحدي'];
        const miniGameCatalog = Array.from({ length: 50 }, (_, index) => {
            const base = miniGameTypes[index % miniGameTypes.length];
            return { ...base, id: index + 1, title: base.title + ' ' + miniGameThemes[Math.floor(index / miniGameTypes.length)] };
        });

        function getMiniGameConfig(gameNumber) {
            return miniGameCatalog[(gameNumber - 1) % miniGameCatalog.length];
        }

        function getMiniGameKey(gameNumber) {
            const student = dashboardState.studentKey || 'guest';
            return 'mawahib_mini_game_' + student + '_' + gameNumber;
        }

        function getMiniGameResult(gameNumber) {
            try { return JSON.parse(localStorage.getItem(getMiniGameKey(gameNumber)) || 'null'); }
            catch (error) { return null; }
        }

        function getMiniGameGroup(gameNumber) {
            const order = getJourneyOrder();
            const start = Math.max(0, gameNumber * 3 - 3);
            return order.slice(start, start + 3);
        }

        function getMiniGameState(gameNumber) {
            const group = getMiniGameGroup(gameNumber);
            if (group.length < 2) return 'hidden';
            const result = getMiniGameResult(gameNumber);
            if (result && result.score >= 70) return 'done';
            return group.some(surah => surah.isCompleted) ? 'current' : 'locked';
        }

        function renderMiniGameCard(gameNumber) {
            const group = getMiniGameGroup(gameNumber);
            const state = getMiniGameState(gameNumber);
            if (state === 'hidden') return '';
            const config = getMiniGameConfig(gameNumber);
            const result = getMiniGameResult(gameNumber);
            const disabled = state === 'locked' ? 'disabled aria-disabled="true"' : '';
            const action = state === 'locked' ? '' : 'onclick="openMiniGame(' + gameNumber + ')"';
            const label = state === 'done' ? 'تم اللعب • ' + result.score + '%' : state === 'current' ? 'لعبة مفتوحة' : 'افتح سورة من هذه المرحلة';
            const names = group.map(s => s.nameAr).join('، ');
            return '<div class="journey-step mini-game-step">' +
                '<div class="journey-orb mini-game-orb ' + state + '" aria-hidden="true">' + config.icon + '</div>' +
                '<button type="button" ' + action + ' ' + disabled + ' class="journey-node mini-game-node ' + state + '">' +
                    '<div class="min-w-0 flex-grow">' +
                        '<div class="flex items-center justify-between gap-2 mb-1">' +
                            '<h3 class="text-lg font-black">' + config.title + '</h3>' +
                            '<span class="journey-state">' + label + '</span>' +
                        '</div>' +
                        '<p class="journey-meta">' + config.hint + ' • ' + names + '</p>' +
                    '</div>' +
                '</button>' +
            '</div>';
        }

        function getMiniExamResult(groupNumber) {
            try { return JSON.parse(localStorage.getItem(getMiniExamKey(groupNumber)) || 'null'); }
            catch (error) { return null; }
        }

        function getMiniExamGroup(groupNumber) {
            const order = getJourneyOrder();
            return order.slice((groupNumber - 1) * 4, groupNumber * 4);
        }

        function getMiniExamState(groupNumber) {
            const group = getMiniExamGroup(groupNumber);
            if (group.length < 4) return 'hidden';
            const unlocked = group.every(surah => surah.isCompleted);
            const result = getMiniExamResult(groupNumber);
            if (result && result.score >= 70) return 'done';
            return unlocked ? 'current' : 'locked';
        }

        function renderMiniExamCard(groupNumber) {
            const group = getMiniExamGroup(groupNumber);
            const state = getMiniExamState(groupNumber);
            if (state === 'hidden') return '';
            const result = getMiniExamResult(groupNumber);
            const icon = state === 'done' ? '✓' : state === 'current' ? '★' : '🔒';
            const disabled = state === 'locked' ? 'disabled aria-disabled="true"' : '';
            const action = state === 'locked' ? '' : 'onclick="openMiniExam(' + groupNumber + ')"';
            const label = state === 'done' ? 'تم الاختبار • ' + result.score + '%' : state === 'current' ? 'اختبار مفتوح' : 'أكمل 4 سور';
            const names = group.map(s => s.nameAr).join('، ');
            return '<div class="journey-step mini-exam-step">' +
                '<div class="journey-orb mini-exam-orb ' + state + '" aria-hidden="true">' + icon + '</div>' +
                '<button type="button" ' + action + ' ' + disabled + ' class="journey-node mini-exam-node ' + state + '">' +
                    '<div class="min-w-0 flex-grow">' +
                        '<div class="flex items-center justify-between gap-2 mb-1">' +
                            '<h3 class="text-lg font-black">اختبار صغير ' + groupNumber + '</h3>' +
                            '<span class="journey-state">' + label + '</span>' +
                        '</div>' +
                        '<p class="journey-meta">مراجعة: ' + names + '</p>' +
                    '</div>' +
                '</button>' +
            '</div>';
        }

        function buildMiniExamQuestions(group) {
            const options = group.map(s => s.nameAr);
            const byAyat = [...group].sort((a, b) => b.ayat - a.ayat)[0];
            return [
                { prompt: 'أي سورة رقمها ' + group[0].num + '؟', answer: group[0].nameAr, options },
                { prompt: 'أي سورة في هذا المستوى عدد آياتها ' + byAyat.ayat + '؟', answer: byAyat.nameAr, options },
                { prompt: 'ما أول سورة في هذا المستوى؟', answer: group[0].nameAr, options },
                { prompt: 'ما السورة التي تفتح المستوى التالي؟', answer: group[group.length - 1].nameAr, options }
            ];
        }

        function escapeMiniExamText(text) {
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function ensureMiniExamModal() {
            let modal = document.getElementById('mini-exam-modal');
            if (modal) return modal;
            modal = document.createElement('div');
            modal.id = 'mini-exam-modal';
            modal.className = 'mini-exam-modal';
            modal.innerHTML = '<div class="mini-exam-card" dir="rtl"><div class="flex items-start justify-between gap-3 mb-4"><div><p class="text-xs font-black text-orange-600">مراجعة قصيرة</p><h3 id="mini-exam-title" class="text-xl font-black text-gray-900"></h3></div><button type="button" onclick="closeMiniExam()" class="w-9 h-9 rounded-full bg-gray-100 text-gray-600 font-black">×</button></div><div id="mini-exam-body"></div></div>';
            document.body.appendChild(modal);
            modal.addEventListener('click', event => { if (event.target === modal) closeMiniExam(); });
            return modal;
        }

        let activeMiniExam = null;
        let activeMiniGame = null;

        function openMiniExam(groupNumber) {
            const group = getMiniExamGroup(groupNumber);
            if (group.length < 4 || !group.every(surah => surah.isCompleted)) return;
            activeMiniExam = { groupNumber, questions: buildMiniExamQuestions(group), index: 0, correct: 0 };
            ensureMiniExamModal().classList.add('open');
            renderMiniExamQuestion();
        }

        function closeMiniExam() {
            const modal = document.getElementById('mini-exam-modal');
            if (modal) modal.classList.remove('open');
        }

        function renderMiniExamQuestion() {
            const body = document.getElementById('mini-exam-body');
            if (!activeMiniExam || !body) return;
            const q = activeMiniExam.questions[activeMiniExam.index];
            document.getElementById('mini-exam-title').textContent = 'اختبار صغير ' + activeMiniExam.groupNumber;
            body.innerHTML = '<div class="mb-3 text-sm font-black text-gray-500">سؤال ' + (activeMiniExam.index + 1) + ' / ' + activeMiniExam.questions.length + '</div>' +
                '<div class="rounded-2xl bg-orange-50 border border-orange-100 p-4 font-black text-gray-900 mb-4">' + escapeMiniExamText(q.prompt) + '</div>' +
                '<div class="space-y-2">' + q.options.map(option => '<button type="button" class="mini-exam-option" data-answer="' + escapeMiniExamText(option) + '">' + escapeMiniExamText(option) + '</button>').join('') + '</div>';
            body.querySelectorAll('.mini-exam-option').forEach(button => {
                button.addEventListener('click', () => answerMiniExam(button, button.dataset.answer));
            });
        }

        function answerMiniExam(button, answer) {
            if (!activeMiniExam) return;
            const q = activeMiniExam.questions[activeMiniExam.index];
            const options = Array.from(document.querySelectorAll('.mini-exam-option'));
            options.forEach(option => {
                option.disabled = true;
                if (option.textContent === q.answer) option.classList.add('correct');
            });
            if (answer === q.answer) {
                activeMiniExam.correct++;
                button.classList.add('correct');
            } else {
                button.classList.add('wrong');
            }
            setTimeout(() => {
                activeMiniExam.index++;
                if (activeMiniExam.index >= activeMiniExam.questions.length) finishMiniExam();
                else renderMiniExamQuestion();
            }, 700);
        }

        function finishMiniExam() {
            const score = Math.round((activeMiniExam.correct / activeMiniExam.questions.length) * 100);
            const passed = score >= 70;
            localStorage.setItem(getMiniExamKey(activeMiniExam.groupNumber), JSON.stringify({ score, passed, date: new Date().toISOString() }));
            const body = document.getElementById('mini-exam-body');
            body.innerHTML = '<div class="text-center py-5"><div class="mx-auto mb-4 w-20 h-20 rounded-full grid place-items-center text-2xl font-black ' + (passed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700') + '">' + score + '%</div><h4 class="text-xl font-black text-gray-900 mb-2">' + (passed ? 'ممتاز، الاختبار مكتمل' : 'محاولة جيدة، أعد الاختبار') + '</h4><p class="text-sm font-bold text-gray-500 mb-4">نتيجتك: ' + activeMiniExam.correct + ' / ' + activeMiniExam.questions.length + '</p><button type="button" onclick="closeMiniExam(); renderSurahLibrary();" class="px-5 py-2 rounded-full bg-emerald-600 text-white font-black">العودة للمسار</button></div>';
        }

        function shuffleMiniGame(items) {
            return [...items].sort(() => Math.random() - 0.5);
        }

        function verseSnippet(verse) {
            const text = String(verse?.text || verse?.label || '');
            return escapeMiniExamText(text.length > 72 ? text.slice(0, 72) + '…' : text);
        }

        async function loadMiniGameVerses(group) {
            const surah = group.find(item => item.isCompleted) || group[0];
            if (!surah || !surah.file) return { surah, verses: [] };
            try {
                const html = await fetch(surah.file, { cache: 'no-store' }).then(response => response.text());
                const match = html.match(/const verses = (\[[\s\S]*?\]);/);
                const verses = match ? JSON.parse(match[1]) : [];
                return { surah, verses: verses.filter(v => v && v.text).slice(0, 8) };
            } catch (error) {
                return { surah, verses: [] };
            }
        }

        function buildMiniGameStages(group, loaded) {
            const surah = loaded.surah || group[0];
            const sourceVerses = loaded.verses.length ? loaded.verses : [
                { num: 1, text: surah.nameAr + ' - الآية 1' },
                { num: 2, text: surah.nameAr + ' - الآية 2' },
                { num: 3, text: surah.nameAr + ' - الآية 3' }
            ];
            return sourceVerses.slice(0, Math.min(4, sourceVerses.length)).map((verse, index) => {
                const pool = shuffleMiniGame(sourceVerses.filter(v => v.num !== verse.num)).slice(0, 3);
                return { surah, verse, options: shuffleMiniGame([verse, ...pool]), index };
            });
        }

        function ensureMiniGameModal() {
            let modal = document.getElementById('mini-game-modal');
            if (modal) return modal;
            modal = document.createElement('div');
            modal.id = 'mini-game-modal';
            modal.className = 'mini-exam-modal';
            modal.innerHTML = '<div class="mini-exam-card" dir="rtl"><div class="flex items-start justify-between gap-3 mb-4"><div><p id="mini-game-kicker" class="text-xs font-black text-cyan-600"></p><h3 id="mini-game-title" class="text-xl font-black text-gray-900"></h3></div><button type="button" onclick="closeMiniGame()" class="w-9 h-9 rounded-full bg-gray-100 text-gray-600 font-black">×</button></div><div id="mini-game-body"></div></div>';
            document.body.appendChild(modal);
            modal.addEventListener('click', event => { if (event.target === modal) closeMiniGame(); });
            return modal;
        }

        async function openMiniGame(gameNumber) {
            const group = getMiniGameGroup(gameNumber);
            if (group.length < 2 || !group.some(surah => surah.isCompleted)) return;
            const config = getMiniGameConfig(gameNumber);
            const loaded = await loadMiniGameVerses(group);
            activeMiniGame = {
                gameNumber,
                config,
                stages: buildMiniGameStages(group, loaded),
                index: 0,
                correct: 0,
                selectedOrder: []
            };
            ensureMiniGameModal().classList.add('open');
            renderMiniGameScene();
        }

        function closeMiniGame() {
            const modal = document.getElementById('mini-game-modal');
            if (modal) modal.classList.remove('open');
        }

        function renderMiniGameScene() {
            const body = document.getElementById('mini-game-body');
            if (!activeMiniGame || !body) return;
            const stage = activeMiniGame.stages[activeMiniGame.index];
            const progress = Math.round((activeMiniGame.correct / activeMiniGame.stages.length) * 100);
            document.getElementById('mini-game-kicker').textContent = activeMiniGame.config.hint;
            document.getElementById('mini-game-title').textContent = activeMiniGame.config.icon + ' ' + activeMiniGame.config.title;
            body.innerHTML = renderMiniGameByType(activeMiniGame.config.type, stage, progress);
        }

        function renderMiniGameByType(type, stage, progress) {
            const target = stage.verse.num;
            const label = 'الهدف: الآية ' + target + ' من ' + stage.surah.nameAr;
            if (type === 'race') {
                return '<div class="mini-game-track"><div class="mini-game-car" style="right:' + Math.min(220, 8 + progress * 2.2) + 'px"></div></div><div class="mini-game-mission">' + label + '</div><div class="mini-game-lanes">' + stage.options.map(v => '<button class="mini-game-tile lane" onclick="answerMiniGame(' + v.num + ')">' + verseSnippet(v) + '</button>').join('') + '</div>';
            }
            if (type === 'treasure') {
                return '<div class="mini-game-mission">' + label + '</div><div class="mini-game-chests">' + stage.options.map((v, i) => '<button class="mini-game-chest" onclick="this.classList.add(&quot;open&quot;); answerMiniGame(' + v.num + ')">صندوق ' + (i + 1) + '<span>' + verseSnippet(v) + '</span></button>').join('') + '</div>';
            }
            if (type === 'lantern' || type === 'tower') {
                const ordered = [...stage.options].sort((a, b) => a.num - b.num);
                return '<div class="mini-game-mission">رتّب الآيات من الأصغر إلى الأكبر</div><div class="mini-game-order">' + shuffleMiniGame(ordered).map(v => '<button class="mini-game-tile" onclick="selectMiniGameOrder(' + v.num + ')">' + verseSnippet(v) + '</button>').join('') + '</div><div id="mini-game-order-bin" class="mini-game-bin">اختر الترتيب هنا</div>';
            }
            if (type === 'bridge') {
                return '<div class="mini-game-mission">' + label + '</div><div class="mini-game-bridge">' + stage.options.map(v => '<button class="mini-game-pad" onclick="answerMiniGame(' + v.num + ')">' + verseSnippet(v) + '</button>').join('') + '</div>';
            }
            if (type === 'meteor') {
                return '<div class="mini-game-mission">' + label + '</div><div class="mini-game-sky">' + stage.options.map((v, i) => '<button class="mini-game-meteor m' + i + '" onclick="answerMiniGame(' + v.num + ')">' + verseSnippet(v) + '</button>').join('') + '</div>';
            }
            if (type === 'garden') {
                return '<div class="mini-game-mission">' + label + '</div><div class="mini-game-garden">' + stage.options.map(v => '<button class="mini-game-plant" onclick="answerMiniGame(' + v.num + ')">🌱<span>' + verseSnippet(v) + '</span></button>').join('') + '</div>';
            }
            if (type === 'compass') {
                return '<div class="mini-game-mission">' + label + '</div><div class="mini-game-compass">' + stage.options.map(v => '<button onclick="answerMiniGame(' + v.num + ')">' + verseSnippet(v) + '</button>').join('') + '</div>';
            }
            if (type === 'balloon') {
                return '<div class="mini-game-mission">' + label + '</div><div class="mini-game-balloons">' + stage.options.map((v, i) => '<button class="mini-game-balloon b' + i + '" onclick="answerMiniGame(' + v.num + ')">' + verseSnippet(v) + '</button>').join('') + '</div>';
            }
            return '<div class="mini-game-mission">' + label + '</div><div class="mini-game-shields">' + stage.options.map(v => '<button class="mini-game-shield" onclick="answerMiniGame(' + v.num + ')">' + verseSnippet(v) + '</button>').join('') + '</div>';
        }

        function selectMiniGameOrder(num) {
            if (!activeMiniGame) return;
            if (!activeMiniGame.selectedOrder.includes(num)) activeMiniGame.selectedOrder.push(num);
            const bin = document.getElementById('mini-game-order-bin');
            if (bin) bin.textContent = activeMiniGame.selectedOrder.join(' ← ');
            const ordered = activeMiniGame.stages[activeMiniGame.index].options.map(v => v.num).sort((a, b) => a - b);
            if (activeMiniGame.selectedOrder.length === ordered.length) {
                const ok = activeMiniGame.selectedOrder.every((num, index) => num === ordered[index]);
                activeMiniGame.selectedOrder = [];
                completeMiniGameMove(ok);
            }
        }

        function answerMiniGame(num) {
            if (!activeMiniGame) return;
            const stage = activeMiniGame.stages[activeMiniGame.index];
            completeMiniGameMove(Number(num) === Number(stage.verse.num));
        }

        function completeMiniGameMove(ok) {
            document.querySelectorAll('#mini-game-body button').forEach(button => button.disabled = true);
            if (ok) activeMiniGame.correct++;
            setTimeout(() => {
                activeMiniGame.index++;
                if (activeMiniGame.index >= activeMiniGame.stages.length) finishMiniGame();
                else renderMiniGameScene();
            }, 760);
        }

        function finishMiniGame() {
            const score = Math.round((activeMiniGame.correct / activeMiniGame.stages.length) * 100);
            const passed = score >= 70;
            localStorage.setItem(getMiniGameKey(activeMiniGame.gameNumber), JSON.stringify({ score, passed, date: new Date().toISOString() }));
            const body = document.getElementById('mini-game-body');
            body.innerHTML = '<div class="text-center py-5"><div class="mx-auto mb-4 w-20 h-20 rounded-full grid place-items-center text-2xl font-black ' + (passed ? 'bg-cyan-100 text-cyan-700' : 'bg-amber-100 text-amber-700') + '">' + score + '%</div><h4 class="text-xl font-black text-gray-900 mb-2">' + (passed ? 'رائع، اللعبة مكتملة' : 'محاولة جيدة، أعد اللعبة') + '</h4><p class="text-sm font-bold text-gray-500 mb-4">اللعبة: ' + activeMiniGame.config.title + '</p><button type="button" onclick="closeMiniGame(); renderSurahLibrary();" class="px-5 py-2 rounded-full bg-cyan-600 text-white font-black">العودة للمسار</button></div>';
        }

        function getCurrentSurah() {
            const order = getJourneyOrder();
            return order.find(surah => !surah.isCompleted) || order[order.length - 1] || null;
        }

        function getLastCompletedSurah() {
            const order = getJourneyOrder();
            const currentIndex = order.findIndex(surah => !surah.isCompleted);
            if (currentIndex > 0) return order[currentIndex - 1];
            if (currentIndex === -1) return order[order.length - 1] || null;
            return null;
        }

        function scrollToJourneyFocus(event) {
            if (event) event.preventDefault();
            const currentEl = document.querySelector('[data-journey-focus="current"]');
            const lastEl = document.querySelector('[data-journey-focus="last-completed"]');
            const target = currentEl || lastEl || document.getElementById('section-available');
            if (!target) return;
            if (currentEl && lastEl) {
                const lastRect = lastEl.getBoundingClientRect();
                const currentRect = currentEl.getBoundingClientRect();
                const lastCenter = window.scrollY + lastRect.top + lastRect.height / 2;
                const currentCenter = window.scrollY + currentRect.top + currentRect.height / 2;
                const focusCenter = (lastCenter + currentCenter) / 2;
                window.scrollTo({ top: Math.max(0, focusCenter - window.innerHeight * 0.42), behavior: 'smooth' });
                return;
            }
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function isCurrentJuz(juz) {
            const current = getCurrentSurah();
            return !!current && current.num >= juz.start && current.num <= juz.end;
        }

        function getActiveJuzIndex() {
            const index = juzJourney.findIndex(juz => isCurrentJuz(juz));
            return index >= 0 ? index : Math.max(0, juzJourney.length - 1);
        }

        function renderSurahLibrary() {
            const container = document.getElementById('available-grid');
            const filtered = getJourneyOrder();
            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-2xl border border-gray-100 p-8 text-center text-gray-500 font-bold">لا توجد سورة مطابقة لهذا البحث.</div>`;
                return;
            }
            const activeJuzIndex = getActiveJuzIndex();
            container.innerHTML = juzJourney.map((juz, index) => {
                const isActiveSection = index === activeJuzIndex;
                const isNextSection = index === activeJuzIndex + 1;
                if (!isActiveSection && !isNextSection) return '';
                const items = filtered.filter(s => s.num >= juz.start && s.num <= juz.end);
                if (items.length === 0) return '';
                const allJuzSurahs = dashboardState.surahs.filter(s => s.num >= juz.start && s.num <= juz.end).sort((a, b) => b.num - a.num);
                const fromSurah = allJuzSurahs[0];
                const toSurah = allJuzSurahs[allJuzSurahs.length - 1];
                const completedInJuz = allJuzSurahs.filter(s => s.isCompleted).length;
                const rangeLabel = fromSurah && toSurah ? `من سورة ${fromSurah.nameAr} إلى سورة ${toSurah.nameAr}` : '';
                const sectionState = isActiveSection ? 'is-active' : 'is-muted';
                const visibleItems = isActiveSection ? items : items.slice(0, 2);
                const mutedMessage = isNextSection
                    ? '<div class="mx-4 mb-4 rounded-2xl border border-dashed border-gray-300 bg-gray-50 px-4 py-3 text-center text-xs font-black text-gray-500">أكمل هذا الجزء أولاً، ثم يظهر هذا الجزء كاملاً.</div>'
                    : '';
                return `
                    <section class="juz-section ${sectionState} bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                        <div class="juz-road-header px-4 py-4 flex items-center justify-between gap-3">
                            <div>
                                <h3 class="font-black text-gray-900 text-lg">${juz.name}</h3>
                                <p class="text-xs text-gray-500 font-bold quran-font">${rangeLabel}</p>
                            </div>
                            <span class="bg-white border border-gray-200 rounded-full px-3 py-1 text-xs font-black text-emerald-700">${toArabicNum(completedInJuz)} / ${toArabicNum(allJuzSurahs.length)}</span>
                        </div>
                        <div class="surah-journey">
                            ${visibleItems.map(surah => {
                                const globalIndex = filtered.findIndex(item => item.id === surah.id);
                                const groupNumber = Math.floor((globalIndex + 1) / 4);
                                const gameNumber = Math.floor((globalIndex + 1) / 3);
                                const miniGame = isActiveSection && ((globalIndex + 1) % 3 === 0) ? renderMiniGameCard(gameNumber) : '';
                                const miniExam = sectionState !== 'is-muted' && ((globalIndex + 1) % 4 === 0) ? renderMiniExamCard(groupNumber) : '';
                                return renderSurahCard(surah) + miniGame + miniExam;
                            }).join('')}
                        </div>
                        ${mutedMessage}
                    </section>
                `;
            }).join('');
        }
        // Ajoute ceci dans la fonction d'initialisation de ta page (ex: window.onload)
async function chargerDevoirs() {
            const session = Auth.getSession();
            if (!session) return;
            const devoirs = await Auth.getDevoirs('student', session.username);
            const devoirsEnAttente = devoirs.filter(d => d.statut === 'en_attente');
            const zoneDevoirs = document.getElementById('zone-devoirs');
            if (!zoneDevoirs) return;
            if (devoirsEnAttente.length > 0) {
                zoneDevoirs.innerHTML = devoirsEnAttente.map(function(devoir) {
                    return '<div class="mb-2 rounded-xl bg-rose-50 border border-rose-100 p-2">' +
                        '<div class="font-black text-rose-700">سورة ' + devoir.surate + '</div>' +
                        '<div class="text-[11px] text-gray-600">من الآية ' + devoir.aya_debut + ' إلى ' + devoir.aya_fin + '</div>' +
                        '<button onclick="validerDevoir(\'' + devoir.id + '\')" class="mt-2 rounded-full bg-rose-600 text-white px-3 py-1 text-[11px] font-black">حفظت الواجب</button>' +
                    '</div>';
                }).join('');
            } else {
                zoneDevoirs.innerHTML = '<span class="text-gray-500">لا يوجد واجب حاليًا.</span>';
            }
        }

        async function buildStudentDashboard() {
            const session = Auth.getSession();
            if (!session) return;
            dashboardState.studentKey = session.username || session.prenom || 'guest';
            
            // 1. Affichage des messages administratifs
            const userMessages = await Auth.getMessages(session.username);
            const msgContainer = document.getElementById('messages-container');
            if (msgContainer) {
                if (userMessages.length > 0) {
                    msgContainer.innerHTML = userMessages.map(function(m) {
                        return '<div class="mb-2 rounded-xl bg-blue-50 border border-blue-100 p-2">' +
                            '<div class="font-black text-blue-800 text-xs">رسالة من الإدارة</div>' +
                            '<p class="text-blue-900 mt-1">' + m.text + '</p>' +
                            '<button onclick="Auth.clearMessages(\'' + session.username + '\'); window.location.reload();" class="mt-2 rounded-full bg-white text-blue-600 px-3 py-1 text-[11px] font-black shadow-sm">إخفاء</button>' +
                        '</div>';
                    }).join('');
                } else {
                    msgContainer.innerHTML = '<span class="text-gray-500">لا توجد رسائل جديدة.</span>';
                }
            }

            // 2. Affichage des infos de l'élève
            document.getElementById('student-schedule').innerText = await Auth.getSchedule(session.username);
            document.getElementById('student-name').innerText = session.prenom;
            
            // 3. Récupération de la progression
            const progressData = await Auth.getProgress(session.username);
            
            dashboardState.surahs = SURAH_REGISTRY
                .filter(surah => surah.available)
                .map(surah => {
                    const pData = getProgressFor(progressData, surah);
                    const isCompleted = pData.is_completed === true || !!pData.completed_at || !!pData.completedAt || pData.status === 'completed';
                    const score = pData.score || pData.global_score || pData.globalScore || 0;
                    return {
                        ...surah,
                        isCompleted,
                        score,
                        lengthType: getLengthType(surah.ayat)
                    };
                });
            const availableCount = dashboardState.surahs.length;
            const completedCount = dashboardState.surahs.filter(surah => surah.isCompleted).length;
            const progressLabel = document.getElementById('student-progress-label');
            const progressFill = document.getElementById('student-progress-fill');
            if (progressLabel) progressLabel.innerText = `${toArabicNum(completedCount)} / ${toArabicNum(availableCount)}`;
            if (progressFill) {
                const progressPercent = availableCount === 0 ? 0 : Math.round((completedCount / availableCount) * 100);
                progressFill.style.width = `${progressPercent}%`;
            }
            if (typeof Auth.syncRewardsFromSurahs === 'function') Auth.syncRewardsFromSurahs(dashboardState.surahs);
            updateRewardPanel();
            renderSurahLibrary();
            if (window.location.hash === '#surah-focus') setTimeout(scrollToJourneyFocus, 180);
        }

        function updateRewardPanel() {
            if (typeof Auth === 'undefined' || typeof Auth.getRewardState !== 'function') return;
            const rewards = Auth.getRewardState();
            if (!rewards) return;
            const starsEl = document.getElementById('reward-stars');
            const noteEl = document.getElementById('reward-decay-note');
            if (starsEl) starsEl.textContent = rewards.stars || 0;
            if (noteEl && rewards.lostNow > 0) noteEl.textContent = 'نقصت ' + rewards.lostNow + ' نجوم فقط بسبب فترة توقف.';
        }

        chargerDevoirs();
        buildStudentDashboard();
    </script>
