<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنجاز جديد - مواهب المنان</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="platform-theme.css">
  <script src="platform-theme.js"></script>
  <script src="auth.js"></script>
  <script src="registry.js"></script>
  <style>
    body {
      min-height: 100vh;
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 10%, color-mix(in srgb, var(--platform-accent-soft) 75%, transparent), transparent 22rem),
        radial-gradient(circle at 84% 18%, color-mix(in srgb, var(--platform-primary-soft) 75%, transparent), transparent 24rem),
        linear-gradient(145deg, var(--platform-bg), #ffffff);
    }
    .victory-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .victory-card {
      width: min(100%, 760px);
      border-radius: 30px;
      background: rgba(255,255,255,.94);
      border: 1px solid color-mix(in srgb, var(--platform-primary) 18%, transparent);
      box-shadow: 0 30px 90px rgba(15,23,42,.18);
      overflow: hidden;
      position: relative;
    }
    .victory-visual {
      min-height: 210px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--platform-primary-dark), var(--platform-primary));
      color: white;
      position: relative;
      isolation: isolate;
    }
    .victory-visual::before {
      content: '';
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 26px;
      z-index: -1;
    }
    .sigil {
      width: 116px;
      height: 116px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 44px;
      font-weight: 900;
      color: #facc15;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: inset 0 0 0 10px rgba(255,255,255,.07), 0 24px 50px rgba(0,0,0,.18);
      text-shadow: 0 5px 18px rgba(250, 204, 21, .35);
      animation: pulseWin 2.4s ease-in-out infinite;
    }
    .orbit {
      position: absolute;
      width: 170px;
      height: 170px;
      border: 2px dashed rgba(255,255,255,.28);
      border-radius: 999px;
      animation: spin 12s linear infinite;
    }
    .beam {
      position: absolute;
      width: 44%;
      height: 160%;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,.16), transparent);
      transform: rotate(28deg);
      animation: sweep 3.8s ease-in-out infinite;
    }
    .wave {
      position: absolute;
      bottom: -34px;
      width: 115%;
      height: 74px;
      background: rgba(255,255,255,.16);
      border-radius: 50%;
      animation: floatWave 4s ease-in-out infinite;
    }
    .victory-body { padding: 24px; }
    .kicker { color: var(--platform-primary); font-weight: 900; font-size: 12px; }
    .title { font-size: clamp(28px, 7vw, 48px); line-height: 1.15; font-weight: 900; color: #111827; }
    .subtitle { color: #475569; font-weight: 800; line-height: 1.8; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }
    .stat {
      border-radius: 18px;
      padding: 12px;
      background: linear-gradient(135deg, #f8fafc, #ffffff);
      border: 1px solid #e2e8f0;
    }
    .stat span { display: block; color: #64748b; font-size: 11px; font-weight: 900; }
    .stat strong { display: block; color: #111827; font-size: 24px; font-weight: 900; line-height: 1.1; margin-top: 4px; }
    .stat strong.star-number { color: #d97706; text-shadow: 0 2px 12px rgba(250, 204, 21, .28); }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .actions a {
      flex: 1 1 180px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      font-weight: 900;
      text-align: center;
    }
    .primary-action { background: linear-gradient(135deg, var(--platform-primary), var(--platform-primary-dark)); color: white; }
    .secondary-action { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }

    .variant-first .sigil { animation-name: rise; }
    .variant-checkpoint .orbit { border-style: solid; animation-duration: 6s; }
    .variant-major .victory-visual { background: linear-gradient(135deg, #312e81, var(--platform-primary)); }
    .variant-comeback .victory-visual { background: linear-gradient(135deg, #7c2d12, var(--platform-primary-dark)); }
    .variant-streak .sigil { box-shadow: inset 0 0 0 10px rgba(255,255,255,.08), 0 0 46px rgba(253,230,138,.44); }
    .variant-momentum .beam { animation-duration: 2.4s; }
    .variant-deep-focus .victory-visual { background: linear-gradient(135deg, #0f172a, var(--platform-primary)); }
    .variant-mastery .orbit { width: 210px; height: 210px; }
    .variant-elite .sigil { width: 132px; height: 132px; }
    .variant-steady .wave { animation-duration: 5.6s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulseWin { 0%,100% { transform: scale(1); } 50% { transform: scale(1.055); } }
    @keyframes sweep { 0%,100% { opacity: .2; transform: translateX(-28%) rotate(28deg); } 50% { opacity: .75; transform: translateX(28%) rotate(28deg); } }
    @keyframes floatWave { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes rise { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    @media (max-width: 640px) {
      .victory-shell { padding: 12px; place-items: stretch; align-items: center; }
      .victory-card { border-radius: 24px; }
      .victory-visual { min-height: 184px; }
      .victory-body { padding: 18px; }
      .stats { grid-template-columns: 1fr; }
      .actions a { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main class="victory-shell">
    <article id="victory-card" class="victory-card variant-steady">
      <div class="victory-visual">
        <div class="beam"></div>
        <div class="orbit"></div>
        <div class="sigil" id="victory-symbol">★</div>
        <div class="wave"></div>
      </div>
      <section class="victory-body">
        <p class="kicker" id="victory-kicker">إنجاز جديد</p>
        <h1 class="title" id="victory-title">خطوة قوية</h1>
        <p class="subtitle mt-3" id="victory-subtitle">تم تسجيل تقدمك بنجاح.</p>
        <div class="stats">
          <div class="stat"><span>نجوم جديدة</span><strong id="victory-points" class="star-number">0</strong></div>
          <div class="stat"><span>رصيدك الآن</span><strong id="victory-stars" class="star-number">0</strong></div>
          <div class="stat"><span>السلسلة</span><strong id="victory-streak">0</strong></div>
        </div>
        <div class="actions">
          <a id="next-link" href="dashboard.html" class="primary-action">متابعة المسار</a>
          <a href="dashboard.html" class="secondary-action">العودة للوحة</a>
        </div>
      </section>
    </article>
  </main>

  <script>
    const variants = {
      first: ['أول إنجاز', 'بداية محترمة', 'أول خطوة هي الأصعب، وقد تمت. الآن أصبح المسار واضحا أكثر.', '1'],
      steady: ['ثبات', 'تقدم هادئ', 'ليس المطلوب أن تسرع، المطلوب أن تعود وتكمل. هذا تقدم حقيقي.', '★'],
      checkpoint: ['محطة قوية', 'أربع خطوات مكتملة', 'وصلت إلى محطة مراجعة مهمة. هذا هو النوع من الاستمرار الذي يصنع الحفظ.', '4'],
      major: ['سورة كبيرة', 'جهد واضح', 'هذه ليست خطوة صغيرة. لقد أنهيت جزءا يحتاج تركيزا وصبرا.', '◆'],
      comeback: ['عودة موفقة', 'رجعت للمسار', 'حتى بعد التوقف، العودة نفسها انتصار. النجوم تذكير بأن الباب مفتوح دائما.', '↗'],
      streak: ['سلسلة نشطة', 'إيقاع ممتاز', 'الاستمرار بدأ يتحول إلى عادة. حافظ على هذا الإيقاع الهادئ.', '7'],
      momentum: ['زخم', 'المسار يتحرك', 'عدة سور متتالية تعني أنك لم تعد تتعامل مع الحفظ كواجب فقط، بل كمسار.', '∞'],
      'deep-focus': ['تركيز عميق', 'مرحلة أعلى', 'أنت الآن تدخل منطقة تحتاج مراجعة أذكى، لا مجهودا أكثر فقط.', '◈'],
      mastery: ['تمكن', 'رصيد واضح', 'عدد السور المنجزة صار له وزن. المرحلة القادمة تحتاج تثبيت ومراجعة.', '20'],
      elite: ['مستوى متقدم', 'إنجاز كبير', 'هذا مستوى لا يصل إليه الإنسان بالصدفة. الاستمرار صار جزءا من هويتك.', '50'],
      'try-again': ['محاولة محفوظة', 'أعدها بثبات', 'لم تُفتح السورة التالية بعد، لكن المحاولة سُجلت.', '↻']
    };

    function getPayload() {
      if (typeof Auth !== 'undefined' && Auth.getLastCelebration) return Auth.getLastCelebration();
      return null;
    }

    function renderVictory() {
      const payload = getPayload() || { variant: 'steady', points: 0, stars: 0, streak: 0, surahName: 'السورة', nextUrl: 'dashboard.html', completedCount: 0 };
      const variant = variants[payload.variant] ? payload.variant : 'steady';
      const copy = variants[variant];
      const card = document.getElementById('victory-card');
      card.className = 'victory-card variant-' + variant;
      document.getElementById('victory-kicker').textContent = copy[0];
      document.getElementById('victory-title').textContent = copy[1];
      document.getElementById('victory-subtitle').textContent = copy[2] + ' ' + (payload.surahName ? 'تمت: ' + payload.surahName : '');
      document.getElementById('victory-symbol').textContent = copy[3];
      document.getElementById('victory-points').textContent = '+' + (payload.points || 0);
      document.getElementById('victory-stars').textContent = payload.stars || 0;
      document.getElementById('victory-streak').textContent = payload.streak || 0;
      const returnUrl = 'dashboard.html#surah-focus';
      document.getElementById('next-link').href = returnUrl;
      setTimeout(() => { window.location.href = returnUrl; }, 3600);
      if (window.confetti) {
        const intensity = Math.min(150, 55 + Number(payload.points || 0) * 10);
        confetti({ particleCount: intensity, spread: 68, origin: { y: 0.28 }, scalar: 0.86 });
        setTimeout(() => confetti({ particleCount: Math.floor(intensity / 2), spread: 110, origin: { y: 0.55 }, scalar: 0.72 }), 450);
      }
    }

    if (typeof Auth !== 'undefined' && !Auth.getSession()) {
      window.location.href = 'login.html';
    } else {
      renderVictory();
    }
  </script>
</body>
</html>
