<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>بداية سريعة - مواهب المنان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <script src="auth.js?v=20260709-onboarding-games"></script>
    <style>
        :root { --green: #14532d; --deep: #0c4a3b; --gold: #facc15; --soft: #ecfdf5; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: 'Cairo', sans-serif;
            background:
                radial-gradient(circle at 15% 12%, rgba(250,204,21,.24), transparent 28%),
                radial-gradient(circle at 86% 18%, rgba(52,211,153,.2), transparent 26%),
                linear-gradient(145deg, #f8faf7 0%, #eef7ee 52%, #f6f1df 100%);
            color: #10231d;
        }
        .onboarding-shell { min-height: 100vh; display: grid; place-items: center; padding: 18px; }
        .onboarding-card {
            width: min(100%, 760px); min-height: min(720px, calc(100vh - 36px));
            background: rgba(255,255,255,.88); border: 1px solid rgba(20,83,45,.12);
            border-radius: 28px; box-shadow: 0 28px 80px rgba(15,23,42,.16);
            overflow: hidden; display: grid; grid-template-rows: auto 1fr auto;
        }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--deep); }
        .brand img { width: 42px; height: 42px; object-fit: contain; border-radius: 12px; background: #fff; }
        .skip-btn { color: #64748b; font-weight: 900; font-size: 12px; padding: 8px 10px; border-radius: 999px; }
        .slide { display: none; min-height: 480px; padding: 18px 22px 10px; align-content: center; }
        .slide.active { display: grid; animation: rise .28s ease both; }
        .visual { min-height: 250px; display: grid; place-items: center; position: relative; }
        .mascot {
            width: 138px; height: 138px; position: relative; filter: drop-shadow(0 16px 22px rgba(15,23,42,.14));
            animation: float 3.2s ease-in-out infinite;
        }
        .star-shape {
            position: absolute; inset: 0; background: linear-gradient(145deg, #fde047, #f59e0b);
            clip-path: polygon(50% 2%, 62% 34%, 96% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 4% 35%, 38% 34%);
        }
        .face { position: absolute; inset: 45px 35px auto; height: 34px; }
        .eye { position: absolute; top: 0; width: 13px; height: 13px; background: #0f172a; border-radius: 999px; }
        .eye:first-child { right: 18px; }
        .eye:nth-child(2) { left: 18px; }
        .smile { position: absolute; left: 50%; top: 17px; width: 34px; height: 17px; border: 4px solid #0f172a; border-top: 0; border-radius: 0 0 999px 999px; transform: translateX(-50%); }
        .bubble {
            position: absolute; right: calc(50% + 38px); top: 18px; max-width: 260px;
            background: #fff; border: 1px solid rgba(20,83,45,.12); border-radius: 22px 22px 6px 22px;
            padding: 12px 14px; font-size: 14px; font-weight: 900; color: var(--deep);
            box-shadow: 0 14px 28px rgba(15,23,42,.09);
        }
        .bubble::after { content: ""; position: absolute; right: 18px; bottom: -9px; border: 9px solid transparent; border-top-color: #fff; }
        .mini-path { position: absolute; bottom: 18px; display: flex; gap: 14px; align-items: center; }
        .path-dot { width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; font-weight: 900; color: #fff; background: #d1d5db; border: 4px solid #fff; box-shadow: 0 10px 22px rgba(15,23,42,.13); }
        .path-dot.done { background: #10b981; }
        .path-dot.current { background: var(--green); transform: scale(1.14); }
        .exercise-grid { position: absolute; bottom: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(100%, 430px); }
        .exercise { background: #fff; border: 1px solid rgba(20,83,45,.12); border-radius: 16px; padding: 12px 8px; text-align: center; font-size: 12px; font-weight: 900; color: var(--deep); }
        .stars-row { position: absolute; bottom: 26px; display: flex; gap: 8px; font-size: 34px; color: var(--gold); text-shadow: 0 6px 16px rgba(217,119,6,.22); }
        .info-row { position: absolute; bottom: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(100%, 500px); }
        .info-card { background: #fff; border: 1px solid rgba(20,83,45,.12); border-radius: 16px; padding: 13px 10px; text-align: center; font-size: 12px; font-weight: 900; color: var(--deep); }
        .copy { text-align: center; max-width: 560px; margin: 0 auto; }
        .eyebrow { color: #059669; font-size: 12px; font-weight: 900; margin-bottom: 8px; }
        h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.15; margin: 0; font-weight: 900; color: #0f172a; }
        p { margin: 12px auto 0; color: #475569; font-weight: 800; line-height: 1.8; max-width: 520px; }
        .footer { padding: 16px 18px 18px; display: grid; gap: 14px; }
        .dots { display: flex; justify-content: center; gap: 7px; }
        .dot { width: 8px; height: 8px; border-radius: 999px; background: #cbd5e1; transition: width .2s ease, background .2s ease; }
        .dot.active { width: 28px; background: var(--green); }
        .actions { display: flex; justify-content: space-between; gap: 10px; }
        .nav-btn { border: 0; border-radius: 16px; padding: 12px 18px; font-weight: 900; transition: transform .16s ease, opacity .16s ease; }
        .nav-btn:active { transform: scale(.98); }
        .back-btn { background: #eef2f7; color: #475569; }
        .next-btn { background: linear-gradient(135deg, var(--green), #059669); color: #fff; flex: 1; box-shadow: 0 14px 30px rgba(20,83,45,.22); }
        .back-btn[disabled] { opacity: .35; }
        @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(-1.5deg); } }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 640px) {
            .onboarding-shell { padding: 10px; }
            .onboarding-card { min-height: calc(100vh - 20px); border-radius: 22px; }
            .topbar { padding: 12px; }
            .slide { padding: 10px 14px; min-height: 470px; }
            .visual { min-height: 270px; }
            .mascot { width: 106px; height: 106px; }
            .face { inset: 34px 26px auto; transform: scale(.82); }
            .bubble { right: auto; left: 10px; top: 10px; max-width: 190px; font-size: 12px; padding: 10px 12px; }
            .exercise-grid, .info-row { grid-template-columns: 1fr 1fr; width: 100%; }
            .stars-row { font-size: 28px; }
            h1 { font-size: 26px; }
            p { font-size: 14px; }
        }
    </style>
</head>
<body>
    <main class="onboarding-shell">
        <section class="onboarding-card" aria-label="تعريف سريع بالمنصة">
            <header class="topbar">
                <div class="brand">
                    <img src="logo.webp" alt="مواهب المنان">
                    <span>مواهب المنان</span>
                </div>
                <button type="button" class="skip-btn" onclick="finishOnboarding()">تخطي</button>
            </header>

            <div id="slides"></div>

            <footer class="footer">
                <div id="dots" class="dots"></div>
                <div class="actions">
                    <button id="back-btn" type="button" class="nav-btn back-btn" onclick="previousSlide()">السابق</button>
                    <button id="next-btn" type="button" class="nav-btn next-btn" onclick="nextSlide()">التالي</button>
                </div>
            </footer>
        </section>
    </main>

    <script>
        const APP_VERSION = '20260709-onboarding-games';
        const session = Auth.getSession();
        if (!session) window.location.href = 'login.html?v=' + APP_VERSION;
        if (session && session.role === 'prof') window.location.href = 'dashboard_prof.html?v=' + APP_VERSION;

        const slides = [
            {
                eyebrow: 'بداية هادئة',
                title: 'مرحبا بك في مواهب المنان',
                text: 'هنا ستتقدم خطوة بخطوة في حفظ السور.',
                bubble: 'نبدأ معك من خطوة واضحة.'
            },
            {
                eyebrow: 'مسار واضح',
                title: 'اتبع مسار السور',
                text: 'كل سورة تفتح لك السورة التالية حتى تتقدم بثبات.',
                bubble: 'أنجز الحالية، ثم تظهر التالية.',
                visual: '<div class="mini-path"><div class="path-dot done">✓</div><div class="path-dot current">2</div><div class="path-dot">3</div><div class="path-dot">4</div></div>'
            },
            {
                eyebrow: 'تدريب قصير',
                title: 'استمع، رتّب، أكمل، ثم راجع',
                text: 'كل تمرين يساعدك على تثبيت الحفظ دون استعجال.',
                bubble: 'ركّز على تمرين واحد في كل مرة.',
                visual: '<div class="exercise-grid"><div class="exercise">استمع</div><div class="exercise">رتّب</div><div class="exercise">أكمل</div><div class="exercise">راجع</div></div>'
            },
            {
                eyebrow: 'تحفيز متوازن',
                title: 'اجمع النجوم بتقدمك',
                text: 'النجوم تكافئ الجهد، وقد تنقص قليلاً إذا توقفت مدة طويلة.',
                bubble: 'الاستمرار أهم من السرعة.',
                visual: '<div class="stars-row"><span>★</span><span>★</span><span>★</span><span>★</span></div>'
            },
            {
                eyebrow: 'متابعة يومية',
                title: 'تابع واجباتك ورسائلك',
                text: 'ستجد واجباتك، أوقات الحصة، ورسائل الإدارة في أعلى لوحة الطالب.',
                bubble: 'كل ما يهمك قريب منك.',
                visual: '<div class="info-row"><div class="info-card">الواجب</div><div class="info-card">الحصة</div><div class="info-card">الرسائل</div></div>'
            }
        ];

        let current = 0;
        const slidesRoot = document.getElementById('slides');
        const dotsRoot = document.getElementById('dots');
        const backBtn = document.getElementById('back-btn');
        const nextBtn = document.getElementById('next-btn');

        function mascotHtml(bubble) {
            return '<div class="mascot" aria-hidden="true"><div class="star-shape"></div><div class="face"><span class="eye"></span><span class="eye"></span><span class="smile"></span></div></div><div class="bubble">' + bubble + '</div>';
        }

        function render() {
            slidesRoot.innerHTML = slides.map((slide, index) => (
                '<article class="slide ' + (index === current ? 'active' : '') + '">' +
                    '<div class="visual">' + mascotHtml(slide.bubble) + (slide.visual || '') + '</div>' +
                    '<div class="copy"><div class="eyebrow">' + slide.eyebrow + '</div><h1>' + slide.title + '</h1><p>' + slide.text + '</p></div>' +
                '</article>'
            )).join('');
            dotsRoot.innerHTML = slides.map((_, index) => '<span class="dot ' + (index === current ? 'active' : '') + '"></span>').join('');
            backBtn.disabled = current === 0;
            nextBtn.textContent = current === slides.length - 1 ? 'ابدأ الآن' : 'التالي';
        }

        function onboardingKey() {
            return 'mawahib_onboarding_seen_' + (session ? session.username : 'guest');
        }

        function finishOnboarding() {
            try { localStorage.setItem(onboardingKey(), 'yes'); } catch (error) {}
            window.location.href = 'dashboard.html?v=' + APP_VERSION;
        }

        function nextSlide() {
            if (current >= slides.length - 1) return finishOnboarding();
            current++;
            render();
        }

        function previousSlide() {
            if (current === 0) return;
            current--;
            render();
        }

        render();
    </script>
</body>
</html>
